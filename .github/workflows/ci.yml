name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # --- Doc gate: provenance drift in LIVE docs (issue #92) ---
      - name: doc-lint (provenance drift-gate)
        run: python3 scripts/doc_lint.py

      # --- Rust gates (the brain) ---
      - name: cargo test
        run: cargo test --workspace

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo build (wasm32)
        run: cargo build --workspace --target wasm32-unknown-unknown

      # --- Build the wasm pkg the web app consumes ---
      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest

      - name: Build wasm pkg
        run: wasm-pack build --target web --out-dir pkg
        working-directory: crates/bert-lenses-kernel

      # --- Web gates (the face) — depend on the freshly built pkg ---
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: npm ci
        run: npm ci
        working-directory: web

      - name: check:tokens (design-token drift-gate)
        run: npm run check:tokens
        working-directory: web

      - name: tsc --noEmit
        run: npx tsc --noEmit
        working-directory: web

      # serde↔TS contract fixtures: validate the committed fixtures the Rust
      # tests write against the TS boundary mirrors (drift fails the build).
      - name: vitest (contract fixtures)
        run: npx vitest run
        working-directory: web

      - name: vite build
        run: npx vite build
        working-directory: web
