name: Model refusal
description: The kernel accepted or refused a model, and you believe it should not have.
labels: ["theory"]
body:
  - type: markdown
    attributes:
      value: |
        A verdict is only arguable against a cited definition. This template asks for the three things a maintainer needs to check the kernel against the tradition: the model, the lens, and the rule you expected. The vocabulary is in `docs/glossary.md` and `docs/language/terminology-concordance.md`; what each lens takes and drops is in `docs/theory-fidelity.md`.
  - type: textarea
    id: sl
    attributes:
      label: The model, as SL
      description: Paste the SL text (the SL pane shows it; `bert compile` accepts it). Keep it as small as still shows the problem.
      render: text
    validations:
      required: true
  - type: dropdown
    id: lens
    attributes:
      label: Lens
      options: [Klir, Bunge, Mobus]
    validations:
      required: true
  - type: textarea
    id: verdict
    attributes:
      label: The verdict you got
      description: Paste the refusal text as shown (it names a rule and a repair), or say "accepted" if the problem is an acceptance.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: The rule you expected
      description: Which definition or condition in the tradition you think decides this the other way. A page or section reference is ideal; a sentence in your own words is fine.
    validations:
      required: true
