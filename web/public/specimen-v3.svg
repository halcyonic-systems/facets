<svg xmlns="http://www.w3.org/2000/svg" width="920" height="620" viewBox="0 0 920 620" font-family="Inter, system-ui, sans-serif">
  <defs>
    <style>
      .role { fill: #1a1a2e; font-size: 13px; font-weight: 600; }
      .sub  { fill: #8888a8; font-size: 11px; font-family: "JetBrains Mono", ui-monospace, monospace; }
      .sect { fill: #4a4a6a; font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; }
      .title{ fill: #1a1a2e; font-size: 20px; font-weight: 700; }
    </style>
  </defs>

  <rect x="0" y="0" width="920" height="620" fill="#f5f5fb"/>
  <rect x="24" y="24" width="872" height="572" rx="14" fill="#ffffff" stroke="#e4e1ec"/>

  <text x="48" y="62" class="title">Palette shape vocabulary — v3</text>
  <text x="48" y="84" class="sub">bert-lenses #81</text>

  <!-- ===== NODE SHAPES (MOBUS) ===== -->
  <text x="48" y="126" class="sect">Node shapes</text>

  <!-- Component -->
  <g transform="translate(120,190)">
    <circle r="26" fill="#ffffff" stroke="#55617a" stroke-width="1.75"/>
  </g>
  <text x="120" y="240" text-anchor="middle" class="role">Component</text>

  <!-- Regulator -->
  <g transform="translate(300,190)">
    <polygon points="0,-26 22.5,13 -22.5,13" fill="#ffffff" stroke="#55617a" stroke-width="1.75" stroke-linejoin="round"/>
  </g>
  <text x="300" y="240" text-anchor="middle" class="role">Regulator</text>

  <!-- Environment object -->
  <g transform="translate(480,190)">
    <rect x="-24" y="-24" width="48" height="48" rx="6" fill="none" stroke="#55617a" stroke-width="1.75"/>
  </g>
  <text x="480" y="240" text-anchor="middle" class="role">Environment object</text>

  <!-- Process badge -->
  <g transform="translate(680,190)">
    <circle r="26" fill="#ffffff" stroke="#55617a" stroke-width="1.75"/>
    <g transform="translate(18.7,-18.7)">
      <circle r="10" fill="#ffffff" stroke="#0e8a8a" stroke-width="1"/>
      <text text-anchor="middle" dominant-baseline="central" font-size="9" fill="#0e8a8a" font-family="JetBrains Mono, monospace">Cm</text>
    </g>
  </g>
  <text x="680" y="240" text-anchor="middle" class="role">Process (badge)</text>

  <!-- ===== INTERFACES ===== -->
  <text x="48" y="298" class="sect">Interfaces — direction by shape</text>

  <!-- Receives -->
  <g transform="translate(120,362)">
    <line x1="-46" y1="0" x2="46" y2="0" stroke="#55617a" stroke-width="1.5" stroke-dasharray="5 3" opacity="0.5"/>
    <polygon points="0,15 11,4 11,-15 -11,-15 -11,4" fill="#ffffff" stroke="#0e8a8a" stroke-width="1.75" stroke-linejoin="round"/>
  </g>
  <text x="120" y="410" text-anchor="middle" class="role">Interface — receives</text>

  <!-- Exports -->
  <g transform="translate(340,362)">
    <line x1="-46" y1="0" x2="46" y2="0" stroke="#55617a" stroke-width="1.5" stroke-dasharray="5 3" opacity="0.5"/>
    <polygon points="0,-15 11,-4 11,15 -11,15 -11,-4" fill="#ffffff" stroke="#0e8a8a" stroke-width="1.75" stroke-linejoin="round"/>
  </g>
  <text x="340" y="410" text-anchor="middle" class="role">Interface — exports</text>

  <!-- Hybrid -->
  <g transform="translate(560,362)">
    <line x1="-46" y1="0" x2="46" y2="0" stroke="#55617a" stroke-width="1.5" stroke-dasharray="5 3" opacity="0.5"/>
    <polygon points="0,-15 12,0 0,15 -12,0" fill="#ffffff" stroke="#0e8a8a" stroke-width="1.75" stroke-linejoin="round"/>
  </g>
  <text x="560" y="410" text-anchor="middle" class="role">Interface — hybrid</text>

  <!-- Interface-bearing component -->
  <g transform="translate(760,362)">
    <circle r="26" fill="#ffffff" stroke="#55617a" stroke-width="1.75"/>
    <polygon transform="translate(26,0)" points="7,0 -2,-4 -2,4" fill="#0e8a8a"/>
  </g>
  <text x="760" y="410" text-anchor="middle" class="role">Interface-bearing</text>

  <!-- ===== LENS-SPECIFIC MARKINGS ===== -->
  <text x="48" y="468" class="sect">Lens markings</text>

  <!-- Boundary (Bunge) -->
  <g transform="translate(120,520)">
    <circle r="30" fill="none" stroke="#5b53c6" stroke-width="2.25" stroke-opacity="0.9"/>
    <circle r="26" fill="#ffffff" stroke="#55617a" stroke-width="1.75"/>
  </g>
  <text x="120" y="568" text-anchor="middle" class="role">Boundary (Bunge)</text>

  <!-- Environment (Bunge, filled) -->
  <g transform="translate(300,520)">
    <rect x="-24" y="-24" width="48" height="48" rx="6" fill="#ececf6" stroke="#55617a" stroke-width="1.75"/>
  </g>
  <text x="300" y="568" text-anchor="middle" class="role">Environment (Bunge)</text>

  <!-- Klir thing (uniform circle) -->
  <g transform="translate(480,520)">
    <circle r="26" fill="#ffffff" stroke="#55617a" stroke-width="1.25" stroke-opacity="0.4"/>
  </g>
  <text x="480" y="568" text-anchor="middle" class="role">Thing (Klir)</text>

  <!-- reduced-scale strip -->
  <g transform="translate(660,520)">
    <circle cx="0" cy="0" r="9" fill="#ffffff" stroke="#55617a" stroke-width="1"/>
    <polygon points="38,-8 45.8,4 30.2,4" fill="#ffffff" stroke="#55617a" stroke-width="1" stroke-linejoin="round"/>
    <rect x="68" y="-8" width="16" height="16" rx="2" fill="none" stroke="#55617a" stroke-width="1"/>
    <polygon points="112,4 116,0 116,-8 104,-8 104,0" fill="#ffffff" stroke="#0e8a8a" stroke-width="1" stroke-linejoin="round"/>
    <polygon points="140,-4 148,0 140,4 132,0" fill="#ffffff" stroke="#0e8a8a" stroke-width="1" stroke-linejoin="round"/>
  </g>
  <text x="720" y="568" text-anchor="middle" class="role">Reduced scale</text>
</svg>
