[package]
name = "bert-lenses-kernel"
version = "0.1.0"
edition = "2021"
description = "The JS-facing wasm boundary: thin wasm-bindgen wrappers over bert-core + bert-compose + the CSV tether. All truth, zero UI."
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bert-core = { path = "../bert-core" }
bert-compose = { path = "../bert-compose" }
bert-canvas = { path = "../bert-canvas" }
bert-tether = { path = "../bert-tether" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"

# wasm-only: routes a panic message to console.error before the trap, so a
# violation of API.md's no-panic contract is diagnosable instead of anonymous.
[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"

[features]
# Off by default and never enabled for a shipped build — see `__trap_probe`.
panic-probe = []

# wasm-opt runs as MVP by default, and the panic hook's closure machinery emits a
# second function table — legal since the reference-types proposal, but a parse
# error to an MVP-only wasm-opt ("Only 1 table definition allowed in MVP"). CI
# caches its own wasm-opt binary, so which version runs is not ours to choose;
# naming the feature makes the build independent of that. Found by the desktop
# gate on its first run — the local build had a newer wasm-opt and never saw it.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ['-O', '--enable-reference-types']
