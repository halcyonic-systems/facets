[package]
name = "bert-compose"
version = "0.1.0"
edition = "2021"
description = "The executable dynamical face: the conservation-faithful circuit engine + JSON seam, vendored engine-only and wasm-clean (no egui/eframe/ureq/rfd)"
license = "Apache-2.0"

[dependencies]
bert-core = { path = "../bert-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
glam = { version = "0.30", features = ["serde"] }
