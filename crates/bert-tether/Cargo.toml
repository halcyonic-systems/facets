[package]
name = "bert-tether"
version = "0.1.0"
edition = "2021"
description = "The boundary-interface subsystem: the CSV import ritual (tether), the declarative run manifest, and the forced-run pipeline. Pure Rust, no wasm-bindgen — neither engine physics nor marshaling, but the interface between empirical data and the executable model."
license = "MIT"
# Not on crates.io. These five crates are vendored into this repository and
# distributed only as the wasm kernel inside the app, never as separate
# packages. Stated rather than implied so cargo-deny can read it: it is what
# makes the `path` dependencies between them a fact about this tree instead of
# an unpinned supply-chain surface. Also keeps a publish from going out ahead
# of the licence decision in ../../LICENSE.
publish = false

[dependencies]
bert-core = { path = "../bert-core" }
bert-compose = { path = "../bert-compose" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
