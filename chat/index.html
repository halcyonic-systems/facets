<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Facets — Systems Reasoning Engine</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg viewBox='0 0 80 80' xmlns='http://www.w3.org/2000/svg'%3E%3Cpolygon points='40,4 68.3,16.6 76,44.9 59.4,70.1 20.6,70.1 4,44.9 11.7,16.6 40,4' stroke='%233d6373' stroke-width='2' fill='%23ffffff'/%3E%3C/svg%3E">

<meta property="og:description" content="Ask a question. See which facets of systems science it touches.">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f3f6f9">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#16181a">

<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="../shared/frost.css">
<style>
  :root {
    /* Halcyonic Frost alias layer (2026-08-31 unification). Foundation tokens
       come from ../shared/frost.css, generated from web/src/index.css — the
       one place values are edited. Chat's historical names are kept as
       aliases so the rules below need no churn: --ink and friends resolve to
       the printed-record register, --flow (the interactive accent) to Frost
       teal. The old warm-paper palette (Fraunces/Newsreader, #f7f4ef) is
       retired; both facets surfaces now theme from the same sheet, and the
       light-dark() pairs give chat a dark mode for free. */
    --ink-dim: var(--ink-secondary);
    --ink-faint: var(--ink-muted);
    --ground: var(--bg-primary);
    --ground-raised: var(--paper);
    --well: var(--bg-surface);
    --ground-border: var(--border);
    --accent-dim: var(--accent-slate);
    --flow: var(--accent);
    --flow-bright: var(--accent-strong);
    /* Facet dimension channels — content semantics, chat-local (the model app
       keeps its own KIND/world channels). Hue is the identity; the dark half
       lifts lightness so the channel stays legible on a dark ground. */
    --dim-C: light-dark(#2e7d5e, color-mix(in oklab, #2e7d5e, white 38%));
    --dim-N: light-dark(#2a6299, color-mix(in oklab, #2a6299, white 38%));
    --dim-E: light-dark(#8a6840, color-mix(in oklab, #8a6840, white 38%));
    --dim-G: light-dark(#a04a6a, color-mix(in oklab, #a04a6a, white 38%));
    --dim-B: light-dark(#7044a0, color-mix(in oklab, #7044a0, white 38%));
    --dim-T: light-dark(#1f6e56, color-mix(in oklab, #1f6e56, white 38%));
    --dim-H: light-dark(#7a5e0f, color-mix(in oklab, #7a5e0f, white 38%));
    --dim-Dt: light-dark(#1a5e82, color-mix(in oklab, #1a5e82, white 38%));
    /* SPT mode colors */
    --dim-FB: light-dark(#b04040, color-mix(in oklab, #b04040, white 38%));
    --dim-FL: light-dark(#3a8fb0, color-mix(in oklab, #3a8fb0, white 38%));
    --dim-CY: light-dark(#7a5ebf, color-mix(in oklab, #7a5ebf, white 38%));
    --dim-EM: light-dark(#d4872a, color-mix(in oklab, #d4872a, white 38%));
    --dim-EV: light-dark(#2a8e5a, color-mix(in oklab, #2a8e5a, white 38%));
    --dim-NW: light-dark(#5a6eb0, color-mix(in oklab, #5a6eb0, white 38%));
    --dim-DU: light-dark(#9a5480, color-mix(in oklab, #9a5480, white 38%));
    --dim-CH: light-dark(#c45030, color-mix(in oklab, #c45030, white 38%));
    --dim-DG: light-dark(#6a6a6a, color-mix(in oklab, #6a6a6a, white 38%));
    /* Klir mode colors */
    --dim-TH: light-dark(#6b5a3e, color-mix(in oklab, #6b5a3e, white 38%));
    --dim-SY: light-dark(#2e5e8a, color-mix(in oklab, #2e5e8a, white 38%));
    --dim-SR: light-dark(#4a7a8a, color-mix(in oklab, #4a7a8a, white 38%));
    --dim-DA: light-dark(#5a8a4a, color-mix(in oklab, #5a8a4a, white 38%));
    --dim-GN: light-dark(#8a4a7a, color-mix(in oklab, #8a4a7a, white 38%));
    --dim-ST: light-dark(#4a5a9a, color-mix(in oklab, #4a5a9a, white 38%));
    --dim-MT: light-dark(#a06a2a, color-mix(in oklab, #a06a2a, white 38%));
    /* Bunge mode colors (C, E, B shared with Mobus) */
    --dim-S: light-dark(#5a4a8a, color-mix(in oklab, #5a4a8a, white 38%));
    --dim-L: light-dark(#2a7a6a, color-mix(in oklab, #2a7a6a, white 38%));
    --dim-M: light-dark(#b05a30, color-mix(in oklab, #b05a30, white 38%));
    /* CT mode colors (C shared with Mobus/Bunge) */
    --dim-I: light-dark(#3a7a9a, color-mix(in oklab, #3a7a9a, white 38%));
    --dim-W: light-dark(#6a4d8f, color-mix(in oklab, #6a4d8f, white 38%));
    --dim-F: light-dark(#b0562a, color-mix(in oklab, #b0562a, white 38%));
    --dim-O: light-dark(#9a4a70, color-mix(in oklab, #9a4a70, white 38%));
    --dim-D: light-dark(#6b6b3e, color-mix(in oklab, #6b6b3e, white 38%));
    --serif: var(--font-body);
    --display: var(--font-display);
    --ui: var(--font-body);
    --mono: var(--font-mono);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  button { font-family: var(--ui); font-size: var(--t-sm); color: inherit; }
  html { -webkit-text-size-adjust: 100%; }

  body {
    font-family: var(--serif);
    background: var(--ground);
    color: var(--ink);
    min-height: 100vh;
    min-height: 100dvh;
    line-height: 1.6;
  }

  /* ══════════════════════════════════════════
     CHAT WELCOME STATE (empty tab)
     ══════════════════════════════════════════ */
  .chat-welcome {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    flex: 1;
    padding: 0 24px 24px;
    text-align: center;
  }
  .chat-welcome svg {
    width: 80px;
    height: 80px;
    margin-bottom: 16px;
  }
  .chat-welcome-title { font-size: var(--t-d1); margin-bottom: 8px; }
  .chat-welcome-tagline {
    font-family: var(--ui);
    font-size: var(--t-body);
    color: var(--ink);
    margin-bottom: 4px;
  }
  .chat-welcome-subline {
    font-family: var(--ui);
    font-size: var(--t-sm);
    color: var(--ink-faint);
    margin-bottom: 24px;
    max-width: 56ch;
    line-height: 1.5;
  }
  .chat-welcome-example {
    width: 100%;
    max-width: 560px;
    margin-top: 20px;
    text-align: left;
  }
  .example-label {
    font-family: var(--ui);
    font-size: var(--t-label); font-weight: 600;
    color: var(--ink-faint);
    text-transform: uppercase;
    letter-spacing: var(--tracking-label);
    margin-bottom: 6px;
    text-align: center;
    opacity: 0.7;
  }
  .example-query {
    font-family: var(--serif);
    font-size: var(--t-sm);
    color: var(--ink-dim);
    background: var(--ground-raised);
    padding: 6px 12px;
    border-radius: var(--radius-sm);
    margin-bottom: 8px;
    display: inline-block;
  }
  .example-card {
    background: var(--paper);
    border: 1px solid var(--ground-border);
    border-radius: var(--radius-md);
    padding: 14px 18px;
  }
  .example-card .msg-tldr { border-left: 3px solid var(--flow); padding-left: 12px; }
  .example-card .msg-tldr p { font-family: var(--serif); font-size: var(--t-sm); line-height: 1.6; color: var(--ink-dim); margin: 4px 0; }
  .example-card .msg-tldr ul { font-family: var(--serif); font-size: var(--t-sm); line-height: 1.6; color: var(--ink-dim); padding-left: 18px; }
  .example-card .msg-meta { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 10px; }
  .example-card .msg-tag-dim {
    font-family: var(--ui);
    font-size: var(--t-meta);
    padding: 2px 8px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--ground-border);
    color: var(--ink-faint);
  }
  .example-card .evidence-toggle {
    font-family: var(--ui);
    font-size: var(--t-meta);
    color: var(--ink-faint);
    background: none;
    border: none;
    margin-top: 8px;
    cursor: default;
  }
  .chat-welcome-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    max-width: 520px;
  }
  .chip {
    font-family: var(--serif);
    font-size: var(--t-sm);
    color: var(--ink-dim);
    background: var(--ground-raised);
    border: 1px solid var(--ground-border);
    border-radius: var(--radius-sm);
    padding: 6px 14px;
    cursor: pointer;
    transition: all var(--motion) ease;
  }
  .chip:hover {
    border-color: var(--flow);
    color: var(--flow);
    background: color-mix(in srgb, var(--flow) 6%, transparent);
  }

  .session-note {
    font-family: var(--ui);
    font-size: var(--t-meta);
    color: var(--ink-dim);
    background: var(--ground-raised);
    border: 1px solid var(--ground-border);
    border-radius: var(--radius-sm);
    padding: 8px 12px;
    margin-bottom: 8px;
  }
  .session-note-btn {
    font-family: var(--ui); font-size: var(--t-sm); margin-left: 6px; padding: 2px 8px;
    border: 1px solid var(--ground-border); border-radius: var(--radius-sm); background: var(--ground); color: var(--ink); cursor: pointer;
  }
  .session-note-btn:hover { border-color: var(--flow); }
  .conv-rail-item.orphaned .conv-rail-name { color: var(--ink-dim); }
  .chat-pane.session-expired .chat-input-area { opacity: 0.5; }

  /* ══════════════════════════════════════════
     MAIN LAYOUT
     ══════════════════════════════════════════ */
  .page {
    display: grid;
    grid-template-columns: 1fr;
    grid-template-rows: auto 1fr;
    min-height: 100vh;
    min-height: 100dvh;
  }

  .diagram-toggle-btn {
    font-family: var(--serif);
    font-size: var(--t-sm);
    color: var(--ink-dim);
    background: none;
    border: 1px solid var(--ground-border);
    border-radius: var(--radius-sm);
    padding: 3px 10px;
    cursor: pointer;
    margin-left: 12px;
  }
  .diagram-toggle-btn:hover { color: var(--flow); border-color: var(--flow); }

  .diagram-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 4px;
  }
  .diagram-header svg {
    width: 28px;
    height: 28px;
    flex-shrink: 0;
  }
  .diagram-header h1 {
    font-family: var(--display);
    font-size: var(--t-d2);
    font-weight: 700;
    color: var(--ink);
    letter-spacing: 0.01em;
  }
  .diagram-tagline {
    font-family: var(--ui);
    font-size: var(--t-body);
    font-weight: 400;
    color: var(--ink-dim);
    margin-bottom: 8px;
  }
  .diagram-subtitle {
    font-family: var(--serif);
    font-size: var(--t-sm);
    color: var(--ink-dim);
    margin-bottom: 8px;
    line-height: 1.5;
  }
  .diagram-attribution {
    font-family: var(--ui);
    font-size: var(--t-meta);
    color: var(--ink-faint);
    margin-bottom: 28px;
    letter-spacing: 0.02em;
    padding-top: 8px;
    border-top: 1px solid var(--ground-border);
  }

  .flow {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
  }
  .arrow {
    width: 1px;
    height: 24px;
    background: var(--ground-border);
    position: relative;
  }
  .arrow::after {
    content: '';
    position: absolute;
    bottom: -4px;
    left: 50%;
    transform: translateX(-50%);
    border-left: 4px solid transparent;
    border-right: 4px solid transparent;
    border-top: 5px solid var(--ground-border);
    transition: border-top-color var(--motion) ease;
  }
  .section.hl + .arrow { background: var(--flow); }
  .section.hl + .arrow::after { border-top-color: var(--flow); }
  .flow-note {
    font-family: var(--ui);
    font-size: var(--t-meta);
    color: var(--ink-faint);
    text-align: center;
    padding: 3px 0;
    letter-spacing: 0.02em;
  }

  .intensity-badge {
    font-family: var(--ui);
    font-size: var(--t-label);
    font-weight: 600;
    padding: 3px 12px;
    border-radius: var(--radius-sm);
    background: var(--ground);
    color: var(--ink-faint);
    text-transform: uppercase;
    letter-spacing: var(--tracking-label);
    border: 1.5px solid var(--ground-border);
    transition: all var(--motion) ease;
  }
  .intensity-badge.full {
    background: color-mix(in srgb, var(--flow) 8%, transparent);
    color: var(--flow);
    border-color: var(--flow);
  }
  .intensity-badge.light {
    background: color-mix(in srgb, var(--accent) 8%, transparent);
    color: var(--accent);
    border-color: var(--accent);
  }
  .reasoning-text {
    font-family: var(--serif);
    font-size: var(--t-sm);
    color: var(--ink);
    line-height: 1.65;
    flex: 1;
  }

  .mono-tag {
    display: inline-block;
    font-family: var(--ui);
    font-size: var(--t-meta);
    font-weight: 500;
    padding: 3px 10px;
    border-radius: var(--radius-md);
    margin-top: 4px;
    background: color-mix(in srgb, var(--accent) 10%, transparent);
    color: var(--accent);
  }

  .output-row {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--paper);
    border: 1px solid var(--ground-border);
    border-radius: var(--radius-md);
    padding: 12px 16px;
    flex-wrap: wrap;
  }
  .out-badge {
    font-family: var(--ui);
    font-size: var(--t-meta);
    font-weight: 500;
    padding: 3px 10px;
    border-radius: var(--radius-md);
    white-space: nowrap;
  }
  .out-badge-route  { background: color-mix(in srgb, var(--accent) 10%, transparent); color: var(--accent); }
  .out-badge-conf   { background: color-mix(in srgb, var(--flow) 10%, transparent); color: var(--flow); }
  .out-badge-dim    { background: color-mix(in srgb, var(--flow) 8%, transparent); color: var(--flow-bright); }
  /* gsr#37 grounding signal: corpus-backed vs parametric spans in Facets synthesis */
  .grounding-badge {
    display: inline-block;
    font-family: var(--ui);
    font-size: var(--t-meta);
    font-weight: 500;
    padding: 1px 7px;
    margin: 0 2px;
    border-radius: var(--radius-md);
    white-space: nowrap;
    vertical-align: middle;
    cursor: help;
  }
  .grounding-badge-grounded { background: color-mix(in srgb, var(--flow) 12%, transparent); color: var(--flow-bright); }
  .grounding-badge-ungrounded { background: color-mix(in srgb, var(--verdict-warning) 12%, transparent); color: var(--verdict-warning); }
  /* An unsupported claim is the sentence itself, marked, not a badge after it. */
  .claim-open { background: color-mix(in srgb, var(--verdict-warning) 14%, transparent); color: inherit; border-bottom: 1px dotted var(--verdict-warning); cursor: help; padding: 0 1px; }
  .claim-open.claim-target { background: color-mix(in srgb, var(--verdict-warning) 30%, transparent); }
  .out-label {
    font-family: var(--ui);
    font-size: var(--t-label); font-weight: 600;
    color: var(--ink-faint);
    text-transform: uppercase;
    letter-spacing: var(--tracking-label);
  }

  /* ── Top nav bar ── */
  .topnav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 20px;
    border-bottom: 1px solid var(--ground-border);
    background: var(--ground);
    grid-column: 1 / -1;
  }
  .topnav-left {
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    transition: opacity var(--motion-fast);
  }
  .topnav-left:hover { opacity: 0.7; }
  .topnav-left svg { width: 22px; height: 22px; }
  .topnav-left .wordmark { font-size: var(--t-d3); }
  .topnav-links {
    display: flex;
    align-items: center;
    gap: 1.5rem;
  }
  .topnav-links a {
    font-family: var(--ui);
    font-size: var(--t-label); font-weight: 600;
    letter-spacing: var(--tracking-label);
    text-transform: uppercase;
    color: var(--ink-faint);
    text-decoration: none;
    transition: color var(--motion-fast);
  }
  .topnav-links a:hover { color: var(--accent); }

  /* ── Context dock (workbench phase 1, 2026-08-31): direction A — the
     stream stays, but the focused answer's readouts stop scrolling away.
     Wide screens only; below the gate the chat is exactly what it was.
     Pure projection of message meta — no backend, one cursor of state. ── */
  .context-dock { display: none; }
  /* Closed by default (facets#417): it opens from the answer card and is remembered. */
  .dock-close { margin-left: auto; font-family: var(--ui); font-size: var(--t-sm); color: var(--ink-faint); background: none; border: 0; cursor: pointer; }
  .dock-close:hover { color: var(--ink); }
  .dock-head { display: flex; align-items: center; gap: 8px; }
  .dock-step { font-family: var(--ui); font-size: var(--t-sm); color: var(--ink-dim); background: var(--ground-raised); border: 1px solid var(--ground-border); border-radius: var(--radius-sm); padding: 1px 8px; cursor: pointer; }
  .dock-step:disabled { opacity: 0.4; cursor: default; }
  .dock-count { font-family: var(--ui); font-size: var(--t-label); font-weight: 600; letter-spacing: var(--tracking-label); text-transform: uppercase; color: var(--ink-faint); }
  .dock-q { font-family: var(--serif); font-size: var(--t-sm); line-height: 1.4; color: var(--ink); }
  .dock-section { display: flex; flex-direction: column; gap: 7px; }
  .dock-asks { font-family: var(--serif); font-style: italic; font-size: var(--t-sm); color: var(--flow); line-height: 1.35; }
  .dock-label { font-family: var(--ui); font-size: var(--t-label); font-weight: 600; letter-spacing: var(--tracking-label); text-transform: uppercase; color: var(--ink-faint); }
  .dock-rows { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-family: var(--ui); font-size: var(--t-meta); color: var(--ink-faint); }
  .dock-val { color: var(--ink); text-align: right; }
  .dock-chips { display: flex; flex-wrap: wrap; gap: 5px; }
  .dock-chip { font-family: var(--ui); font-size: var(--t-meta); font-weight: 500; padding: 2px 8px; border-radius: var(--radius-sm); background: var(--ground-raised); border: 1px solid var(--ground-border); }
  .dock-sources { display: flex; flex-direction: column; gap: 4px; font-family: var(--mono); font-size: var(--t-meta); color: var(--ink-dim); }
  .dock-note { margin-top: auto; font-family: var(--ui); font-size: var(--t-meta); font-style: italic; color: var(--ink-faint); }

  /* ── Conversations rail (facets#370): "your stuff" exists at every width now.
   It was gated at 1360px, which left narrow screens with a drawer and no
   standing surface for identity. Collapsed it is an icon strip; open below
   the wide gate it overlays the pane like a drawer; at 1360 and up it docks
   beside the pane and the centred triple ensemble is unchanged. ── */
  .conv-rail {
  position: fixed; top: 41px; left: 0; bottom: 0;
  width: 236px; box-sizing: border-box; z-index: 150;
  display: flex; flex-direction: column;
  background: var(--paper);
  border-right: 1px solid var(--ground-border);
  overflow: hidden;
  }
  .conv-rail.collapsed { width: 52px; }
  /* Below the docked gate the strip stands over the pane's left edge, so the
   pane gives it that gutter rather than letting it sit on the text. */
  @media (max-width: 1359px) {
    body.rail-strip .chat-pane { padding-left: 52px; }
  }
  @media (max-width: 1099px) {
    body.dock-open .context-dock.has-content {
      display: flex; flex-direction: column; gap: 16px;
      position: fixed; inset: 41px 0 0 0; z-index: 150;
      background: var(--ground); overflow-y: auto; padding: 18px 16px 24px;
    }
  }
  @media (min-width: 1100px) {
    /* The ensemble (760 pane + 22 gap + 270 dock = 1052) centers as one unit:
       the pane shifts half a dock-width left, the dock rides fixed beside it.
       The topnav lives inside <main>, so the container is never made flex. */
    body.dock-open main .chat-pane { margin: 0 0 0 calc(50vw - 526px); }
    body.dock-open .context-dock.has-content {
      display: flex; flex-direction: column; gap: 16px;
      position: fixed; top: 41px; left: calc(50vw + 256px);
      width: 270px; box-sizing: border-box;
      height: calc(100vh - 41px);
      height: calc(100dvh - 41px);
      overflow-y: auto; padding: 18px 8px 18px 4px;
    }
  }
  .rail-backdrop { display: none; position: fixed; inset: 41px 0 0 0; z-index: 140; background: color-mix(in srgb, var(--ink) 35%, transparent); }
  body.rail-open .rail-backdrop { display: block; }
  @media (min-width: 1360px) {
    body.dock-open main .chat-pane { margin: 0 0 0 calc(50vw - 400px); }
    body.dock-open .context-dock.has-content { left: calc(50vw + 382px); }
    /* With the dock closed (#417) the pane is the only column, so it takes the
       width the dock used to share: the lens cards get a real reading line. */
    body:not(.dock-open) main .chat-pane { max-width: 880px; }
    body.rail-open .rail-backdrop { display: none; }
    /* Docked: the rail rides beside the pane rather than against the window edge. */
    .conv-rail:not(.collapsed) {
      left: max(0px, calc(50vw - 652px));
    }
    body:not(.dock-open) .conv-rail:not(.collapsed) { left: max(0px, calc(50vw - 712px)); }
    .conv-rail:not(.collapsed) {
      background: transparent; border-right-color: transparent;
    }
  }
  .conv-rail-head { display: flex; align-items: center; gap: 4px; padding: 12px 8px 6px; }
  .conv-rail.collapsed .conv-rail-head { flex-direction: column; padding: 12px 4px 6px; }
  .rail-icon-btn {
    display: flex; align-items: center; justify-content: center;
    width: 32px; height: 32px; flex-shrink: 0;
    border: none; background: none; border-radius: var(--radius-sm);
    color: var(--ink-faint); cursor: pointer;
  }
  .rail-icon-btn:hover { background: var(--well); color: var(--flow); }
  .conv-rail-body { flex: 1; overflow-y: auto; padding-bottom: 8px; }
  .conv-rail.collapsed .conv-rail-body { display: none; }
  .conv-rail-label { font-family: var(--ui); font-size: var(--t-label); font-weight: 600; letter-spacing: var(--tracking-label); text-transform: uppercase; color: var(--ink-faint); padding: 12px 14px 6px; }
  .conv-rail-empty { font-family: var(--ui); font-size: var(--t-meta); color: var(--ink-faint); padding: 2px 14px 6px; line-height: 1.45; }
  .conv-rail-item { display: flex; align-items: center; gap: 4px; width: 100%; text-align: left; border: none; background: none; cursor: pointer; padding: 8px 8px 8px 11px; border-left: 3px solid transparent; border-radius: 0 var(--radius-sm) var(--radius-sm) 0; }
  .conv-rail-item:focus-visible { outline: var(--focus-ring); outline-offset: -2px; }
  .conv-rail-text { flex: 1; min-width: 0; }
  .conv-rail-del { flex: none; display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; border: none; border-radius: var(--radius-sm); background: none; color: var(--ink-faint); cursor: pointer; opacity: 0; }
  .conv-rail-item:hover .conv-rail-del, .conv-rail-item:focus-within .conv-rail-del, .conv-rail-item.active .conv-rail-del { opacity: 1; }
  .conv-rail-del:hover { color: var(--ink); background: var(--well); }
  @media (hover: none) { .conv-rail-del { opacity: 1; } }
  .conv-rail-item:hover { background: var(--well); }
  .conv-rail-item.active { background: var(--well); border-left-color: var(--flow); }
  .conv-rail-name { font-family: var(--ui); font-size: var(--t-sm); color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .conv-rail-sub { font-family: var(--mono); font-size: var(--t-meta); color: var(--ink-faint); margin-top: 1px; }
  .conv-rail-new { border: none; background: none; cursor: pointer; text-align: left; padding: 8px 14px; font-family: var(--ui); font-size: var(--t-sm); font-weight: 500; color: var(--flow); }
  .conv-rail-new:hover { color: var(--flow-bright); }
  .conv-rail-foot { border-top: 1px solid var(--ground-border); padding: 6px; }
  .conv-rail-you {
    display: flex; align-items: center; gap: 9px; width: 100%;
    border: none; background: none; cursor: pointer;
    padding: 8px; border-radius: var(--radius-sm); text-align: left;
  }
  .conv-rail-you:hover { background: var(--well); }
  .conv-rail.collapsed .conv-rail-you { justify-content: center; padding: 8px 0; }
  .conv-rail.collapsed .you-text { display: none; }
  .you-avatar {
    width: 24px; height: 24px; flex-shrink: 0; border-radius: 50%;
    border: 1px solid var(--ground-border);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--ui); font-size: var(--t-meta); color: var(--ink-faint);
  }
  .you-text { font-family: var(--ui); font-size: var(--t-sm); color: var(--ink-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ── You panel: identity actions sit behind their own door, never one tap
     from casual browsing (council §4.2). ── */
  .you-overlay { position: fixed; inset: 0; z-index: 300; background: color-mix(in srgb, var(--ink) 45%, transparent); display: flex; align-items: center; justify-content: center; padding: 20px; }
  .you-card {
    background: var(--ground); border: 1px solid var(--ground-border); border-radius: var(--radius-md);
    width: min(420px, 100%); max-height: 90vh; overflow-y: auto; padding: 22px;
  }
  .you-card h3 { font-family: var(--display); font-size: var(--t-d3); font-weight: 700; color: var(--ink); margin-bottom: 4px; }
  .you-status { font-family: var(--ui); font-size: var(--t-meta); color: var(--ink-dim); margin-bottom: 18px; }
  .you-section { border-top: 1px solid var(--ground-border); padding-top: 14px; margin-top: 14px; }
  .you-label { font-family: var(--ui); font-size: var(--t-label); font-weight: 600; letter-spacing: var(--tracking-label); text-transform: uppercase; color: var(--ink-faint); margin-bottom: 7px; }
  .you-note { font-family: var(--ui); font-size: var(--t-meta); color: var(--ink-faint); line-height: 1.5; margin-top: 7px; }
  .you-row { display: flex; gap: 8px; align-items: center; }
  .you-input {
    flex: 1; font-family: var(--ui); font-size: var(--t-sm); color: var(--ink);
    background: var(--paper); border: 1px solid var(--ground-border); border-radius: var(--radius-sm);
    padding: 8px 11px; outline: none; min-width: 0;
  }
  .you-input:focus { border-color: var(--flow); }
  .you-btn {
    font-family: var(--ui); font-size: var(--t-sm); color: var(--ink-dim);
    background: none; border: 1px solid var(--ground-border); border-radius: var(--radius-sm);
    padding: 8px 14px; cursor: pointer; white-space: nowrap;
  }
  .you-btn:hover:not(:disabled) { border-color: var(--flow); color: var(--flow); }
  .you-btn:disabled { opacity: 0.4; cursor: default; }
  .you-btn-danger { color: var(--verdict-warning); border-color: var(--ground-border); }
  .you-btn-danger:hover:not(:disabled) { border-color: var(--verdict-warning); color: var(--verdict-warning); }
  .you-check { display: flex; align-items: flex-start; gap: 8px; font-family: var(--ui); font-size: var(--t-meta); color: var(--ink-dim); margin: 9px 0; line-height: 1.45; }
  .you-close { float: right; border: none; background: none; font-size: var(--t-sm); color: var(--ink-faint); cursor: pointer; }
  .you-close:hover { color: var(--ink); }

  /* ── Chat pane ── */
  .chat-pane {
    background: var(--paper);
    display: flex;
    flex-direction: column;
    height: calc(100vh - 41px);
    height: calc(100dvh - 41px);
    max-width: 760px;
    width: 100%;
    margin: 0 auto;
  }
  .chat-header {
    padding: 10px 18px;
    border-bottom: 1px solid var(--ground-border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  .chat-header-left {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .chat-header-left svg { width: 24px; height: 24px; flex-shrink: 0; }
  .chat-header-left h2 {
    font-family: var(--display);
    font-size: var(--t-d3);
    font-weight: 700;
    color: var(--ink);
  }
  .chat-header-right {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .status-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--ground-border); transition: background var(--motion) ease;
  }
  .status-dot.online { background: var(--flow); }
  .status-dot.loading { background: var(--accent-dim); animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: 0.4; } }

  .export-group { position: relative; }
  .export-trigger {
    font-family: var(--ui);
    font-size: var(--t-sm);
    padding: 3px 8px;
    border: 1px solid var(--ground-border);
    border-radius: var(--radius-sm);
    background: none;
    color: var(--ink-faint);
    cursor: pointer;
    transition: all var(--motion-fast) ease;
  }
  .export-trigger:hover { border-color: var(--flow); color: var(--flow); }
  .export-menu {
    display: none;
    position: absolute;
    top: 100%;
    right: 0;
    margin-top: 4px;
    background: var(--ground);
    border: 1px solid var(--ground-border);
    border-radius: var(--radius-sm);
    z-index: 20;
    min-width: 130px;
    padding: 4px 0;
  }
  .export-menu.open { display: block; }
  .export-menu button {
    display: block;
    width: 100%;
    text-align: left;
    font-family: var(--ui);
    font-size: var(--t-sm);
    padding: 6px 12px;
    border: none;
    background: none;
    color: var(--ink-dim);
    cursor: pointer;
    transition: background var(--motion-fast);
  }
  .export-menu button:hover { background: var(--ground-raised); color: var(--flow); }
  .export-btn {
    font-family: var(--ui);
    font-size: var(--t-sm);
    padding: 2px 6px;
    border: 1px solid var(--ground-border);
    border-radius: var(--radius-sm);
    background: none;
    color: var(--ink-faint);
    cursor: pointer;
    transition: all var(--motion-fast) ease;
    letter-spacing: 0.02em;
  }
  .export-btn:hover {
    border-color: var(--flow);
    color: var(--flow);
  }

  .chat-tabs { display: none; }
  .chat-history-btn {
    display: flex;
    align-items: center;
    gap: 5px;
    font-family: var(--ui);
    font-size: var(--t-sm);
    color: var(--ink-faint);
    background: none;
    border: 1px solid var(--ground-border);
    border-radius: var(--radius-sm);
    padding: 4px 10px;
    cursor: pointer;
  }
  .chat-history-btn:hover { color: var(--flow); border-color: var(--flow); }
  .chat-history-btn svg { flex-shrink: 0; }

  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px 18px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg {
    max-width: 92%;
    font-size: var(--t-sm);
    line-height: 1.6;
    padding: 10px 14px;
    border-radius: var(--radius-md);
    word-wrap: break-word;
  }
  .msg-user {
    align-self: flex-end;
    font-family: var(--serif);
    background: var(--flow);
    color: var(--text-on-accent);
    border-bottom-right-radius: var(--radius-sm);
  }
  .msg-bot {
    align-self: flex-start;
    font-family: var(--serif);
    background: var(--ground);
    color: var(--ink);
    border-bottom-left-radius: var(--radius-sm);
    max-width: min(92%, 65ch);
  }
  .msg-system {
    align-self: center;
    font-family: var(--serif);
    font-size: var(--t-meta);
    color: var(--ink-faint);
    font-style: italic;
    padding: 4px 0;
  }
  /* ── Sheets (workbench phase 2, 2026-08-31): a question and its answer are
     one numbered paper surface. The ledger ground steps back so sheets read
     as sheets; collapsing keeps the record present without the scroll. ── */
  .chat-messages.sheeted { background: var(--ground); gap: 14px; }
  .sheet {
    background: var(--ground-raised);
    border: 1px solid var(--ground-border);
    border-radius: var(--radius-md);
    width: 100%;
    flex-shrink: 0;
    overflow: hidden;
  }
  .sheet-head { display: flex; align-items: baseline; gap: 12px; padding: 14px 18px 4px; cursor: pointer; }
  .sheet.collapsed .sheet-head { padding: 10px 18px; }
  .sheet-num { font-family: var(--mono); font-size: var(--t-meta); color: var(--seal); flex-shrink: 0; }
  .sheet-q { font-family: var(--display); font-size: var(--t-d3); font-weight: 700; line-height: 1.3; color: var(--ink); flex: 1; }
  .sheet.collapsed .sheet-q { font-family: var(--ui); font-size: var(--t-sm); font-weight: 500; color: var(--ink-dim); }
  .sheet-caret { border: none; background: none; font-size: var(--t-sm); color: var(--ink-faint); cursor: pointer; padding: 2px 4px; }
  .sheet.collapsed .sheet-body { display: none; }
  .sheet-body { padding: 4px 18px 12px; }
  .sheet-focused { border-color: var(--rule-strong); }
  .sheet .msg-bot { background: transparent; border-radius: 0; padding: 0; max-width: none; align-self: stretch; }

  .msg-meta {
    display: flex;
    gap: 5px;
    margin-top: 8px;
    flex-wrap: wrap;
  }
  .msg-tag {
    font-family: var(--ui);
    font-size: var(--t-meta);
    font-weight: 500;
    padding: 2px 8px;
    border-radius: var(--radius-md);
  }
  .msg-tag-route  { background: color-mix(in srgb, var(--accent) 10%, transparent); color: var(--accent); }
  .msg-tag-conf   { background: color-mix(in srgb, var(--flow) 10%, transparent); color: var(--flow); }
  .msg-tag-dim    { background: color-mix(in srgb, var(--flow) 8%, transparent); color: var(--flow-bright); }
  .msg-tag-dim .dim-chip-code { opacity: 0.55; font-weight: 600; margin-right: 4px; letter-spacing: 0.02em; }
  .msg-tag-dim[data-dim="C"]  { background: color-mix(in srgb, var(--dim-C) 14%, transparent);  color: var(--dim-C); }
  .msg-tag-dim[data-dim="N"]  { background: color-mix(in srgb, var(--dim-N) 14%, transparent);  color: var(--dim-N); }
  .msg-tag-dim[data-dim="E"]  { background: color-mix(in srgb, var(--dim-E) 14%, transparent);  color: var(--dim-E); }
  .msg-tag-dim[data-dim="G"]  { background: color-mix(in srgb, var(--dim-G) 14%, transparent);  color: var(--dim-G); }
  .msg-tag-dim[data-dim="B"]  { background: color-mix(in srgb, var(--dim-B) 14%, transparent);  color: var(--dim-B); }
  .msg-tag-dim[data-dim="T"]  { background: color-mix(in srgb, var(--dim-T) 14%, transparent);  color: var(--dim-T); }
  .msg-tag-dim[data-dim="H"]  { background: color-mix(in srgb, var(--dim-H) 14%, transparent);  color: var(--dim-H); }
  .msg-tag-dim[data-dim="Dt"] { background: color-mix(in srgb, var(--dim-Dt) 14%, transparent);  color: var(--dim-Dt); }
  /* SPT dimension badge colors */
  .msg-tag-dim[data-dim="FB"] { background: color-mix(in srgb, var(--dim-FB) 14%, transparent);   color: var(--dim-FB); }
  .msg-tag-dim[data-dim="FL"] { background: color-mix(in srgb, var(--dim-FL) 14%, transparent);  color: var(--dim-FL); }
  .msg-tag-dim[data-dim="CY"] { background: color-mix(in srgb, var(--dim-CY) 14%, transparent);  color: var(--dim-CY); }
  .msg-tag-dim[data-dim="EM"] { background: color-mix(in srgb, var(--dim-EM) 14%, transparent);  color: var(--dim-EM); }
  .msg-tag-dim[data-dim="EV"] { background: color-mix(in srgb, var(--dim-EV) 14%, transparent);   color: var(--dim-EV); }
  .msg-tag-dim[data-dim="NW"] { background: color-mix(in srgb, var(--dim-NW) 14%, transparent);  color: var(--dim-NW); }
  .msg-tag-dim[data-dim="DU"] { background: color-mix(in srgb, var(--dim-DU) 14%, transparent);  color: var(--dim-DU); }
  .msg-tag-dim[data-dim="CH"] { background: color-mix(in srgb, var(--dim-CH) 14%, transparent);   color: var(--dim-CH); }
  .msg-tag-dim[data-dim="DG"] { background: color-mix(in srgb, var(--dim-DG) 14%, transparent); color: var(--dim-DG); }
  /* Klir dimension badge colors */
  .msg-tag-dim[data-dim="TH"] { background: color-mix(in srgb, var(--dim-TH) 14%, transparent);   color: var(--dim-TH); }
  .msg-tag-dim[data-dim="SY"] { background: color-mix(in srgb, var(--dim-SY) 14%, transparent);   color: var(--dim-SY); }
  .msg-tag-dim[data-dim="SR"] { background: color-mix(in srgb, var(--dim-SR) 14%, transparent);  color: var(--dim-SR); }
  .msg-tag-dim[data-dim="DA"] { background: color-mix(in srgb, var(--dim-DA) 14%, transparent);   color: var(--dim-DA); }
  .msg-tag-dim[data-dim="GN"] { background: color-mix(in srgb, var(--dim-GN) 14%, transparent);  color: var(--dim-GN); }
  .msg-tag-dim[data-dim="ST"] { background: color-mix(in srgb, var(--dim-ST) 14%, transparent);   color: var(--dim-ST); }
  .msg-tag-dim[data-dim="MT"] { background: color-mix(in srgb, var(--dim-MT) 14%, transparent);  color: var(--dim-MT); }
  /* Bunge dimension badge colors (C, E, B shared with Mobus) */
  .msg-tag-dim[data-dim="S"]  { background: color-mix(in srgb, var(--dim-S) 14%, transparent);   color: var(--dim-S); }
  .msg-tag-dim[data-dim="L"]  { background: color-mix(in srgb, var(--dim-L) 14%, transparent);  color: var(--dim-L); }
  .msg-tag-dim[data-dim="M"]  { background: color-mix(in srgb, var(--dim-M) 14%, transparent);   color: var(--dim-M); }
  /* CT dimension badge colors (C shared with Mobus/Bunge) */
  .msg-tag-dim[data-dim="I"]  { background: color-mix(in srgb, var(--dim-I) 14%, transparent);  color: var(--dim-I); }
  .msg-tag-dim[data-dim="W"]  { background: color-mix(in srgb, var(--dim-W) 14%, transparent);  color: var(--dim-W); }
  .msg-tag-dim[data-dim="F"]  { background: color-mix(in srgb, var(--dim-F) 14%, transparent);   color: var(--dim-F); }
  .msg-tag-dim[data-dim="O"]  { background: color-mix(in srgb, var(--dim-O) 14%, transparent);  color: var(--dim-O); }
  .msg-tag-dim[data-dim="D"]  { background: color-mix(in srgb, var(--dim-D) 14%, transparent);  color: var(--dim-D); }
  .msg-tag-dim-clickable { cursor: pointer; transition: transform var(--motion-fast) ease; }
  .msg-tag-dim-clickable:hover,
  .msg-tag-dim-clickable:active { transform: translateY(-1px); outline: 1px solid currentColor; }

  /* Dimension nudge */
  .dim-nudge {
    font-family: var(--serif);
    font-size: var(--t-meta);
    font-style: italic;
    color: var(--ink-faint);
    margin-top: 6px;
    padding: 4px 0;
    opacity: 1;
    transition: opacity var(--motion) ease;
  }
  .dim-nudge.fading { opacity: 0; }

  /* Copy button */
  .msg-bot { position: relative; }
  .msg-copy-btn {
    background: var(--ground-raised);
    border: 1px solid var(--ground-border);
    border-radius: var(--radius-sm);
    padding: 3px 6px;
    cursor: pointer;
    opacity: 0.75;
    transition: opacity var(--motion-fast) ease;
    font-family: var(--ui);
    font-size: var(--t-sm);
    color: var(--ink-faint);
  }
  .msg-copy-btn:hover { opacity: 1; color: var(--ink); border-color: var(--ink-faint); }
  .msg-actions { display: flex; gap: 6px; margin-top: 8px; padding-top: 6px; border-top: 1px solid var(--ground-border); }
  .msg-convergence { background: var(--ground-raised); border: 1px solid var(--ground-border); border-radius: var(--radius-md); padding: 16px 18px; max-width: 100%; }
  .conv-panel h2 { font-size: var(--t-d3); font-weight: 700; color: var(--flow-bright); margin: 0.7em 0 0.3em; font-family: var(--display); }
  .conv-panel h2:first-child { margin-top: 0; }
  .conv-panel p, .conv-panel li { color: var(--ink-dim); }
  .conv-lenses { margin-top: 16px; border-top: 1px solid var(--ground-border); padding-top: 6px; }
  .conv-lens { border-bottom: 1px solid var(--ground-border); }
  .conv-lens:last-child { border-bottom: 0; }
  .conv-lens-head { width: 100%; text-align: left; background: none; border: 0; cursor: pointer; font: inherit; padding: 9px 0; display: flex; gap: 10px; align-items: baseline; color: var(--ink); }
  .conv-lens-head:hover .conv-lens-name,
  .conv-lens-head:active .conv-lens-name { color: var(--flow); }
  .conv-lens-name { font-weight: 600; }
  .conv-lens-dims { color: var(--ink-faint); font-size: var(--t-meta); font-family: var(--ui); letter-spacing: 0.02em; }
  .conv-lens-caret { margin-left: auto; color: var(--flow); font-size: var(--t-sm); font-family: var(--ui); font-weight: 500; white-space: nowrap; }
  .conv-lens-head:hover .conv-lens-caret { text-decoration: underline; }
  .conv-lens-body { font-size: var(--t-sm); color: var(--ink-dim); padding: 2px 0 10px; line-height: 1.6; }
  .conv-lens-body.collapsed { display: none; }
  .conv-lens-role { color: var(--ink-faint); font-size: var(--t-meta); font-style: italic; }

  /* ── Integrated flow: lens-consulting progress ── */
  .lens-progress {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 12px 16px; margin: 4px 0;
    font-size: var(--t-sm); color: var(--ink-dim);
    animation: lp-in 0.2s ease;
  }
  @keyframes lp-in { from { opacity: 0; } to { opacity: 1; } }
  .lp-label { color: var(--ink-dim); }
  .lp-lens {
    font-family: var(--ui); font-size: var(--t-meta); padding: 2px 9px;
    border: 1px solid var(--ground-border); border-radius: var(--radius-sm);
    color: var(--ink-faint); opacity: 0.55; transition: all var(--motion) ease;
  }
  .lp-lens.ready {
    opacity: 1; color: var(--flow); border-color: var(--flow);
    background: color-mix(in srgb, var(--flow) 6%, transparent);
  }
  .lp-stage { color: var(--flow); font-style: italic; }
  @media (prefers-reduced-motion: reduce) { .lens-progress, .lp-lens { animation: none; transition: none; } }

  /* ── Integrated flow: drill-in lens strip under the answer ── */
  .lens-strip { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--ground-border); }
  .lens-strip-label {
    font-size: var(--t-label); font-weight: 600; text-transform: uppercase; letter-spacing: var(--tracking-label);
    color: var(--ink-faint); margin-bottom: 6px;
  }
  .lens-strip-shared { color: var(--ink-dim); font-size: var(--t-sm); font-style: italic; line-height: 1.5; margin-bottom: 4px; }
  .lens-strip-thin { display: flex; align-items: baseline; gap: 10px; color: var(--ink-faint); font-size: var(--t-sm); font-style: italic; }
  .lens-strip-toggle { font: inherit; font-family: var(--ui); font-style: normal; font-size: var(--t-sm); color: var(--flow); background: none; border: 0; padding: 0; cursor: pointer; white-space: nowrap; }
  .lens-strip-toggle:hover { text-decoration: underline; }
  .conv-lenses.collapsed { display: none; }
  .conv-lens-head.has-reading { display: grid; grid-template-columns: 8.5rem 1fr auto; column-gap: 14px; }
  .conv-lens-who { display: flex; flex-direction: column; gap: 1px; }
  .conv-lens-reading { font-size: var(--t-sm); line-height: 1.55; color: var(--ink-dim); }
  @media (max-width: 600px) {
    .conv-lens-head.has-reading { grid-template-columns: 1fr auto; row-gap: 2px; }
    .conv-lens-who { flex-direction: row; align-items: baseline; gap: 8px; }
    .conv-lens-head.has-reading .conv-lens-reading { grid-column: 1 / -1; grid-row: 2; }
  }
  .lens-snippet { color: var(--ink-faint); font-size: var(--t-sm); font-style: italic; line-height: 1.5; }
  .lens-loading { color: var(--ink-faint); font-size: var(--t-sm); font-style: italic; }

  /* ── Single-lens composer indicator (when a lens is chosen via the Lenses toggle) ── */
  #lens-toggle.active { border-bottom-color: var(--flow); color: var(--flow); }
  .composer-lens {
    display: flex; align-items: baseline; gap: 7px;
    padding: 6px 2px 2px; font-size: var(--t-sm); color: var(--ink-dim);
  }
  .composer-lens[hidden] { display: none; }
  /* dimensions belong to a lens — hidden in the integrated (all-lenses) view */
  .dim-bar[hidden], .dim-bar-framing[hidden] { display: none; }
  .composer-lens .cl-prefix { color: var(--ink-faint); }
  .composer-lens .cl-name { font-weight: 600; color: var(--flow); }
  .composer-lens .cl-role { color: var(--ink-faint); font-style: italic; font-size: var(--t-meta); }
  .composer-lens .cl-clear {
    margin-left: auto; background: none; border: 0; cursor: pointer;
    font: inherit; font-size: var(--t-sm); color: var(--ink-faint); padding: 2px 6px; border-radius: var(--radius-sm);
  }
  .composer-lens .cl-clear:hover { color: var(--flow); background: var(--ground-raised); }
  .lens-btn-all .lens-name { letter-spacing: 0.01em; }
  .msg-tldr { margin-bottom: 12px; }
  .msg-tldr ul { margin: 4px 0; padding-left: 18px; }
  .msg-tldr li { margin-bottom: 4px; line-height: 1.5; }
  .tldr-expander {
    font-family: var(--ui);
    font-size: var(--t-sm);
    color: var(--flow);
    background: none;
    border: none;
    cursor: pointer;
    padding: 4px 0;
    margin-bottom: 4px;
  }
  .tldr-expander:hover { text-decoration: underline; }
  .msg-full.collapsed { display: none; }

  /* Markdown in bot messages */
  .msg-bot p { margin: 0 0 8px; line-height: 1.6; }
  .msg-bot p:last-child { margin-bottom: 0; }
  .msg-bot strong { font-weight: 600; color: var(--ink); }
  .msg-bot ol, .msg-bot ul { margin: 6px 0 10px; padding-left: 20px; }
  .msg-bot li { margin-bottom: 6px; line-height: 1.55; }
  .msg-bot li p { margin: 2px 0; }
  .msg-bot h1, .msg-bot h2, .msg-bot h3, .msg-bot h4 {
    font-family: var(--display);
    font-size: var(--t-d3); font-weight: 700; color: var(--ink); margin: 12px 0 4px;
  }
  .msg-bot code {
    font-family: var(--ui);
    font-size: var(--t-meta); background: var(--ground-raised); padding: 1px 5px; border-radius: var(--radius-sm);
  }
  .msg-bot blockquote {
    border-left: 2px solid var(--ground-border); margin: 6px 0; padding: 2px 0 2px 12px; color: var(--ink-dim);
  }
  .msg-bot hr { border: none; border-top: 1px solid var(--ground-border); margin: 10px 0; }
  .msg-bot table {
    display: block;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    max-width: 100%;
    border-collapse: collapse;
    font-size: var(--t-sm);
    margin: 6px 0 10px;
  }
  .msg-bot th, .msg-bot td {
    border: 1px solid var(--ground-border);
    padding: 4px 8px;
    white-space: nowrap;
    text-align: left;
  }
  .msg-bot pre { overflow-x: auto; white-space: pre; max-width: 100%; }

  /* ── Dimension bar ── */
  .composer {
    flex-shrink: 0;
    background: var(--ground-raised);
    border-top: 1px solid var(--ground-border);
    transition: background var(--motion) ease, border-color var(--motion) ease;
  }
  .composer.welcome-mode {
    background: var(--paper);
    border-top-color: transparent;
  }
  .dim-bar-framing {
    font-family: var(--serif);
    font-size: var(--t-meta);
    font-style: italic;
    color: var(--ink-faint);
    text-align: center;
    padding: 8px 16px 0;
    letter-spacing: 0.02em;
  }
  .dim-bar {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 6px;
    padding: 6px 16px 4px;
    flex-shrink: 0;
  }
  .dim-bar-btn {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: var(--t-sm);
    font-weight: 500;
    padding: 4px 10px;
    border: 1px solid var(--ground-border);
    border-radius: var(--radius-sm);
    background: none;
    color: var(--ink-faint);
    cursor: pointer;
    transition: all var(--motion-fast) ease;
  }
  .dim-bar-btn .dim-btn-code {
    font-family: var(--ui);
    font-size: var(--t-meta);
    font-weight: 600;
  }
  .dim-bar-btn .dim-btn-label {
    font-family: var(--serif);
    font-size: var(--t-sm);
  }
  /* Per-dimension color at rest */
  .dim-bar-btn[data-dim="C"]  { border-left: 2px solid var(--dim-C); }
  .dim-bar-btn[data-dim="N"]  { border-left: 2px solid var(--dim-N); }
  .dim-bar-btn[data-dim="E"]  { border-left: 2px solid var(--dim-E); }
  .dim-bar-btn[data-dim="G"]  { border-left: 2px solid var(--dim-G); }
  .dim-bar-btn[data-dim="B"]  { border-left: 2px solid var(--dim-B); }
  .dim-bar-btn[data-dim="T"]  { border-left: 2px solid var(--dim-T); }
  .dim-bar-btn[data-dim="H"]  { border-left: 2px solid var(--dim-H); }
  .dim-bar-btn[data-dim="Dt"] { border-left: 2px solid var(--dim-Dt); }
  .dim-bar-btn:hover { border-color: var(--ink-faint); color: var(--ink-dim); }
  .dim-bar-btn:active { border-color: var(--flow); color: var(--flow); }
  .dim-bar-btn:hover[data-dim="C"]  { border-left-color: var(--dim-C); }
  .dim-bar-btn:hover[data-dim="N"]  { border-left-color: var(--dim-N); }
  .dim-bar-btn:hover[data-dim="E"]  { border-left-color: var(--dim-E); }
  .dim-bar-btn:hover[data-dim="G"]  { border-left-color: var(--dim-G); }
  .dim-bar-btn:hover[data-dim="B"]  { border-left-color: var(--dim-B); }
  .dim-bar-btn:hover[data-dim="T"]  { border-left-color: var(--dim-T); }
  .dim-bar-btn:hover[data-dim="H"]  { border-left-color: var(--dim-H); }
  .dim-bar-btn:hover[data-dim="Dt"] { border-left-color: var(--dim-Dt); }
  .dim-bar-btn.active {
    font-weight: 600;
  }
  .dim-bar-btn.active[data-dim="C"]  { border-color: var(--dim-C); color: var(--dim-C); background: color-mix(in srgb, var(--dim-C) 8%, transparent); border-left: 2px solid var(--dim-C); }
  .dim-bar-btn.active[data-dim="N"]  { border-color: var(--dim-N); color: var(--dim-N); background: color-mix(in srgb, var(--dim-N) 8%, transparent); border-left: 2px solid var(--dim-N); }
  .dim-bar-btn.active[data-dim="E"]  { border-color: var(--dim-E); color: var(--dim-E); background: color-mix(in srgb, var(--dim-E) 8%, transparent); border-left: 2px solid var(--dim-E); }
  .dim-bar-btn.active[data-dim="G"]  { border-color: var(--dim-G); color: var(--dim-G); background: color-mix(in srgb, var(--dim-G) 8%, transparent); border-left: 2px solid var(--dim-G); }
  .dim-bar-btn.active[data-dim="B"]  { border-color: var(--dim-B); color: var(--dim-B); background: color-mix(in srgb, var(--dim-B) 8%, transparent); border-left: 2px solid var(--dim-B); }
  .dim-bar-btn.active[data-dim="T"]  { border-color: var(--dim-T); color: var(--dim-T); background: color-mix(in srgb, var(--dim-T) 8%, transparent); border-left: 2px solid var(--dim-T); }
  .dim-bar-btn.active[data-dim="H"]  { border-color: var(--dim-H); color: var(--dim-H); background: color-mix(in srgb, var(--dim-H) 8%, transparent); border-left: 2px solid var(--dim-H); }
  .dim-bar-btn.active[data-dim="Dt"] { border-color: var(--dim-Dt); color: var(--dim-Dt); background: color-mix(in srgb, var(--dim-Dt) 8%, transparent); border-left: 2px solid var(--dim-Dt); }
  /* SPT active dim-bar states */
  .dim-bar-btn[data-dim="FB"] { border-left: 2px solid var(--dim-FB); }
  .dim-bar-btn[data-dim="FL"] { border-left: 2px solid var(--dim-FL); }
  .dim-bar-btn[data-dim="CY"] { border-left: 2px solid var(--dim-CY); }
  .dim-bar-btn[data-dim="EM"] { border-left: 2px solid var(--dim-EM); }
  .dim-bar-btn[data-dim="EV"] { border-left: 2px solid var(--dim-EV); }
  .dim-bar-btn[data-dim="NW"] { border-left: 2px solid var(--dim-NW); }
  .dim-bar-btn[data-dim="DU"] { border-left: 2px solid var(--dim-DU); }
  .dim-bar-btn[data-dim="CH"] { border-left: 2px solid var(--dim-CH); }
  .dim-bar-btn[data-dim="DG"] { border-left: 2px solid var(--dim-DG); }
  .dim-bar-btn.active[data-dim="FB"] { border-color: var(--dim-FB); color: var(--dim-FB); background: color-mix(in srgb, var(--dim-FB) 8%, transparent); border-left: 2px solid var(--dim-FB); }
  .dim-bar-btn.active[data-dim="FL"] { border-color: var(--dim-FL); color: var(--dim-FL); background: color-mix(in srgb, var(--dim-FL) 8%, transparent); border-left: 2px solid var(--dim-FL); }
  .dim-bar-btn.active[data-dim="CY"] { border-color: var(--dim-CY); color: var(--dim-CY); background: color-mix(in srgb, var(--dim-CY) 8%, transparent); border-left: 2px solid var(--dim-CY); }
  .dim-bar-btn.active[data-dim="EM"] { border-color: var(--dim-EM); color: var(--dim-EM); background: color-mix(in srgb, var(--dim-EM) 8%, transparent); border-left: 2px solid var(--dim-EM); }
  .dim-bar-btn.active[data-dim="EV"] { border-color: var(--dim-EV); color: var(--dim-EV); background: color-mix(in srgb, var(--dim-EV) 8%, transparent); border-left: 2px solid var(--dim-EV); }
  .dim-bar-btn.active[data-dim="NW"] { border-color: var(--dim-NW); color: var(--dim-NW); background: color-mix(in srgb, var(--dim-NW) 8%, transparent); border-left: 2px solid var(--dim-NW); }
  .dim-bar-btn.active[data-dim="DU"] { border-color: var(--dim-DU); color: var(--dim-DU); background: color-mix(in srgb, var(--dim-DU) 8%, transparent); border-left: 2px solid var(--dim-DU); }
  .dim-bar-btn.active[data-dim="CH"] { border-color: var(--dim-CH); color: var(--dim-CH); background: color-mix(in srgb, var(--dim-CH) 8%, transparent); border-left: 2px solid var(--dim-CH); }
  .dim-bar-btn.active[data-dim="DG"] { border-color: var(--dim-DG); color: var(--dim-DG); background: color-mix(in srgb, var(--dim-DG) 8%, transparent); border-left: 2px solid var(--dim-DG); }
  .dim-bar-btn.disabled { opacity: 0.6; cursor: default; }
  .dim-bar-btn.disabled:hover { border-color: var(--ground-border); color: var(--ink-faint); }

  /* Dimension tooltips */
  .dim-bar-btn { position: relative; }
  .dim-tooltip {
    display: none;
    position: absolute;
    bottom: calc(100% + 8px);
    left: 50%;
    transform: translateX(-50%);
    background: var(--ink);
    color: var(--ground);
    font-family: var(--serif);
    font-size: var(--t-meta);
    font-style: normal;
    font-weight: 400;
    line-height: 1.5;
    padding: 8px 12px;
    border-radius: var(--radius-sm);
    width: auto;
    max-width: min(240px, 90vw);
    white-space: normal;
    text-align: left;
    pointer-events: none;
    z-index: 100;
  }
  .dim-tooltip::after {
    content: '';
    position: absolute;
    top: 100%;
    left: 50%;
    transform: translateX(-50%);
    border: 5px solid transparent;
    border-top-color: var(--ink);
  }
  .dim-bar-btn:hover .dim-tooltip,
  .dim-bar-btn:focus .dim-tooltip,
  .dim-bar-btn.show .dim-tooltip { display: block; }
  .dim-bar-btn.disabled:hover .dim-tooltip { display: none; }
  .dim-bar-btn:first-child .dim-tooltip { left: 0; transform: none; }
  .dim-bar-btn:first-child .dim-tooltip::after { left: 20px; transform: none; }
  .dim-bar-btn:last-child .dim-tooltip { left: auto; right: 0; transform: none; }
  .dim-bar-btn:last-child .dim-tooltip::after { left: auto; right: 20px; transform: none; }

  .chat-input-area {
    padding: 12px 20px;
    padding-bottom: max(12px, env(safe-area-inset-bottom));
    display: flex;
    gap: 8px;
    flex-shrink: 0;
    align-items: flex-end;
  }
  .chat-input-area textarea {
    flex: 1;
    font-family: var(--serif);
    font-size: var(--t-body);
    padding: 6px 12px;
    border: 1px solid var(--rule-strong);
    border-radius: var(--radius-sm);
    background: var(--paper);
    color: var(--ink);
    transition: border-color var(--motion) ease;
    resize: none;
    overflow-y: hidden;
    min-height: 32px;
    max-height: 200px;
    line-height: 1.5;
  }
  .chat-input-area textarea:focus { border-color: var(--flow); }
  .chat-input-area textarea::placeholder { color: var(--ink-faint); }
  .chat-input-area button {
    font-family: var(--ui);
    font-size: var(--t-sm);
    font-weight: 500;
    padding: 6px 16px;
    border: none;
    border-radius: var(--radius-sm);
    background: var(--flow);
    color: var(--text-on-accent);
    cursor: pointer;
    white-space: nowrap;
    transition: background var(--motion-fast) ease;
    letter-spacing: 0.02em;
    min-height: 32px;
  }
  .chat-input-area button:hover { background: var(--flow-bright); }
  .chat-input-area button:disabled { background: var(--ground-border); cursor: not-allowed; }

  @media (max-width: 600px) {
    /* Sub-16px inputs trigger iOS focus-zoom */
    .you-input { font-size: var(--t-body); }
    .chat-welcome-title { font-size: var(--t-d2); }
    .chat-welcome-chips { flex-direction: column; align-items: stretch; max-width: 280px; }
    .diagram-pane { width: 92vw; padding: 20px 16px 24px; }
    .dim-bar { gap: 4px; }
    /* Larger, more legible answer + source text on phones */
    .msg { font-size: var(--t-body); line-height: 1.65; }
    .evidence-list { font-size: var(--t-sm); }
    .evidence-type, .evidence-score { font-size: var(--t-meta); }
    .evidence-list li, .evidence-source { overflow-wrap: anywhere; word-break: break-word; }
    .tldr-expander {
      display: block;
      width: 100%;
      min-height: 44px;
      border: 1px solid var(--ground-border);
      border-radius: var(--radius-md);
      text-align: center;
      font-size: var(--t-sm);
    }
  }


  /* ── Lens bar: choose your reader ── */
  .lens-bar {
    display: flex;
    align-items: stretch;
    gap: 0;
    border-bottom: 1px solid var(--ground-border);
    background: var(--ground);
    overflow-x: auto;
    scrollbar-width: none;
  }
  .lens-bar::-webkit-scrollbar { display: none; }
  .lens-bar-label {
    font-family: var(--ui);
    font-size: var(--t-label); font-weight: 600;
    letter-spacing: var(--tracking-label);
    text-transform: uppercase;
    color: var(--ink-faint);
    align-self: center;
    padding: 0 10px 0 16px;
    white-space: nowrap;
  }
  .lens-btn {
    flex: 1;
    min-width: 0;
    padding: 8px 12px 7px;
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    cursor: pointer;
    text-align: center;
    transition: background var(--motion-fast) ease, border-color var(--motion-fast) ease;
    line-height: 1.25;
  }
  .lens-btn .lens-name {
    display: block;
    font-family: var(--serif);
    font-size: var(--t-sm);
    color: var(--ink-dim);
  }
  .lens-btn .lens-tag {
    display: block;
    font-family: var(--ui);
    font-size: var(--t-meta);
    letter-spacing: 0.04em;
    color: var(--ink-faint);
    margin-top: 1px;
  }
  .lens-btn:hover { background: var(--ground-raised); }
  .lens-btn.active { border-bottom-color: var(--lens-accent, var(--flow)); }
  .lens-btn .lens-tag { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lens-btn.active .lens-name { color: var(--lens-accent, var(--flow)); }
  .lens-btn:focus-visible { outline: var(--focus-ring); outline-offset: -2px; }

  /* ── Thinker card (popover under the lens bar — overlays, never displaces) ── */
  .lens-zone { position: relative; }
  .thinker-card {
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    z-index: 40;
    display: flex;
    gap: 14px;
    align-items: flex-start;
    padding: 14px 18px;
    border-bottom: 1px solid var(--ground-border);
    background: var(--ground);
    animation: thinker-in 0.25s ease;
  }
  @keyframes thinker-in { from { opacity: 0; transform: translateY(-3px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .thinker-card { animation: none; } }
  .thinker-card[hidden] { display: none; }
  .thinker-medallion {
    flex: 0 0 52px;
    width: 52px; height: 52px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--serif);
    font-size: var(--t-d3);
    color: var(--text-on-accent);
    background: var(--lens-accent, var(--flow));
    user-select: none;
  }
  .thinker-body { flex: 1; min-width: 0; }
  .thinker-name {
    font-family: var(--serif);
    font-size: var(--t-body);
    color: var(--ink);
  }
  .thinker-dates { font-family: var(--ui); font-size: var(--t-meta); color: var(--ink-faint); margin-left: 6px; }
  .thinker-role { font-size: var(--t-meta); color: var(--ink-dim); margin-top: 1px; }
  .thinker-bio { font-size: var(--t-meta); color: var(--ink-dim); margin-top: 5px; line-height: 1.45; max-width: 62ch; }
  .thinker-asks {
    font-size: var(--t-meta);
    margin-top: 6px;
    color: var(--lens-accent, var(--flow));
    font-style: italic;
  }
  /* Curated deep-dive links (2026-08-31): quiet footer row, external. */
  .thinker-links { font-family: var(--ui); font-size: var(--t-meta); margin-top: 7px; color: var(--ink-faint); }
  .thinker-links a { color: var(--ink-dim); text-decoration: underline; text-underline-offset: 2px; text-decoration-color: var(--ground-border); }
  .thinker-links a:hover { color: var(--flow); text-decoration-color: var(--flow); }
  .thinker-dismiss {
    flex: 0 0 auto;
    background: none; border: none; cursor: pointer;
    color: var(--ink-faint);
    font-size: var(--t-sm);
    padding: 2px 6px;
    border-radius: var(--radius-sm);
  }
  .thinker-dismiss:hover { color: var(--ink-dim); background: color-mix(in srgb, var(--ink) 6%, transparent); }
  @media (max-width: 560px) {
    .lens-bar-label { display: none; }
    .lens-btn { min-width: 86px; }
    .lens-btn .lens-tag { display: none; }
    .thinker-medallion { flex-basis: 42px; width: 42px; height: 42px; font-size: var(--t-body); }
  }

  .pathology-badge {
    font-family: var(--ui);
    font-size: var(--t-meta);
    padding: 2px 8px;
    border-radius: var(--radius-sm);
    background: color-mix(in srgb, var(--verdict-error) 10%, transparent);
    color: var(--verdict-error);
    border: 1px solid color-mix(in srgb, var(--verdict-error) 20%, transparent);
    margin-left: 4px;
    cursor: help;
  }

  /* ── Thinking / Stage Progress Indicator ── */
  .msg-thinking {
    align-self: flex-start;
    font-family: var(--ui);
    font-size: var(--t-meta);
    color: var(--ink-faint);
    padding: 10px 14px;
  }
  .msg-thinking::after {
    content: '';
    animation: thinking 1.5s infinite;
  }
  @keyframes thinking {
    0% { content: '.'; }
    33% { content: '..'; }
    66% { content: '...'; }
  }
  .stage-progress {
    align-self: flex-start;
    display: flex;
    gap: 6px;
    padding: 10px 14px;
    font-family: var(--ui);
    font-size: var(--t-meta);
  }
  .stage-item {
    display: flex;
    align-items: center;
    gap: 4px;
    color: var(--ink-faint);
    opacity: 0.4;
    transition: opacity var(--motion), color var(--motion);
  }
  .stage-item.active {
    opacity: 1;
    color: var(--flow);
  }
  .stage-item.active::after {
    content: '';
    animation: thinking 1.5s infinite;
  }
  .stage-item.done {
    opacity: 0.7;
    color: var(--ink-faint);
  }
  .stage-item .stage-check { display: none; }
  .stage-item.done .stage-check { display: inline; }
  .stage-item .stage-time {
    font-size: var(--t-meta);
    opacity: 0.6;
  }
  .stage-sep {
    color: var(--ink-faint);

<script>
// Inline icons on the shared grammar (web/src/icons.tsx: 24 grid, 2px stroke,
// square caps, mitre joins). Names and paths copied from the UI set.
var ICO_ATTRS = 'viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"';
function ico(d, cls) { return '<svg class="' + (cls || 'ic') + '" ' + ICO_ATTRS + '><path d="' + d + '"/></svg>'; }
var ICON_CHEVRON_DOWN = ico('M5 9 L12 16 L19 9');       // chevron-down
var ICON_CHEVRON_UP = ico('M5 15 L12 8 L19 15');        // chevron-up
var ICON_CHECK = ico('M5 12 L10 17 L19 8');             // check
var ICON_FORWARD = ico('M4 12 H19 M13 6 L19 12 L13 18'); // forward
var ICON_USER = ico('M8 9 A4 4 0 1 0 16 9 A4 4 0 1 0 8 9 M4 21 V19 A8 8 0 0 1 20 19 V21'); // drawn here on the grammar; not yet in icons.tsx
// ══════════════════════════════════════════
// FACETS — Chat Pipeline (Refactored)
// Served at /chat/ under the facets.systems portal. Welcome state in chat panel.
// Tab-locked responses. No duplicate submissions.
// ══════════════════════════════════════════

const LOCAL_HOST = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' || window.location.protocol === 'file:');
const API = LOCAL_HOST ? 'http://localhost:5010' : 'https://api.facets.systems';

// ── Identity (facets#369) ──
// The client no longer invents a user. A managed provider mints the subject and
// GSR verifies the token at one seam (gsr#47); everything below that seam is
// getAccessToken(). The publishable key is public by design (it only identifies
// the project; row access never goes through it). On localhost the local minter
// runs instead, matching GSR's AUTH_MODE=local claim shape so the whole stack
// works offline against a dev server.
const SUPABASE_URL = 'https://xezkcsntepjnvdxhkdwi.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_7xS0HratrVUgOuZz5yIzpQ_AS4F2JU-';
const AUTH_MODE = (SUPABASE_URL && !LOCAL_HOST) ? 'supabase' : 'local';
const DEV_AUTH_SECRET = 'facets-dev-secret'; // local mode only; AUTH_MODE is a hostname check, so this is unreachable in production
const TOKEN_TTL = 7 * 24 * 3600;

// Read-only shared-answer mode (/a/<id>): render a stored snapshot, suppress re-run affordances,
// and never write to the recipient's local history.
let READONLY = false;
// Set when the seam rejects our token. The cache stays readable; the composer closes.
let SESSION_EXPIRED = false;

// Identity continuity (facets#440). The subject the last token carried is kept in
// local storage. When the provider has no live session but this browser had a
// subject before, the page does not mint a new anonymous user silently: it stops
// at the seam, says so in the composer, and mints only when the reader chooses
// to continue as new. Conversations synced under the earlier subject stay in the
// rail, marked, instead of being swept. Storage wiped wholesale defeats this
// (both keys go together); only a linked sign-in survives that.
const LAST_SUBJECT_KEY = 'facets_auth_last_subject';
const ROLLOVER_ACK_KEY = 'facets_auth_rollover_ack';
let CURRENT_SUBJECT = null;
let ROLLED_FROM = null; // the earlier subject, while the rollover is unacknowledged

function lastSubject() { try { return localStorage.getItem(LAST_SUBJECT_KEY); } catch (e) { return null; } }
function noteSubject(sub) {
  if (!sub) return;
  CURRENT_SUBJECT = sub;
  try { localStorage.setItem(LAST_SUBJECT_KEY, sub); } catch (e) {}
}
// True when minting now would silently replace an identity this browser had.
function rolloverPending() {
  const prev = lastSubject();
  if (!prev) return false;
  let ack = null;
  try { ack = localStorage.getItem(ROLLOVER_ACK_KEY); } catch (e) {}
  return ack !== prev;
}
function continueAsNew() {
  try { localStorage.setItem(ROLLOVER_ACK_KEY, lastSubject() || ''); } catch (e) {}
  ROLLED_FROM = null;
  SESSION_EXPIRED = false;
  renderSessionState();
  hydrateConversations().then(flushOutbox);
}

function b64url(bytes) {
  let s = '';
  for (const b of bytes) s += String.fromCharCode(b);
  return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function b64urlJson(obj) { return b64url(new TextEncoder().encode(JSON.stringify(obj))); }

function authSubject() {
  let sub = localStorage.getItem('facets_auth_sub');
  if (!sub) { sub = crypto.randomUUID(); localStorage.setItem('facets_auth_sub', sub); }
  return sub;
}

async function mintLocalToken() {
  const now = Math.floor(Date.now() / 1000);
  const body = b64urlJson({ alg: 'HS256', typ: 'JWT' }) + '.' + b64urlJson({
    sub: authSubject(), aud: 'authenticated', role: 'authenticated',
    iat: now, exp: now + TOKEN_TTL, is_anonymous: true,
  });
  const key = await crypto.subtle.importKey(
    'raw', new TextEncoder().encode(DEV_AUTH_SECRET),
    { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']);
  const sig = await crypto.subtle.sign('HMAC', key, new TextEncoder().encode(body));
  return body + '.' + b64url(new Uint8Array(sig));
}

function tokenExpiry(tok) {
  try { return JSON.parse(atob(tok.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))).exp || 0; }
  catch (e) { return 0; }
}

let localTokenPromise = null;
function localToken() {
  const cached = localStorage.getItem('facets_auth_token');
  if (cached && tokenExpiry(cached) - 300 > Date.now() / 1000) { noteSubject(authSubject()); return Promise.resolve(cached); }
  if (!localStorage.getItem('facets_auth_sub') && rolloverPending()) { ROLLED_FROM = lastSubject(); return Promise.resolve(null); }
  if (!localTokenPromise) {
    localTokenPromise = mintLocalToken().then(tok => {
      try { localStorage.setItem('facets_auth_token', tok); } catch (e) {}
      noteSubject(authSubject());
      localTokenPromise = null;
      return tok;
    }, e => { localTokenPromise = null; throw e; });
  }
  return localTokenPromise;
}

// The vendored SDK is 200KB and only the provider path needs it, so it loads on demand.
let sbLoad = null;
function loadSupabaseSdk() {
  if (window.supabase) return Promise.resolve(window.supabase);
  if (!sbLoad) sbLoad = new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = 'vendor/supabase.js';
    s.onload = () => resolve(window.supabase);
    s.onerror = () => reject(new Error('supabase sdk unavailable'));
    document.head.appendChild(s);
  });
  return sbLoad;
}

let sbClient = null;
async function supabaseToken() {
  const sdk = await loadSupabaseSdk();
  if (!sbClient) sbClient = sdk.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  let { data } = await sbClient.auth.getSession();
  if (!data.session) {
    if (rolloverPending()) { ROLLED_FROM = lastSubject(); return null; }
    const r = await sbClient.auth.signInAnonymously();
    if (r.error) throw r.error;
    data = r.data;
  }
  if (data.session && data.session.user) noteSubject(data.session.user.id);
  return data.session ? data.session.access_token : null;
}

// The one seam. Every GSR call goes through authFetch, which goes through here.
async function getAccessToken() {
  try {
    return AUTH_MODE === 'supabase' ? await supabaseToken() : await localToken();
  } catch (e) {
    return null;
  }
}

async function authFetch(path, opts) {
  const o = Object.assign({}, opts || {});
  o.headers = Object.assign({}, o.headers || {});
  const tok = await getAccessToken();
  if (!tok && ROLLED_FROM) { onSessionExpired(); return new Response(null, { status: 401 }); }
  if (tok) o.headers['Authorization'] = 'Bearer ' + tok;
  const r = await fetch(API + path, o);
  if (r.status === 401) onSessionExpired();
  else if (SESSION_EXPIRED && r.ok) { SESSION_EXPIRED = false; renderSessionState(); }
  return r;
}

// A rejected token is not a reason to mint a second user (council §4.4). The cache
// stays on screen; the composer closes until the session is restored.
function onSessionExpired() {
  if (SESSION_EXPIRED) return;
  SESSION_EXPIRED = true;
  renderSessionState();
}

function renderSessionState() {
  const pane = document.querySelector('.chat-pane');
  if (pane) pane.classList.toggle('session-expired', SESSION_EXPIRED);
  const input = document.getElementById('chat-input');
  const send = document.getElementById('send-btn');
  if (input) input.disabled = SESSION_EXPIRED;
  if (send) send.disabled = SESSION_EXPIRED || inFlight;
  let note = document.getElementById('session-note');
  if (!SESSION_EXPIRED) { if (note) note.remove(); return; }
  if (note) note.remove();
  const composer = document.querySelector('.composer');
  if (!composer) return;
  note = document.createElement('div');
  note.id = 'session-note';
  note.className = 'session-note';
  if (ROLLED_FROM) {
    const text = document.createElement('span');
    text.textContent = 'This browser was signed in as ' + ROLLED_FROM.slice(0, 8) + '\u2026 before and that session is gone. '
      + 'Its conversations are kept on the server and stay listed here. New ones start under a fresh identity. ';
    const btn = document.createElement('button');
    btn.className = 'session-note-btn';
    btn.textContent = 'Continue as new';
    btn.onclick = continueAsNew;
    note.appendChild(text); note.appendChild(btn);
  } else {
    note.textContent = "This browser's session expired. Keep chatting as new, or restore from another device.";
  }
  composer.insertBefore(note, composer.firstChild);
}

// One-shot migration (gsr#47): the browser's old client-minted UUID is offered to
// the seam once, so history written before identity existed follows the subject.
async function claimLegacyIdentity() {
  const legacy = localStorage.getItem('facets_user_id');
  if (!legacy) return;
  try {
    const r = await authFetch('/v1/auth/claim-legacy', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ legacy_user_id: legacy }),
    });
    // A refusal is final; only a route that is not there yet earns another try.
    if (r.ok || (r.status >= 400 && r.status < 500 && r.status !== 404)) {
      localStorage.removeItem('facets_user_id');
      localStorage.removeItem('facets_user_name');
    }
  } catch (e) {}
}

function logFunnelEvent(event, meta) {
  try {
    authFetch('/log-event', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        event,
        session_id: (getTab() || {}).sessionId || null,
        meta: meta || null,
      }),
    }).catch(() => {});
  } catch(e) {}
}

// carry any tradition's codes (drilled and shared answers aren't bound to the active mode).
// The active mode wins the C/E/B collisions shared by Mobus and Bunge.
function dimDisplayName(d) {
  if (DIM_NAMES[d]) return DIM_NAMES[d];
  for (const k in MODE_CONFIGS) {
    const n = MODE_CONFIGS[k].names;
    if (n && n[d]) return n[d];
  }
  return d;
}

// Fire a dimension query — contextual if conversation exists, cold otherwise
// On touch devices, hover tooltips never fire — so the first tap on a dimension chip

const DIM_COARSE_POINTER = window.matchMedia('(hover: none)').matches;
function activateDimBtn(btn) {
  if (btn.classList.contains('disabled')) return;
  if (DIM_COARSE_POINTER && !btn.classList.contains('show')) {
    document.querySelectorAll('.dim-bar-btn.show').forEach(b => b.classList.remove('show'));
    btn.classList.add('show');
    return;
  }
  btn.classList.remove('show');
  fireDimQuery(btn.getAttribute('data-dim'));
}

function fireDimQuery(dim) {
  const tab = getTab();
  const hasConvo = tab && tab.messages.some(m => m.role === 'user');
  if (hasConvo) {
    const lastUser = [...tab.messages].reverse().find(m => m.role === 'user');
    const topic = lastUser ? lastUser.text.slice(0, 80) : '';
    sendQueryStream('Based on our conversation so far, how does ' + dimDisplayName(dim) + ' (' + dim + ') apply? What does this structural dimension reveal that we haven\'t explored yet?');
  } else {
    // Chips on drilled/shared answers can carry another lens's codes — DIM_QUERIES only
    // covers the active mode, so fall back to a generic dimension query.
    sendQueryStream(DIM_QUERIES[dim] || ('How does ' + dimDisplayName(dim) + ' (' + dim + ') apply as a structural dimension of systems?'));
  }
}

function pickWelcomeChips(n = 4) {
  const byTag = {};
  EXAMPLE_POOL.forEach(e => e.tags.forEach(t => (byTag[t] = byTag[t] || []).push(e)));
  const picks = [];
  const used = new Set();
  // Guarantee at least one applied/domain and one design/diagnostic
  for (const tag of ['applied', 'design']) {
    const pool = (byTag[tag] || []).filter(e => !used.has(e.query));
    if (pool.length) { const p = pool[Math.floor(Math.random() * pool.length)]; picks.push(p); used.add(p.query); }
  }
  // Fill remaining slots randomly
  const remaining = EXAMPLE_POOL.filter(e => !used.has(e.query));
  while (picks.length < n && remaining.length) {
    const idx = Math.floor(Math.random() * remaining.length);
    picks.push(remaining[idx]); used.add(remaining[idx].query);
    remaining.splice(idx, 1);
  }
  // Shuffle final order
  for (let i = picks.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [picks[i], picks[j]] = [picks[j], picks[i]]; }
  return picks;
}

// Track user scroll — disable auto-scroll when user scrolls up

// Focus follows scroll (workbench phase 3): as the ledger scrolls, the sheet
// nearest the top of the view becomes the focused one and the dock follows.
// At the bottom the cursor returns to null — "following the latest answer" —
// so a live conversation keeps its default behavior. rAF-throttled; the dock
// stepper's own scrollIntoView lands on the sheet it just focused, so the two
// mechanisms agree rather than fight. Throttled with a timeout, not rAF —
// rAF pauses in background tabs and would wedge the pending flag.
let scrollFocusPending = false;
function scheduleScrollFocus(chatEl) {
  if (scrollFocusPending) return;
  scrollFocusPending = true;
  setTimeout(() => {
    scrollFocusPending = false;
    const sheets = [...chatEl.querySelectorAll('.sheet')];
    if (!sheets.length) return;
    const atBottom = chatEl.scrollHeight - chatEl.scrollTop - chatEl.clientHeight < 40;
    if (atBottom) {
      if (dockCursor !== null) { dockCursor = null; renderDock(); syncSheetFocus(); }
      return;
    }
    const topEdge = chatEl.getBoundingClientRect().top + 72;
    let pick = null;
    for (const sh of sheets) {
      const r = sh.getBoundingClientRect();
      if (r.bottom < topEdge) continue;       // fully scrolled past
      pick = sh; break;                        // first sheet still in view
    }
    if (!pick) pick = sheets[sheets.length - 1];
    const bi = Number(pick.dataset.bot);
    const total = getTab() ? getTab().messages.filter(mm => mm.role === 'bot').length : 0;
    const want = (bi >= total - 1) ? null : bi;
    if (want !== dockCursor) { dockCursor = want; renderDock(); syncSheetFocus(); }
  }, 60);
}

function replayDiagramState() {

  if (!lastBot || !lastBot.meta) return;
