      };
      sheet.querySelector('.sheet-head').onclick = () => {
        if (sheet.classList.contains('collapsed')) sheet.classList.remove('collapsed');
      };
      sheet.addEventListener('click', () => focusSheet(bi));
      return;
    }
    if (m.role === 'bot') sheetBot++; // unpaired answer stays a bubble; the count stays aligned
    openSheet = null;
    el.appendChild(div);
  });
  if (!userScrolledUp) el.scrollTop = el.scrollHeight;
  renderDock();
  syncSheetFocus();
  renderConvRail();
}

function parseTLDR(text) {
  const tldrMatch = text.match(/^##\s*TL;DR\s*\n([\s\S]*?)(?=\n##\s)/m);
  const fullMatch = text.match(/^##\s*Full Analysis\s*\n([\s\S]*)$/m);
  if (!tldrMatch) return { hasTLDR: false, tldr: '', full: text };
  return { hasTLDR: true, tldr: tldrMatch[1].trim(), full: fullMatch ? fullMatch[1].trim() : text };
}

function renderGroundingMarkers(md) {
  // gsr#37 grounding signal: the integration prompt emits [[g: source]] / [[u]] markers
  // inline after corpus-grounded / parametric claims. Render them as visible badges —
  // "ungrounded" is a first-class state, not hidden.
  return md
    .replace(/\[\[g:\s*([^\]]*)\]\]/g, (_, src) =>
      `<span class="grounding-badge grounding-badge-grounded" title="${src.trim().replace(/"/g, '&quot;')}">✓ ${src.trim()}</span>`)
    .replace(/\[\[u\]\]/g, '<span class="grounding-badge grounding-badge-ungrounded" title="not in the retrieved corpus">◌ ungrounded</span>');
}

function cleanMarkdown(md) {
  return renderGroundingMarkers(md)
    .replace(/^\s*\.\s*$/gm, '')        // orphan period on its own line
    .replace(/ +\./g, '.')              // space before period
    .replace(/\n{3,}/g, '\n\n');        // collapse excess blank lines
}

function renderMath(el) {
  if (typeof katex === 'undefined') return;
  el.innerHTML = el.innerHTML
    .replace(/\$\$([\s\S]+?)\$\$/g, (_, tex) => {
      try { return katex.renderToString(tex.trim(), { displayMode: true, throwOnError: false }); }
      catch(e) { return '$$' + tex + '$$'; }
    })
    .replace(/\$([^\$\n]+?)\$/g, (m, tex) => {
      if (/^\d/.test(tex.trim())) return m;
      try { return katex.renderToString(tex.trim(), { displayMode: false, throwOnError: false }); }
      catch(e) { return '$' + tex + '$'; }
    });
}

function renderClean(md) {
  const html = marked.parse(cleanMarkdown(md));
  return html;
}

async function askAll(question, btn) {
  if (window.__askAllInFlight) return;
  window.__askAllInFlight = true;
  const originTabId = getTab() ? getTab().id : null;
  if (btn) { btn.disabled = true; btn.textContent = 'Comparing 5 lenses…'; }
  addMessage('thinking', 'Comparing across all five lenses…', null, originTabId);
  try {
    const r = await fetch(API + '/ask-all', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question, user_id: FACETS_USER_ID, user_name: getUserName(), session_id: (tabs.find(t => t.id === originTabId) || {}).sessionId || '' })
    });
    const data = await r.json();
    const tab = tabs.find(t => t.id === originTabId);
    if (tab) tab.messages = tab.messages.filter(mm => mm.role !== 'thinking');
    addMessage('convergence', '', { question, lenses: data.lenses || [], convergence: data.convergence || {} }, originTabId);
  } catch (e) {
    const tab = tabs.find(t => t.id === originTabId);
    if (tab) tab.messages = tab.messages.filter(mm => mm.role !== 'thinking');
    addMessage('system', 'Could not compare lenses — try again.', null, originTabId);
  } finally {
    window.__askAllInFlight = false;
    if (btn) { btn.disabled = false; btn.textContent = '◇ Compare all lenses'; }
  }
}

function addMessage(role, text, meta, tabId) {
  const tab = tabId ? tabs.find(t => t.id === tabId) : getTab();
  if (!tab) return;
  tab.messages.push({ role, text, meta: meta || null });
  saveTabs();
  if (!tabId || tabId === activeTab) renderMessages();
}

// ── Export ──
function exportChatJSON() {
  const tab = getTab();
  if (!tab) return;
  const data = JSON.stringify(tab.messages, null, 2);
  const blob = new Blob([data], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = (tab.name || 'chat') + '.json';
  a.click();
  URL.revokeObjectURL(url);
}
function exportChatMarkdown() {
  const tab = getTab();
  if (!tab) return;
  const md = '# ' + (tab.name || 'Facets Chat') + '\n\n' +
    tab.messages.filter(m => m.role !== 'system').map(m => {
      if (m.role === 'user') return '**Q:** ' + m.text;
      let out = m.text;
      if (m.meta) {
        const parts = [];
        if (m.meta.dimensions && m.meta.dimensions.length) parts.push('Dimensions: ' + m.meta.dimensions.map(d => dimDisplayName(d) + ' (' + d + ')').join(', '));
        if (m.meta.route) parts.push('Route: ' + m.meta.route);
        if (m.meta.intensity) parts.push('Intensity: ' + m.meta.intensity);
        if (m.meta.sources && m.meta.sources.length) {
          parts.push('Sources: ' + [...new Set(m.meta.sources.map(s => s.source))].join(', '));
        }
        if (parts.length) out += '\n\n*' + parts.join(' | ') + '*';
      }
      return out;
    }).join('\n\n---\n\n');
  const blob = new Blob([md], { type: 'text/markdown' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = (tab.name || 'chat') + '.md';
  a.click();
  URL.revokeObjectURL(url);
}
// ── API ──
async function checkStatus() {
  const dot = document.getElementById('status-dot');
  try {
    const r = await fetch(API + '/status');
    if (r.ok) {
      const data = await r.json();
      dot.className = 'status-dot online';
      dot.setAttribute('aria-label', 'Connected');
      dot.title = 'Connected';
      // Update LLM display — skip if still loading
      const model = data.model || 'unknown';
      if (model === 'loading' || !data.ready) {
        const loadingName = document.getElementById('llm-model-name');
        if (loadingName) loadingName.textContent = 'Loading...';
      } else {
      const modelNameEl = document.getElementById('llm-model-name');
      if (modelNameEl) modelNameEl.textContent = 'Synthesis';
      const mode = data.mode || (model.includes('claude') ? 'cloud' : 'local');
      const tag = document.getElementById('llm-model-tag');
      const diagTag = document.getElementById('llm-diagram-tag');
      // The engine picks the model; the header names it as provenance.
      const pretty = mode === 'local' ? model + ' \u00b7 Local'
        : model.includes('sonnet') ? 'Claude Sonnet' : 'Claude Haiku';
      tag.textContent = pretty;
      if (diagTag) diagTag.textContent = pretty;
      const wsb = document.getElementById('web-search-badge');
      if (wsb) wsb.style.display = data.web_search ? 'inline' : 'none';
      } // end model display
    } else {
      dot.className = 'status-dot';
      dot.setAttribute('aria-label', 'Disconnected');
      dot.title = 'Disconnected';
    }
  } catch(e) {
    dot.className = 'status-dot';
    dot.setAttribute('aria-label', 'Disconnected');
    dot.title = 'Disconnected';
  }
}

function getRecentHistory(maxTurns) {
  const tab = tabs.find(t => t.id === activeTab);
  if (!tab) return [];
  return tab.messages
    .filter(m => m.role === 'user' || m.role === 'bot')
    .slice(-(maxTurns * 2))
    .map(m => ({ role: m.role, text: m.text.slice(0, 1000) }));
}

    renderTabs();

  pushConversationUrl();

  // Thinking indicator as a tab-aware message (survives re-renders)

      originTab.messages = originTab.messages.filter(m => m.role !== 'thinking');

async function sendQueryStream(question) {
  if (inFlight) return;
  inFlight = true;
  userScrolledUp = false;

  const originTabId = activeTab;
  const btn = document.getElementById('send-btn');
  const dot = document.getElementById('status-dot');
  btn.disabled = true;
  dot.className = 'status-dot loading';

  addMessage('user', question, null, originTabId);

  // Auto-name tab from first query
  const tab = tabs.find(t => t.id === originTabId);
  const userMsgCount = tab ? tab.messages.filter(m => m.role === 'user').length : 1;
  logFunnelEvent(userMsgCount <= 1 ? 'query_submitted' : 'query_submitted_second');
  if (tab && userMsgCount === 1) {
    tab.name = question.length > 30 ? question.slice(0, 28) + '…' : question;
    saveTabs();
    renderTabs();
  }

  pushConversationUrl();

  // Thinking indicator
  addMessage('thinking', '', null, originTabId);

  updateDiagram('query', question);
  animateFlow('query');

  try {
    const r = await fetch(API + '/ask-stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        question,
        history: getRecentHistory(6),
        session_id: (tabs.find(t => t.id === originTabId) || {}).sessionId || '',
        user_id: FACETS_USER_ID,
        user_name: getUserName(),
        mode: activeMode
      })
    });

    if (!r.ok || !r.body) throw new Error('Stream failed');

    const reader = r.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    let accText = '';
    let currentEvent = null;
    let streamEl = null;  // DOM element for streaming text
    let elapsedTimer = null;
    let elapsedStart = null;

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop();

      for (const line of lines) {
        if (line.startsWith('event: ')) {
          currentEvent = line.slice(7).trim();
        } else if (line.startsWith('data: ') && currentEvent) {
          const payload = JSON.parse(line.slice(6));

          if (currentEvent === 'status') {
            if (!streamEl) {
              let stageOrder = ['classifying', 'retrieving', 'synthesizing'];
              let stageLabels = {
                classifying: 'Classifying',
                retrieving: 'Retrieving',
                synthesizing: 'Synthesizing'
              };

              // Insert web search stage when intensity is full
              if (payload.stage === 'synthesizing' && payload.web_search) {
                stageOrder = ['classifying', 'retrieving', 'searching', 'synthesizing'];
                stageLabels.searching = 'Searching web';
              }

              const currentStageIdx = stageOrder.indexOf(
                payload.stage === 'synthesizing' && payload.web_search ? 'searching' : payload.stage
              );

              // Create stage progress element on first status event
              let progressEl = document.querySelector('.stage-progress');
              if (!progressEl) {
                const thinkEl = document.querySelector('.msg-thinking');
                if (thinkEl) thinkEl.remove();
                const originTab = tabs.find(t => t.id === originTabId);
                if (originTab) originTab.messages = originTab.messages.filter(m => m.role !== 'thinking');

                progressEl = document.createElement('div');
                progressEl.className = 'stage-progress';
              }

              // Rebuild stages (handles dynamic insertion of web search stage)
              progressEl.innerHTML = '';
              for (let i = 0; i < stageOrder.length; i++) {
                if (i > 0) {
                  const sep = document.createElement('span');
                  sep.className = 'stage-sep';
                  sep.textContent = '→';
                  progressEl.appendChild(sep);
                }
                const item = document.createElement('span');
                item.className = 'stage-item';
                item.dataset.stage = stageOrder[i];
                item.innerHTML = `<span class="stage-check">✓</span> ${stageLabels[stageOrder[i]]}<span class="stage-time"></span>`;
                progressEl.appendChild(item);
              }
              if (!progressEl.parentNode) {
                const elapsedSpan = document.createElement('span');
                elapsedSpan.className = 'stage-elapsed';
                elapsedSpan.textContent = '0s';
                progressEl.appendChild(elapsedSpan);
                document.getElementById('chat-messages').appendChild(progressEl);
                elapsedStart = Date.now();
                elapsedTimer = setInterval(() => {
                  elapsedSpan.textContent = Math.floor((Date.now() - elapsedStart) / 1000) + 's';
                }, 1000);
              }
              if (!userScrolledUp) progressEl.scrollIntoView({ behavior: 'smooth', block: 'end' });

              // Update stage states
              progressEl.querySelectorAll('.stage-item').forEach(item => {
                const idx = stageOrder.indexOf(item.dataset.stage);
                if (idx < currentStageIdx) {
                  item.className = 'stage-item done';
                  if (item.dataset.stage === 'classifying' && payload.classify_ms) {
                    item.querySelector('.stage-time').textContent = ` ${payload.classify_ms}ms`;
                  }
                  if (item.dataset.stage === 'retrieving' && payload.retrieve_ms) {
                    item.querySelector('.stage-time').textContent = ` ${payload.retrieve_ms}ms`;
                  }
                } else if (idx === currentStageIdx) {
                  item.className = 'stage-item active';
                } else {
                  item.className = 'stage-item';
                }
              });
            }

            if (payload.stage === 'retrieving' && payload.dimensions) {
              updateDiagram('tuple', {
                dims: payload.dimensions,
                intensity: payload.intensity || 'none',
                reasoning: payload.reasoning || ''
              });
              updateDiagram('retrieval', payload.dimensions);
            }
            if (payload.stage === 'synthesizing') {
              animateFlow('llm');
            }

          } else if (currentEvent === 'token') {
            // Remove progress indicator on first token
            if (elapsedTimer) { clearInterval(elapsedTimer); elapsedTimer = null; }
            const progressEl = document.querySelector('.stage-progress');
            if (progressEl) progressEl.remove();
            const originTab = tabs.find(t => t.id === originTabId);
            if (originTab && originTab.messages.some(m => m.role === 'thinking')) {
              originTab.messages = originTab.messages.filter(m => m.role !== 'thinking');
              const thinkEl = document.querySelector('.msg-thinking');
              if (thinkEl) thinkEl.remove();
            }

            accText += payload.text;

            // Create or update streaming message element
            if (!streamEl) {
              streamEl = document.createElement('div');
              streamEl.className = 'msg msg-bot msg-streaming';
              streamEl.innerHTML = marked.parse(renderGroundingMarkers(accText));
              document.getElementById('chat-messages').appendChild(streamEl);
              if (!userScrolledUp) streamEl.scrollIntoView({ behavior: 'smooth', block: 'end' });
            } else {
              streamEl.innerHTML = marked.parse(renderGroundingMarkers(accText));
              if (!userScrolledUp) streamEl.scrollIntoView({ behavior: 'smooth', block: 'end' });
            }

          } else if (currentEvent === 'done') {
            if (payload.timing) {
              console.log('%c⏱ Facets Timing', 'font-weight:bold;color:#3a6e62', payload.timing);
            }
            // Remove streaming element, add final message to tab state
            if (streamEl) streamEl.remove();

            const dims = payload.dimensions || [];
            const route = payload.route || 'unknown';
            const confidence = payload.confidence || '';
            const intensity = payload.intensity || 'none';
            const reasoning = payload.reasoning || '';
            const sources = payload.sources || [];
            const pathology = payload.pathology || null;
            const answer = payload.answer || accText;

            // Clean thinking tags from answer
            const cleanAnswer = answer.replace(/<think>[\s\S]*?<\/think>\s*/g, '').trim();

            updateDiagram('response', { route, confidence, dims });

            addMessage('bot', cleanAnswer, { route, confidence, dimensions: dims, intensity, reasoning, sources, pathology, web_search: payload.web_search, answer_id: payload.answer_id, asked: composerLens || activeMode }, originTabId);
            updateDimBar(dims);
            dot.className = 'status-dot online';
            logFunnelEvent('answer_rendered');
            setTimeout(maybePromptName, 1200);
          }
          currentEvent = null;
        }
      }
    }
  } catch(e) {
    console.error('Stream error:', e);
    // Fall back to non-streaming
    const originTab = tabs.find(t => t.id === originTabId);
    if (originTab) {
      originTab.messages = originTab.messages.filter(m => m.role !== 'thinking');
    }
    // Remove any streaming element
    const streamEl = document.querySelector('.msg-streaming');
    if (streamEl) streamEl.remove();
    // Try non-streaming fallback
    inFlight = false;
    btn.disabled = false;
    dot.className = 'status-dot';
    clearDiagramHighlights();
    addMessage('system', 'Streaming failed — retrying...', null, originTabId);
    return sendQuery(question);
  }
  btn.disabled = false;
  inFlight = false;
}

// ── Integrated default flow: one consolidated answer grounded in all five lenses ──
const LENS_LABEL = { mobus: 'Mobus', klir: 'Klir', bunge: 'Bunge', spt: 'Troncale', ct: 'CT' };
const LENS_ROLE = { mobus: 'the anatomist', klir: 'the epistemologist', bunge: 'the ontologist', spt: 'the process theorist', ct: 'the compositionalist' };

async function sendIntegrated(question) {
  if (inFlight) return;
  inFlight = true; userScrolledUp = false;

  const originTabId = activeTab;
  const btn = document.getElementById('send-btn');
  const dot = document.getElementById('status-dot');
  btn.disabled = true; dot.className = 'status-dot loading';

  addMessage('user', question, null, originTabId);

  const tab = tabs.find(t => t.id === originTabId);
  const userMsgCount = tab ? tab.messages.filter(m => m.role === 'user').length : 1;
  logFunnelEvent(userMsgCount <= 1 ? 'query_submitted' : 'query_submitted_second');
  if (tab && userMsgCount === 1) {
    tab.name = question.length > 30 ? question.slice(0, 28) + '…' : question;
    saveTabs(); renderTabs();
  }
  pushConversationUrl();
  addMessage('thinking', '', null, originTabId);

  let progressEl = null, streamEl = null, elapsedTimer = null, elapsedStart = null;
  function ensureProgress() {
    if (progressEl) return;
    const thinkEl = document.querySelector('.msg-thinking'); if (thinkEl) thinkEl.remove();
    const ot = tabs.find(t => t.id === originTabId);
    if (ot) ot.messages = ot.messages.filter(m => m.role !== 'thinking');
    progressEl = document.createElement('div');
    progressEl.className = 'lens-progress';
    progressEl.innerHTML = '<span class="lp-label">Consulting the lenses</span>'
      + ['mobus', 'klir', 'bunge', 'spt', 'ct'].map(m => '<span class="lp-lens" data-lens="' + m + '">' + LENS_LABEL[m] + '</span>').join('')
      + '<span class="lp-stage"></span><span class="stage-elapsed">0s</span>';
    document.getElementById('chat-messages').appendChild(progressEl);
    elapsedStart = Date.now();
    elapsedTimer = setInterval(() => {
      const s = progressEl && progressEl.querySelector('.stage-elapsed');
      if (s) s.textContent = Math.floor((Date.now() - elapsedStart) / 1000) + 's';
    }, 1000);
    if (!userScrolledUp) progressEl.scrollIntoView({ behavior: 'smooth', block: 'end' });
  }
  function clearProgress() {
    if (elapsedTimer) { clearInterval(elapsedTimer); elapsedTimer = null; }
    if (progressEl) { progressEl.remove(); progressEl = null; }
  }

  try {
    const r = await fetch(API + '/ask-integrated', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        question, history: getRecentHistory(6),
        session_id: (tab || {}).sessionId || '',
        user_id: FACETS_USER_ID, user_name: getUserName()
      })
    });
    if (!r.ok || !r.body) throw new Error('integrated stream failed');

    const reader = r.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '', accText = '', currentEvent = null;

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop();
      for (const line of lines) {
        if (line.startsWith('event: ')) { currentEvent = line.slice(7).trim(); continue; }
        if (!line.startsWith('data: ') || !currentEvent) continue;
        const payload = JSON.parse(line.slice(6));

        if (currentEvent === 'status') {
          ensureProgress();
          if (payload.stage === 'lens_ready' && payload.lens) {
            const chip = progressEl.querySelector('.lp-lens[data-lens="' + payload.lens.mode + '"]');
            if (chip) chip.classList.add('ready');
          } else if (payload.stage === 'synthesizing') {
            progressEl.querySelectorAll('.lp-lens').forEach(c => c.classList.add('ready'));
            const st = progressEl.querySelector('.lp-stage'); if (st) st.textContent = 'synthesizing…';
          }
        } else if (currentEvent === 'token') {
          clearProgress();
          const ot = tabs.find(t => t.id === originTabId);
          if (ot && ot.messages.some(m => m.role === 'thinking')) {
            ot.messages = ot.messages.filter(m => m.role !== 'thinking');
            const te = document.querySelector('.msg-thinking'); if (te) te.remove();
          }
          accText += payload.text;
          if (!streamEl) {
            streamEl = document.createElement('div');
            streamEl.className = 'msg msg-bot msg-streaming';
            document.getElementById('chat-messages').appendChild(streamEl);
          }
          streamEl.innerHTML = marked.parse(renderGroundingMarkers(accText));
          if (!userScrolledUp) streamEl.scrollIntoView({ behavior: 'smooth', block: 'end' });
        } else if (currentEvent === 'done') {
          clearProgress();
          if (payload.timing) console.log('%c⏱ Facets Integrated', 'font-weight:bold;color:#3a6e62', payload.timing);
          if (streamEl) { streamEl.remove(); streamEl = null; }
          const answer = (payload.answer || accText).replace(/<think>[\s\S]*?<\/think>\s*/g, '').trim();
          addMessage('bot', answer, {
            route: payload.route || 'integrated',
            confidence: payload.confidence || '',
            dimensions: [],
            sources: payload.sources || [],
            lenses: payload.lenses || [],
            web_search: payload.web_search,
            answer_id: payload.answer_id,
            asked: 'integrated'
          }, originTabId);
          dot.className = 'status-dot online';
          logFunnelEvent('answer_rendered');
          setTimeout(maybePromptName, 1200);
        }
        currentEvent = null;
      }
    }
  } catch (e) {
    console.error('Integrated error:', e);
    clearProgress();
    const ot = tabs.find(t => t.id === originTabId);
    if (ot) ot.messages = ot.messages.filter(m => m.role !== 'thinking');
    if (streamEl) streamEl.remove();
    addMessage('system', 'Could not reach the reasoning engine. Please try again.', null, originTabId);
    dot.className = 'status-dot';
  }
  btn.disabled = false; inFlight = false;
}

// Drill-in: stream one lens's full grounded answer into an expanded card body (on demand).
async function drillLens(bodyEl, question, mode) {
  bodyEl.innerHTML = '<div class="lens-loading">Consulting ' + (LENS_LABEL[mode] || mode) + '…</div>';
  try {
    const r = await fetch(API + '/ask-stream', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question, history: [], user_id: FACETS_USER_ID, user_name: getUserName(), mode })
    });
    if (!r.ok || !r.body) throw new Error('drill stream failed');
    const reader = r.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '', acc = '', currentEvent = null, started = false;
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop();
      for (const line of lines) {
        if (line.startsWith('event: ')) { currentEvent = line.slice(7).trim(); continue; }
        if (!line.startsWith('data: ') || !currentEvent) continue;
        const payload = JSON.parse(line.slice(6));
        if (currentEvent === 'token') {
          if (!started) { started = true; acc = ''; }
          acc += payload.text;
          bodyEl.innerHTML = renderClean(acc);
          renderMath(bodyEl);
        } else if (currentEvent === 'done') {
          acc = (payload.answer || acc).replace(/<think>[\s\S]*?<\/think>\s*/g, '').trim();
          bodyEl.innerHTML = renderClean(acc);
          renderMath(bodyEl);
          // The drilled answer is persisted under its OWN share id — the parent integrated
          // answer's Share button carries a different id, so without this button a consultation
          // could only ever be shared as its parent.
          if (payload.answer_id) appendDrillShare(bodyEl, payload.answer_id);
        }
        currentEvent = null;
      }
    }
  } catch (e) {
    bodyEl.innerHTML = '<em class="lens-loading">This lens was unavailable. Try again.</em>';
  }
}

function appendDrillShare(bodyEl, answerId) {
  const actions = document.createElement('div');
  actions.className = 'msg-actions';
  const shareBtn = document.createElement('button');
  shareBtn.className = 'msg-copy-btn';
  shareBtn.textContent = 'Share';
  shareBtn.onclick = () => {
    const url = window.location.origin + '/chat/a/' + answerId;
    navigator.clipboard.writeText(url).then(() => {
      shareBtn.textContent = '✓ Link copied';
      setTimeout(() => { shareBtn.textContent = 'Share'; }, 2000);
    });
  };
  actions.appendChild(shareBtn);
  bodyEl.appendChild(actions);
}

// Append the "consult a lens" drill-in strip beneath an integrated answer.
function appendLensStrip(container, m, tab) {
  const lenses = (m.meta && m.meta.lenses) || [];
  if (!lenses.length) return;
  const idx = tab ? tab.messages.indexOf(m) : -1;
  let userQ = '';
  for (let j = idx - 1; j >= 0; j--) { if (tab.messages[j].role === 'user') { userQ = tab.messages[j].text; break; } }

  const strip = document.createElement('div');
  strip.className = 'lens-strip';
  const label = document.createElement('div');
  label.className = 'lens-strip-label';
  label.textContent = 'Consult a lens';
  strip.appendChild(label);
  const wrap = document.createElement('div');
  wrap.className = 'conv-lenses';
  lenses.forEach(l => {
    const card = document.createElement('div'); card.className = 'conv-lens';
    const head = document.createElement('button'); head.className = 'conv-lens-head';
    // Expand the raw dimension codes (C/N/E/G/B/T/H, S/Y, …) to their names — the letters mean nothing on their own.
    const nm = (MODE_CONFIGS[l.mode] && MODE_CONFIGS[l.mode].names) || {};
    const dimWords = (l.dimensions || []).map(d => nm[d] || d);
    const dimText = dimWords.slice(0, 3).join(', ') + (dimWords.length > 3 ? '…' : '');
    head.innerHTML = '<span class="conv-lens-name">' + (LENS_LABEL[l.mode] || l.mode) + '</span> '
      + '<span class="conv-lens-role">' + (LENS_ROLE[l.mode] || '') + '</span> '
      + (dimText ? '<span class="conv-lens-dims">' + dimText + '</span>' : '')
      + '<span class="conv-lens-caret">Consult&nbsp;▾</span>';
    const body = document.createElement('div'); body.className = 'conv-lens-body collapsed';
    if (l.snippet) { const sn = document.createElement('div'); sn.className = 'lens-snippet'; sn.textContent = l.snippet + '…'; body.appendChild(sn); }
    head.onclick = () => {
      const opening = body.classList.contains('collapsed');
      body.classList.toggle('collapsed'); head.classList.toggle('open');
      const caret = head.querySelector('.conv-lens-caret');
      if (caret) caret.innerHTML = opening ? 'Hide&nbsp;▴' : 'Consult&nbsp;▾';
      if (opening && !head.dataset.loaded) { head.dataset.loaded = '1'; drillLens(body, userQ, l.mode); }
    };
    card.appendChild(head); card.appendChild(body); wrap.appendChild(card);
  });
  strip.appendChild(wrap);
  container.appendChild(strip);
}

}

document.getElementById('copy-md-btn').addEventListener('click', () => {
  const tab = getTab();
  if (!tab) return;
  const md = '# ' + (tab.name || 'Facets Chat') + '\n\n' +
    tab.messages.filter(m => m.role !== 'system').map(m => {
      if (m.role === 'user') return '**Q:** ' + m.text;
      let out = m.text;
      if (m.meta) {
        const parts = [];
        if (m.meta.dimensions && m.meta.dimensions.length) parts.push('Dimensions: ' + m.meta.dimensions.map(d => dimDisplayName(d) + ' (' + d + ')').join(', '));
        if (m.meta.route) parts.push('Route: ' + m.meta.route);
        if (m.meta.intensity) parts.push('Intensity: ' + m.meta.intensity);
        if (m.meta.sources && m.meta.sources.length) {
          parts.push('Sources: ' + [...new Set(m.meta.sources.map(s => s.source))].join(', '));
        }
        if (parts.length) out += '\n\n*' + parts.join(' | ') + '*';
      }
      return out;
    }).join('\n\n---\n\n');
  navigator.clipboard.writeText(md).then(() => {
    const btn = document.getElementById('copy-md-btn');

document.getElementById('share-link-btn').addEventListener('click', () => {

  if (!tab) return;

  // Permalink to the latest stored answer in this conversation (/a/<id>), not a ?q= re-run.
  const lastShared = [...tab.messages].reverse().find(m => m.role === 'bot' && m.meta && m.meta.answer_id);
  if (!lastShared) {

// "Model this → canvas" — the push half of the Facets→canvas bridge. Send the conversation's first
// question to GSR /extract, download the resulting spec, which the canvas opens via its "Import spec"
// action (reusing model_from_spec — one distillation source of truth). We download the FULL /extract
// response: the canvas unwraps .spec, and repairs/warnings ride along as provenance (pass-through ethos,
// see GSR docs/spec-architecture.md §8). Extraction model is left to the server default (Haiku cloud /
// FACETS_MODEL local) — extraction is a structural compile, distinct from the RAG model choice.
// NOTE: /extract is local-only until the integrated engine is deployed (W27 focus ③); on an engine
// without it this 404s, handled below. Server logs every /extract (kind="extract") — usage is the
// instrumentation the kernel-from-usage method calls for; no client logging needed.
document.getElementById('model-this-btn').addEventListener('click', async () => {
  const menu = document.getElementById('export-menu');
  const btn = document.getElementById('model-this-btn');
  const LABEL = 'Model this → canvas';
  const tab = getTab();
  const firstQ = tab && tab.messages.find(m => m.role === 'user');
  if (!firstQ) { menu.classList.remove('open'); return; }
  btn.disabled = true;
  btn.textContent = 'Modeling…';
  const reset = (msg) => {
    btn.textContent = msg;
    setTimeout(() => { btn.textContent = LABEL; btn.disabled = false; menu.classList.remove('open'); }, 2800);
  };
  try {
    const r = await fetch(API + '/extract', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ description: firstQ.text, model: '' })
    });
    if (r.status === 404) { reset('Engine has no /extract yet'); return; }
    if (!r.ok) { reset('Extract failed (' + r.status + ')'); return; }
    const data = await r.json();
    if (data.error || !data.spec) { reset('No spec returned'); return; }
    const sysName = (data.spec.system && data.spec.system.name) || firstQ.text;
    const slug = sysName.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 48) || 'system';
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = slug + '-spec.json';
    a.click();
    URL.revokeObjectURL(url);
    reset('Downloaded ✓ — open in canvas via Import spec');
  } catch (e) {
    console.error('Model this failed:', e);
    reset('Could not reach engine');
  }
});
// Tooltip removed — 8-tuple explanation now displayed inline
// ── Context dock (workbench phase 1, 2026-08-31) ──
// Direction A of the pivot: a wide-screen side panel projecting the focused
// answer's meta — readouts, lens, sources — so context stops scrolling away.
// Follows the latest answer by default; ‹ › steps back through the record.
let dockCursor = null;   // index into the tab's bot answers; null = follow latest
let dockLens = null;     // integrated answers only: which lens's reading the dock projects
let dockLensFor = null;  // the answer index dockLens belongs to — focus moves reset it
// The standing conversations rail — same data and actions as the History
// drawer, permanently open where the triple ensemble fits.
function renderConvRail() {
  const rail = document.getElementById('conv-rail');
  if (!rail) return;
  rail.innerHTML = '';
  if (READONLY || !tabs.length) { rail.classList.remove('has-content'); return; }
  rail.classList.add('has-content');
  const label = document.createElement('div');
  label.className = 'conv-rail-label';
  label.textContent = 'Conversations';
  rail.appendChild(label);
  tabs.forEach(t => {
    const item = document.createElement('button');
    item.className = 'conv-rail-item' + (t.id === activeTab ? ' active' : '');
    const nm = document.createElement('div');
    nm.className = 'conv-rail-name';
    nm.textContent = t.name || 'Untitled';
    const sub = document.createElement('div');
    sub.className = 'conv-rail-sub';
    const nb = t.messages.filter(mm => mm.role === 'bot').length;
    sub.textContent = nb ? nb + ' sheet' + (nb === 1 ? '' : 's') : 'empty';
    item.appendChild(nm); item.appendChild(sub);
    item.onclick = () => switchTab(t.id);
    rail.appendChild(item);
  });
  const nb = document.createElement('button');
  nb.className = 'conv-rail-new';
  nb.textContent = '+ New conversation';
  nb.onclick = () => createTab();
  rail.appendChild(nb);
}

function focusSheet(bi) {
  const tab = getTab();
  const total = tab ? tab.messages.filter(mm => mm.role === 'bot').length : 0;
  dockCursor = (bi >= total - 1) ? null : bi;
  renderDock();
  syncSheetFocus();
}
function syncSheetFocus() {
  const tab = getTab();
  const bots = tab ? tab.messages.filter(mm => mm.role === 'bot') : [];
  if (!bots.length) return;
  const n = dockCursor === null ? bots.length - 1 : dockCursor;
  document.querySelectorAll('.sheet').forEach(sh => {
    sh.classList.toggle('sheet-focused', Number(sh.dataset.bot) === n);
  });
}
function revealFocusedSheet() {
  syncSheetFocus();
  const sh = document.querySelector('.sheet-focused');
  if (sh) {
    sh.classList.remove('collapsed');
    sh.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }
}
function dockEsc(v) { const d = document.createElement('div'); d.textContent = v == null ? '' : String(v); return d.innerHTML; }
function renderDock() {
  const dock = document.getElementById('context-dock');
  if (!dock) return;
  const tab = getTab();
  const bots = tab ? tab.messages.filter(mm => mm.role === 'bot') : [];
  if (!bots.length) { dock.classList.remove('has-content'); dock.innerHTML = ''; return; }
  dock.classList.add('has-content');
  if (dockCursor !== null && (dockCursor < 0 || dockCursor >= bots.length)) dockCursor = null;
  const n = dockCursor === null ? bots.length - 1 : dockCursor;
  const m = bots[n];
  const meta = m.meta || {};
  if (dockLensFor !== n) { dockLens = null; dockLensFor = n; }
  const idx = tab.messages.indexOf(m);
  let q = '';
  for (let j = idx - 1; j >= 0; j--) { if (tab.messages[j].role === 'user') { q = tab.messages[j].text; break; } }
  const g = (m.text.match(/\[\[g:/g) || []).length;
  const u = (m.text.match(/\[\[u\]\]/g) || []).length;
  const asked = meta.asked || ((meta.lenses && meta.lenses.length) ? 'integrated' : null);
  const thinker = (asked && asked !== 'integrated') ? THINKERS[asked] : null;
  const cfg = thinker && MODE_CONFIGS[asked] ? MODE_CONFIGS[asked] : null;
  const dims = meta.dimensions || [];
  const rows = [];
  if (meta.route) rows.push(['route', dockEsc(meta.route)]);
  if (meta.confidence) rows.push(['confidence', dockEsc(meta.confidence)]);
  if (meta.intensity && meta.intensity !== 'none') rows.push(['intensity', dockEsc(meta.intensity)]);
  if (g || u) rows.push(['grounding', u
    ? '<span style="color: var(--verdict-warning)">' + g + ' \u2713 \u00b7 ' + u + ' open</span>'
    : '<span style="color: var(--verdict-ok)">grounded \u2713</span>']);
  if (meta.web_search) rows.push(['web', 'searched']);

  let html = '<div class="dock-head">'
    + '<button class="dock-step" id="dock-prev"' + (n === 0 ? ' disabled' : '') + ' aria-label="Earlier answer">\u2039</button>'
    + '<span class="dock-count">answer ' + (n + 1) + ' of ' + bots.length + '</span>'
    + '<button class="dock-step" id="dock-next"' + (n === bots.length - 1 ? ' disabled' : '') + ' aria-label="Later answer">\u203a</button>'
    + '</div>';
  if (q) html += '<div class="dock-q">' + dockEsc(q.length > 90 ? q.slice(0, 90) + '\u2026' : q) + '</div>';
  if (rows.length) html += '<div class="dock-section"><div class="dock-label">Readouts</div><div class="dock-rows">'
    + rows.map(r => '<span>' + r[0] + '</span><span class="dock-val">' + r[1] + '</span>').join('') + '</div></div>';
  if (thinker) {
    html += '<div class="dock-section"><div class="dock-label">Lens \u00b7 ' + dockEsc(thinker.name) + '</div>'
      + '<div class="dock-asks">' + dockEsc(thinker.asks.replace('This lens asks: ', '')) + '</div>';
    if (dims.length) html += '<div class="dock-chips">' + dims.map(d =>
      '<span class="dock-chip" style="color: var(--dim-' + dockEsc(d) + ', var(--ink-dim))">' + dockEsc((cfg && cfg.names[d]) || d) + '</span>').join('') + '</div>';
    html += '</div>';
  } else if (meta.lenses && meta.lenses.length) {
    // Lens tabs (DockLenses sketch): the integrated payload already carries
    // every lens's reading, so tabs re-project the SAME answer — no backend.
    const cur = meta.lenses.find(l => l.mode === dockLens) || null;
    html += '<div class="dock-section"><div class="dock-label">Lens</div><div class="dock-tabs">'
      + '<button class="dock-tab' + (cur ? '' : ' active') + '" data-lens="">All</button>'
      + meta.lenses.map(l => {
          const t = THINKERS[l.mode];
          const short = (t && (t.short || t.name.split(' ').pop())) || l.mode;
          return '<button class="dock-tab' + (cur && cur.mode === l.mode ? ' active' : '') + '" data-lens="' + dockEsc(l.mode) + '">' + dockEsc(short) + '</button>';
        }).join('') + '</div>';
    if (cur) {
      const t = THINKERS[cur.mode];
      if (t) html += '<div class="dock-asks">' + dockEsc(t.asks.replace('This lens asks: ', '')) + '</div>';
      const lcfg = MODE_CONFIGS[cur.mode];
      if (cur.dimensions && cur.dimensions.length) html += '<div class="dock-chips">' + cur.dimensions.map(d =>
        '<span class="dock-chip" style="color: var(--dim-' + dockEsc(d) + ', var(--ink-dim))">' + dockEsc((lcfg && lcfg.names[d]) || d) + '</span>').join('') + '</div>';
      if (cur.snippet) html += '<div class="dock-snippet">' + dockEsc(cur.snippet) + '\u2026</div>';
    } else {
      html += '<div class="dock-chips">' + meta.lenses.map(l =>
        '<span class="dock-chip">' + dockEsc((THINKERS[l.mode] && THINKERS[l.mode].name) || l.mode) + '</span>').join('') + '</div>';
    }
    html += '</div>';
  } else if (dims.length) {
    html += '<div class="dock-section"><div class="dock-label">Dimensions</div><div class="dock-chips">' + dims.map(d =>
      '<span class="dock-chip" style="color: var(--dim-' + dockEsc(d) + ', var(--ink-dim))">' + dockEsc(dimDisplayName(d)) + '</span>').join('') + '</div></div>';
  }
  const srcs = [...new Set((meta.sources || []).map(sr => sr.source).filter(Boolean))];
  if (srcs.length) html += '<div class="dock-section"><div class="dock-label">Sources</div><div class="dock-sources">'
    + srcs.slice(0, 6).map(sr => '<span>' + dockEsc(sr) + '</span>').join('') + '</div></div>';
  html += '<div class="dock-note">' + (dockCursor === null ? 'following the latest answer' : 'pinned \u2014 \u203a returns to latest') + '</div>';
  dock.innerHTML = html;
  dock.querySelectorAll('.dock-tab').forEach(btn => {
    btn.onclick = () => { dockLens = btn.dataset.lens || null; renderDock(); };
  });
  const prev = document.getElementById('dock-prev'), next = document.getElementById('dock-next');
  if (prev) prev.onclick = () => { dockCursor = n - 1; renderDock(); revealFocusedSheet(); };
  if (next) next.onclick = () => { dockCursor = (n + 1 >= bots.length - 1) ? null : n + 1; renderDock(); revealFocusedSheet(); };
}

// ── Lens bar wiring ──
(function buildLensBar() {
  const bar = document.getElementById('lens-bar');
  // "All lenses" = the integrated default (leftmost, active on load).
  const allBtn = document.createElement('button');
  allBtn.className = 'lens-btn lens-btn-all active';
  allBtn.dataset.mode = '__all__';
  allBtn.setAttribute('aria-pressed', 'true');
  allBtn.innerHTML = '<span class="lens-name">All lenses</span><span class="lens-tag">one consolidated answer</span>';
  allBtn.addEventListener('click', () => selectComposerLens(null));
  bar.appendChild(allBtn);
  Object.keys(MODE_CONFIGS).forEach(mode => {
    const t = THINKERS[mode];
    const btn = document.createElement('button');
    btn.className = 'lens-btn';
    btn.dataset.mode = mode;
    btn.setAttribute('aria-pressed', 'false');
    btn.innerHTML = '<span class="lens-name">' + (t.short || t.name.split(' ').pop()) + '</span><span class="lens-tag">' + t.tag + '</span>';
    btn.addEventListener('click', () => {
      if (composerLens === mode) {
        // Tapping the already-selected lens re-opens its bio card
        const card = document.getElementById('thinker-card');
        card.hidden = !card.hidden;
        return;
      }
      selectComposerLens(mode);
      localStorage.setItem('facets-mode', mode);
    });
    bar.appendChild(btn);
  });
})();

document.getElementById('lens-toggle').addEventListener('click', () => {

  sessionStorage.setItem('facets-thinker-dismissed', '1');

// Default front door is integrated (all five). Init dim-bar globals without revealing the

const savedMode = localStorage.getItem('facets-mode');
const startMode = (savedMode && MODE_CONFIGS[savedMode]) ? savedMode : 'mobus';
switchMode(startMode, false);
selectComposerLens(null);

init();

// Minimal PWA app-shell service worker — makes "pin to home screen" a real standalone
// app and repeat /a/<id> opens instant. Additive; failure is silently ignored.
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
