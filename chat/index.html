// ── Server-authoritative history (facets#371, gsr#48) ──
// The server holds the record; what is in localStorage is a read-through cache
// painted first so the page is never blank. Reconciliation: server wins for
// committed messages, titles and deletions, a tombstone always beats a local
// copy, and the client keeps only what has not been committed yet.
const CONV_PAGE = 50;

async function hydrateConversations() {
  if (READONLY) return;
  let r;
  try { r = await authFetch('/v1/conversations?limit=' + CONV_PAGE); } catch (e) { return; }
  if (!r.ok) {
    // Stopped at the seam on a rollover: every synced tab belongs to the earlier
    // identity, so mark them now rather than after a list that will not come.
    if (ROLLED_FROM) { tabs.forEach(t => { if (t.serverId) t.orphaned = true; }); saveTabs(); renderConvRail(); }
    return;
  }
  let list;
  try { list = (await r.json()).conversations || []; } catch (e) { return; }
  const byId = new Map(list.map(c => [c.id, c]));

  // Absence from the list is a deletion only under the identity that synced the
  // tab. Under any other identity (a rollover, or a cache older than subjects)
  // the tab is an orphan: kept, marked, never swept (facets#440).
  const sameIdentity = t => !!(t.subject && CURRENT_SUBJECT && t.subject === CURRENT_SUBJECT);
  tabs = tabs.filter(t => !t.serverId || byId.has(t.serverId) || !sameIdentity(t));
  tabs.forEach(t => {
    const c = t.serverId && byId.get(t.serverId);
    if (c) { t.name = c.title || t.name; t.updatedAt = c.updated_at; t.subject = CURRENT_SUBJECT || t.subject; t.orphaned = false; }
    else if (t.serverId) t.orphaned = true;
  });
  const known = new Set(tabs.map(t => t.serverId).filter(Boolean));
  list.forEach(c => {
    if (known.has(c.id)) return;
    tabs.push({
      id: c.id, serverId: c.id, name: c.title || 'Untitled', subject: CURRENT_SUBJECT, orphaned: false,
      sessionId: crypto.randomUUID(), messages: [], hydrated: false, updatedAt: c.updated_at,
    });
  });

  if (!tabs.length) createTab(true);
  if (!tabs.find(t => t.id === activeTab)) activeTab = tabs[0].id;
  saveTabs();
  renderConvRail();
  renderMessages();
  const cur = getTab();
  if (cur && cur.serverId && !cur.hydrated) hydrateConversation(cur);
}

async function hydrateConversation(tab) {
  if (!tab || !tab.serverId || tab.orphaned) return;
  let r;
  try { r = await authFetch('/v1/conversations/' + encodeURIComponent(tab.serverId)); } catch (e) { return; }
  if (r.status === 404) { dropTabLocally(tab.id); return; }
  if (!r.ok) return;
  let c;
  try { c = await r.json(); } catch (e) { return; }
  const server = (c.messages || []).slice().sort((a, b) => (a.seq || 0) - (b.seq || 0))
    .map(m => ({ id: m.id, seq: m.seq, role: m.role === 'assistant' ? 'bot' : m.role, text: m.content || '', meta: m.model_meta || null }));
  const pending = tab.messages.filter(m => m.pending && !server.some(s => s.id === m.id));
  tab.messages = server.concat(pending);
  tab.name = c.title || tab.name;
  tab.hydrated = true;
  saveTabs();
  if (tab.id === activeTab) renderMessages();
  renderConvRail();
}

function dropTabLocally(id) {
  tabs = tabs.filter(t => t.id !== id);
  if (!tabs.length) createTab(true);
  if (!tabs.find(t => t.id === activeTab)) activeTab = tabs[0].id;
  saveTabs();
  renderConvRail();
  renderMessages();
}

// The send that just landed tells us which conversation it belongs to. If the
// server did not echo the id we sent, our picture of the thread is wrong and the
// answer is to refetch it, not to guess a merge.
function reconcileAfterSend(tab, payload, clientMsgId, botMsg) {
  if (!tab || !payload) return;
  if (payload.conversation_id) {
    tab.serverId = payload.conversation_id;
    tab.subject = CURRENT_SUBJECT;
    tab.orphaned = false;
    // The URL was pushed before the server named the conversation; correct it in place.
    if (tab.id === activeTab && window.location.pathname === '/chat/c/' + tab.id) {
      try { history.replaceState({ tabId: tab.id }, '', '/chat/c/' + tab.serverId); } catch (e) {}
    }
  }
  if (payload.bot_message_id && botMsg) botMsg.id = payload.bot_message_id;
  const user = tab.messages.find(m => m.id === clientMsgId);
  if (user) delete user.pending;
  tab.hydrated = true;
  saveTabs();
  if (payload.message_id && clientMsgId && payload.message_id !== clientMsgId) hydrateConversation(tab);

// An orphaned thread cannot be appended to under this identity; a send continues

// ── Multi-tab send lock (gsr#48) ──

// ── Offline queue ──

// ── LocalStorage (persists activeTab) ──
function saveTabs() {

  try { localStorage.setItem(LS_KEY, JSON.stringify({ tabs, activeTab })); } catch(e) {}

function pushConversationUrl() {
  const tab = getTab();
  if (tab && tab.messages.some(m => m.role === 'user')) {
    const path = '/chat/c/' + (tab.serverId || tab.id);
    if (window.location.pathname !== path) {
      history.pushState({ tabId: tab.id }, '', path);
    }
  }
}

function restoreFromUrl() {
  const match = window.location.pathname.match(/^\/chat\/c\/(.+)$/);
  if (match) {
    const tabId = match[1];
    const tab = tabs.find(t => t.serverId === tabId) || tabs.find(t => t.id === tabId);
    if (tab) {
      activeTab = tab.id;
      return true;
    }
    if (/^[0-9a-f-]{36}$/i.test(tabId)) {
      // A conversation this browser has not cached yet — hydration will fill it in.
      tabs.push({ id: tabId, serverId: tabId, name: 'Conversation', sessionId: crypto.randomUUID(), messages: [], hydrated: false });
      activeTab = tabId;
      return true;
    }
  }

window.addEventListener('popstate', (e) => {
  if (e.state && e.state.tabId) {
    const tab = tabs.find(t => t.id === e.state.tabId);
    if (tab) { switchTab(e.state.tabId); return; }
  }
  const restored = restoreFromUrl();
  if (!restored && (window.location.pathname === '/chat/' || window.location.pathname === '/chat')) {
    renderConvRail();
    renderMessages();
  }
});
function loadTabs() {
  try {
    const raw = JSON.parse(localStorage.getItem(LS_KEY));
    if (Array.isArray(raw) && raw.length) {
      tabs = raw; activeTab = tabs[0].id;
    } else if (raw && raw.tabs && raw.tabs.length) {
      tabs = raw.tabs;
      activeTab = raw.activeTab || tabs[0].id;
      if (!tabs.find(t => t.id === activeTab)) activeTab = tabs[0].id;
    }
    tabs.forEach(t => {
      t.messages = t.messages.filter(m => m.role !== 'thinking');
      if (!t.sessionId) t.sessionId = crypto.randomUUID();
      // Caches written before message identity existed get ids now, so the
      // reconciler has something to compare against.
      t.messages.forEach(m => { if (!m.id) m.id = crypto.randomUUID(); });

// ── Tab management ──
function createTab(silent) {
  const id = Date.now().toString(36) + Math.random().toString(36).slice(2,6);
  const sessionId = crypto.randomUUID();
  const name = 'Chat ' + (tabs.length + 1);
  tabs.push({ id, name, sessionId, messages: [], serverId: null, hydrated: true });
  activeTab = id;

  if (tab && (tab.serverId || tab.messages.some(m => m.role === 'user'))) {
    history.pushState({ tabId: id }, '', '/chat/c/' + (tab.serverId || id));
  } else {
    history.pushState(null, '', '/');

// ── Messages ──
function renderMessages() {
  const el = document.getElementById('chat-messages');
  const tab = getTab();

  el.innerHTML = '';
  el.classList.remove('sheeted');

      openSheet = document.createElement('article');

    }
    if (m.role === 'bot' && openSheet) {
      sheetBot++;
      const bi = sheetBot;

      sheet.dataset.bot = bi;
      sheet.querySelector('.sheet-num').textContent = String(bi + 1).padStart(2, '0');

      sheet.querySelector('.sheet-head').onclick = () => {

      return;
    }
    if (m.role === 'bot') sheetBot++; // unpaired answer stays a bubble; the count stays aligned
    openSheet = null;
    el.appendChild(div);
  });
  if (!userScrolledUp) el.scrollTop = el.scrollHeight;
  renderDock();
  syncSheetFocus();
  renderConvRail();
}

function parseTLDR(text) {
  const tldrMatch = text.match(/^##\s*TL;DR\s*\n([\s\S]*?)(?=\n##\s)/m);
  const fullMatch = text.match(/^##\s*Full Analysis\s*\n([\s\S]*)$/m);
  if (!tldrMatch) return { hasTLDR: false, tldr: '', full: text };
  return { hasTLDR: true, tldr: tldrMatch[1].trim(), full: fullMatch ? fullMatch[1].trim() : text };
}

function renderGroundingMarkers(md) {
  // gsr#37 grounding signal: the integration prompt emits [[g: source]] / [[u]] markers
  // inline after corpus-grounded / parametric claims. Render them as visible badges —
  // "ungrounded" is a first-class state, not hidden.
  // A [[u]] marks the claim before it: the sentence back to the previous full stop,
  // including its own, so the reader sees which words rest on general knowledge.
  return markOpenClaims(md)
    .replace(/\[\[g:\s*([^\]]*)\]\]/g, (_, src) =>
      `<span class="grounding-badge grounding-badge-grounded" title="${src.trim().replace(/"/g, '&quot;')}">${ICON_CHECK} ${src.trim()}</span>`);
}

const OPEN_CLAIM_TITLE = 'Stated from general knowledge; the retrieved passages do not cover it.';
// A full stop ends a sentence only when whitespace follows it and digits do not sit on
// both sides, so "pH 5.5" and "e.g. this" stay inside one claim.
function markOpenClaims(md) {
  const out = [];
  const re = /[ \t]*\[\[u\]\]/g;
  let last = 0, m;
  while ((m = re.exec(md))) {
    const chunk = md.slice(last, m.index);
    let b = chunk.lastIndexOf('\n') + 1;
    for (let i = chunk.length - 2; i >= b; i--) {
      if ('.!?'.includes(chunk[i]) && /\s/.test(chunk[i + 1])
          && !(/\d/.test(chunk[i - 1] || '') && /\d/.test(chunk[i + 2] || ''))
          && !/\b(e\.g|i\.e|cf|vs|etc|Fig|Def|No)\.$/.test(chunk.slice(b, i + 1))) { b = i + 1; break; }
    }
    b += (chunk.slice(b).match(/^\s*/) || [''])[0].length;
    const claim = chunk.slice(b);
    out.push(chunk.slice(0, b), '<mark class="claim-open" title="' + OPEN_CLAIM_TITLE + '">' + (claim || '\u25cc') + '</mark>');
    last = re.lastIndex;
  }
  out.push(md.slice(last));
  return out.join('');
}

function cleanMarkdown(md) {
  return renderGroundingMarkers(md)
    .replace(/^\s*\.\s*$/gm, '')        // orphan period on its own line
    .replace(/ +\./g, '.')              // space before period
    .replace(/\n{3,}/g, '\n\n');        // collapse excess blank lines
}

// Math has to be lifted out BEFORE marked runs: marked reads the underscores in
// x_t as emphasis and strips the backslashes in \{ and \|, so KaTeX never saw the
// source it was given. Each span becomes an opaque token (no punctuation, so marked
// passes it through), and the rendered HTML is spliced back afterwards. Code spans
// and fences are skipped so a literal $ in code stays a literal $. \( \) and \[ \]
// need the same lift for a second reason: marked reads \( as an escaped paren.
function liftMath(md) {
  const slots = [];
  const src = md.replace(/(```[\s\S]*?```|`[^`\n]*`)|\$\$([\s\S]+?)\$\$|\\\[([\s\S]+?)\\\]|\\\(([^\n]+?)\\\)|\$([^\$\n]+?)\$/g, (m, code, dollars, brackets, parens, inline) => {
    if (code) return m;
    const display = dollars !== undefined ? dollars : brackets;
    const tex = (display !== undefined ? display : parens !== undefined ? parens : inline).trim();
    if (inline !== undefined && /^\d/.test(tex)) return m;   // "$5 and $10" is money, not math
    if (typeof katex === 'undefined') return m;
    let html;
    try { html = katex.renderToString(tex, { displayMode: display !== undefined, throwOnError: false }); }
    catch (e) { return m; }
    slots.push(html);
    return 'MATHSLOT' + (slots.length - 1) + 'END';
  });
  return { src, slots };
}
function restoreMath(html, slots) {
  return slots.length ? html.replace(/MATHSLOT(\d+)END/g, (_, i) => slots[+i]) : html;
}
// Kept as a no-op so older call sites stay harmless; renderClean does the work now.
function renderMath(el) {}

function renderClean(md) {
  const { src, slots } = liftMath(cleanMarkdown(md));
  return restoreMath(marked.parse(src), slots);
}

async function askAll(question, btn) {
  if (window.__askAllInFlight) return;
  window.__askAllInFlight = true;
  const originTabId = getTab() ? getTab().id : null;
  if (btn) { btn.disabled = true; btn.textContent = 'Comparing 5 lenses…'; }
  addMessage('thinking', 'Comparing across all five lenses…', null, originTabId);
  try {
    const r = await authFetch('/ask-all', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question, session_id: (tabs.find(t => t.id === originTabId) || {}).sessionId || '' })
    });
    const data = await r.json();
    const tab = tabs.find(t => t.id === originTabId);
    if (tab) tab.messages = tab.messages.filter(mm => mm.role !== 'thinking');
    addMessage('convergence', '', { question, lenses: data.lenses || [], convergence: data.convergence || {} }, originTabId);
  } catch (e) {
    const tab = tabs.find(t => t.id === originTabId);
    if (tab) tab.messages = tab.messages.filter(mm => mm.role !== 'thinking');
    addMessage('system', 'Could not compare lenses — try again.', null, originTabId);
  } finally {
    window.__askAllInFlight = false;
    if (btn) { btn.disabled = false; btn.textContent = '◇ Compare all lenses'; }
  }
}

function addMessage(role, text, meta, tabId, id) {
  const tab = tabId ? tabs.find(t => t.id === tabId) : getTab();
  if (!tab) return null;
  const m = { id: id || crypto.randomUUID(), role, text, meta: meta || null };
  tab.messages.push(m);
  saveTabs();
  if (!tabId || tabId === activeTab) renderMessages();
  return m;
}

function exportChatJSON() {
  const tab = getTab();
  if (!tab) return;
  const data = JSON.stringify(tab.messages, null, 2);
  const blob = new Blob([data], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = (tab.name || 'chat') + '.json';
  a.click();
  URL.revokeObjectURL(url);
}
function exportChatMarkdown() {
  const tab = getTab();
  if (!tab) return;
  const md = '# ' + (tab.name || 'Facets Chat') + '\n\n' +
    tab.messages.filter(m => m.role !== 'system').map(m => {
      if (m.role === 'user') return '**Q:** ' + m.text;
      let out = m.text;
      if (m.meta) {
        const parts = [];
        if (m.meta.dimensions && m.meta.dimensions.length) parts.push('Dimensions: ' + m.meta.dimensions.map(d => dimDisplayName(d) + ' (' + d + ')').join(', '));
        if (m.meta.route) parts.push('Route: ' + m.meta.route);
        if (m.meta.intensity) parts.push('Intensity: ' + m.meta.intensity);
        if (m.meta.sources && m.meta.sources.length) {
          parts.push('Sources: ' + [...new Set(m.meta.sources.map(s => s.source))].join(', '));
        }
        if (parts.length) out += '\n\n*' + parts.join(' | ') + '*';
      }
      return out;
    }).join('\n\n---\n\n');
  const blob = new Blob([md], { type: 'text/markdown' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = (tab.name || 'chat') + '.md';
  a.click();
  URL.revokeObjectURL(url);
}

async function checkStatus() {
  const dot = document.getElementById('status-dot');
  try {
    const r = await authFetch('/status');
    if (r.ok) {
      const data = await r.json();
      dot.className = 'status-dot online';
      dot.setAttribute('aria-label', 'Connected');
      dot.title = 'Connected';
      // Update LLM display — skip if still loading
      const model = data.model || 'unknown';
      if (model === 'loading' || !data.ready) {
        const loadingName = document.getElementById('llm-model-name');
        if (loadingName) loadingName.textContent = 'Loading...';
      } else {
      const modelNameEl = document.getElementById('llm-model-name');
      if (modelNameEl) modelNameEl.textContent = 'Synthesis';
      const mode = data.mode || (model.includes('claude') ? 'cloud' : 'local');
      const tag = document.getElementById('llm-model-tag');
      const diagTag = document.getElementById('llm-diagram-tag');
      // The engine picks the model; the header names it as provenance.
      const pretty = mode === 'local' ? model + ' \u00b7 Local'
        : model.includes('sonnet') ? 'Claude Sonnet' : 'Claude Haiku';
      tag.textContent = pretty;
      if (diagTag) diagTag.textContent = pretty;
      const wsb = document.getElementById('web-search-badge');
      if (wsb) wsb.style.display = data.web_search ? 'inline' : 'none';
      } // end model display
    } else {
      dot.className = 'status-dot';
      dot.setAttribute('aria-label', 'Disconnected');
      dot.title = 'Disconnected';
    }
  } catch(e) {
    dot.className = 'status-dot';
    dot.setAttribute('aria-label', 'Disconnected');
    dot.title = 'Disconnected';
  }
}

function getRecentHistory(maxTurns) {
  const tab = tabs.find(t => t.id === activeTab);
  if (!tab) return [];
  return tab.messages
    .filter(m => m.role === 'user' || m.role === 'bot')
    .slice(-(maxTurns * 2))
    .map(m => ({ role: m.role, text: m.text.slice(0, 1000) }));
}

async function sendQuery(question, msgId) {
  if (inFlight || sendLocked() || SESSION_EXPIRED) return;
  inFlight = true;
  takeSendLock();

  const originTabId = activeTab;  // Lock response to this tab
  const btn = document.getElementById('send-btn');
  const dot = document.getElementById('status-dot');
  btn.disabled = true;
  dot.className = 'status-dot loading';

  const clientMsgId = msgId || crypto.randomUUID();
  addMessage('user', question, null, originTabId, clientMsgId);

  // Auto-name tab from first query
  const tab = tabs.find(t => t.id === originTabId);
  forkIfOrphaned(tab);
  const userMsgCount = tab ? tab.messages.filter(m => m.role === 'user').length : 1;
  logFunnelEvent(userMsgCount <= 1 ? 'query_submitted' : 'query_submitted_second');
  if (tab && userMsgCount === 1) {
    tab.name = question.length > 30 ? question.slice(0, 28) + '…' : question;
    saveTabs();
    renderConvRail();
  }

  pushConversationUrl();

  // Thinking indicator as a tab-aware message (survives re-renders)
  addMessage('thinking', '', null, originTabId);

  updateDiagram('query', question);
  animateFlow('query');

  try {
    const r = await authFetch('/ask', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        question,
        history: getRecentHistory(6),
        session_id: (tabs.find(t => t.id === originTabId) || {}).sessionId || '',
        conversation_id: (tabs.find(t => t.id === originTabId) || {}).serverId || null,
        message_id: clientMsgId,
        mode: activeMode
      })
    });
    const data = await r.json();

    const dims = data.dimensions || [];
    const intensity = data.intensity || 'none';
    const reasoning = data.reasoning || '';
    const route = data.route || 'unknown';
    const confidence = data.confidence || '';
    const answer = data.answer || 'No response.';

    // Remove thinking indicator from the originating tab
    const originTab = tabs.find(t => t.id === originTabId);
    if (originTab) {
      originTab.messages = originTab.messages.filter(m => m.role !== 'thinking');
    }

    const botMsg = addMessage('bot', answer, { route, confidence, dimensions: dims, intensity, reasoning, sources: data.sources || [], web_search: data.web_search, answer_id: data.answer_id, asked: composerLens || activeMode }, originTabId);
    reconcileAfterSend(originTab, data, clientMsgId, botMsg);
    updateDimBar(dims);
    dot.className = 'status-dot online';
  } catch(e) {
    const originTab = tabs.find(t => t.id === originTabId);
    if (originTab) {
      originTab.messages = originTab.messages.filter(m => m.role !== 'thinking');
    }
    if (isOffline(e)) {
      markPending(originTabId, clientMsgId);
      addMessage('system', QUEUED_LINE, null, originTabId);
    } else {
      addMessage('system', 'Error: Could not reach the API.', null, originTabId);
    }
    clearDiagramHighlights();
    dot.className = 'status-dot';
  }
  releaseSendLock();
  btn.disabled = false;
  inFlight = false;
}

async function sendQueryStream(question, msgId) {
  if (inFlight || sendLocked() || SESSION_EXPIRED) return;
  inFlight = true;
  takeSendLock();
  userScrolledUp = false;

  const originTabId = activeTab;
  const btn = document.getElementById('send-btn');
  const dot = document.getElementById('status-dot');
  btn.disabled = true;
  dot.className = 'status-dot loading';

  const clientMsgId = msgId || crypto.randomUUID();
  addMessage('user', question, null, originTabId, clientMsgId);

  // Auto-name tab from first query
  const tab = tabs.find(t => t.id === originTabId);
  forkIfOrphaned(tab);
  const userMsgCount = tab ? tab.messages.filter(m => m.role === 'user').length : 1;
  logFunnelEvent(userMsgCount <= 1 ? 'query_submitted' : 'query_submitted_second');
  if (tab && userMsgCount === 1) {
    tab.name = question.length > 30 ? question.slice(0, 28) + '…' : question;
    saveTabs();
    renderConvRail();
  }

  pushConversationUrl();

  // Thinking indicator
  addMessage('thinking', '', null, originTabId);

  updateDiagram('query', question);
  animateFlow('query');

  try {
    const r = await authFetch('/ask-stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        question,
        history: getRecentHistory(6),
        session_id: (tabs.find(t => t.id === originTabId) || {}).sessionId || '',
        conversation_id: (tabs.find(t => t.id === originTabId) || {}).serverId || null,
        message_id: clientMsgId,
        mode: activeMode
      })
    });

    if (!r.ok || !r.body) throw new Error('Stream failed');

    const reader = r.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    let accText = '';
    let currentEvent = null;
    let streamEl = null;  // DOM element for streaming text
    let elapsedTimer = null;
    let elapsedStart = null;

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop();

      for (const line of lines) {
        if (line.startsWith('event: ')) {
          currentEvent = line.slice(7).trim();
        } else if (line.startsWith('data: ') && currentEvent) {
          const payload = JSON.parse(line.slice(6));

          if (currentEvent === 'status') {
            if (!streamEl) {
              let stageOrder = ['classifying', 'retrieving', 'synthesizing'];
              let stageLabels = {
                classifying: 'Classifying',
                retrieving: 'Retrieving',
                synthesizing: 'Synthesizing'
              };

              // Insert web search stage when intensity is full
              if (payload.stage === 'synthesizing' && payload.web_search) {
                stageOrder = ['classifying', 'retrieving', 'searching', 'synthesizing'];
                stageLabels.searching = 'Searching web';
              }

              const currentStageIdx = stageOrder.indexOf(
                payload.stage === 'synthesizing' && payload.web_search ? 'searching' : payload.stage
              );

              // Create stage progress element on first status event
              let progressEl = document.querySelector('.stage-progress');
              if (!progressEl) {
                const thinkEl = document.querySelector('.msg-thinking');
                if (thinkEl) thinkEl.remove();
                const originTab = tabs.find(t => t.id === originTabId);
                if (originTab) originTab.messages = originTab.messages.filter(m => m.role !== 'thinking');

                progressEl = document.createElement('div');
                progressEl.className = 'stage-progress';
              }

              // Rebuild stages (handles dynamic insertion of web search stage)
              progressEl.innerHTML = '';
              for (let i = 0; i < stageOrder.length; i++) {
                if (i > 0) {
                  const sep = document.createElement('span');
                  sep.className = 'stage-sep';
                  sep.innerHTML = ICON_FORWARD;
                  progressEl.appendChild(sep);
                }
                const item = document.createElement('span');
                item.className = 'stage-item';
                item.dataset.stage = stageOrder[i];
                item.innerHTML = `<span class="stage-check">${ICON_CHECK}</span> ${stageLabels[stageOrder[i]]}<span class="stage-time"></span>`;
                progressEl.appendChild(item);
              }
              if (!progressEl.parentNode) {
                const elapsedSpan = document.createElement('span');
                elapsedSpan.className = 'stage-elapsed';
                elapsedSpan.textContent = '0s';
                progressEl.appendChild(elapsedSpan);
                document.getElementById('chat-messages').appendChild(progressEl);
                elapsedStart = Date.now();
                elapsedTimer = setInterval(() => {
                  elapsedSpan.textContent = Math.floor((Date.now() - elapsedStart) / 1000) + 's';
                }, 1000);
              }
              if (!userScrolledUp) progressEl.scrollIntoView({ behavior: 'smooth', block: 'end' });

              // Update stage states
              progressEl.querySelectorAll('.stage-item').forEach(item => {
                const idx = stageOrder.indexOf(item.dataset.stage);
                if (idx < currentStageIdx) {
                  item.className = 'stage-item done';
                  if (item.dataset.stage === 'classifying' && payload.classify_ms) {
                    item.querySelector('.stage-time').textContent = ` ${payload.classify_ms}ms`;
                  }
                  if (item.dataset.stage === 'retrieving' && payload.retrieve_ms) {
                    item.querySelector('.stage-time').textContent = ` ${payload.retrieve_ms}ms`;
                  }
                } else if (idx === currentStageIdx) {
                  item.className = 'stage-item active';
                } else {
                  item.className = 'stage-item';
                }
              });
            }

            if (payload.stage === 'retrieving' && payload.dimensions) {
              updateDiagram('tuple', {
                dims: payload.dimensions,
                intensity: payload.intensity || 'none',
                reasoning: payload.reasoning || ''
              });
              updateDiagram('retrieval', payload.dimensions);
            }
            if (payload.stage === 'synthesizing') {
              animateFlow('llm');
            }

          } else if (currentEvent === 'token') {
            // Remove progress indicator on first token
            if (elapsedTimer) { clearInterval(elapsedTimer); elapsedTimer = null; }
            const progressEl = document.querySelector('.stage-progress');
            if (progressEl) progressEl.remove();
            const originTab = tabs.find(t => t.id === originTabId);
            if (originTab && originTab.messages.some(m => m.role === 'thinking')) {
              originTab.messages = originTab.messages.filter(m => m.role !== 'thinking');
              const thinkEl = document.querySelector('.msg-thinking');
              if (thinkEl) thinkEl.remove();
            }

            accText += payload.text;

            // Create or update streaming message element
            if (!streamEl) {
              streamEl = document.createElement('div');
              streamEl.className = 'msg msg-bot msg-streaming';
              streamEl.innerHTML = renderClean(accText);
              document.getElementById('chat-messages').appendChild(streamEl);
              if (!userScrolledUp) streamEl.scrollIntoView({ behavior: 'smooth', block: 'end' });
            } else {
              streamEl.innerHTML = renderClean(accText);
              if (!userScrolledUp) streamEl.scrollIntoView({ behavior: 'smooth', block: 'end' });
            }

          } else if (currentEvent === 'done') {
            if (payload.timing) {
              console.log('%c⏱ Facets Timing', 'font-weight:bold;color:#3a6e62', payload.timing);
            }
            // Remove streaming element, add final message to tab state
            if (streamEl) streamEl.remove();

            const dims = payload.dimensions || [];
            const route = payload.route || 'unknown';
            const confidence = payload.confidence || '';
            const intensity = payload.intensity || 'none';
            const reasoning = payload.reasoning || '';
            const sources = payload.sources || [];
            const pathology = payload.pathology || null;
            const answer = payload.answer || accText;

            // Clean thinking tags from answer
            const cleanAnswer = answer.replace(/<think>[\s\S]*?<\/think>\s*/g, '').trim();

            updateDiagram('response', { route, confidence, dims });

            const botMsg = addMessage('bot', cleanAnswer, { route, confidence, dimensions: dims, intensity, reasoning, sources, pathology, web_search: payload.web_search, answer_id: payload.answer_id, asked: composerLens || activeMode }, originTabId);
            reconcileAfterSend(tabs.find(t => t.id === originTabId), payload, clientMsgId, botMsg);
            updateDimBar(dims);
            dot.className = 'status-dot online';
            logFunnelEvent('answer_rendered');
          }
          currentEvent = null;
        }
      }
    }
  } catch(e) {
    console.error('Stream error:', e);
    // Fall back to non-streaming
    const originTab = tabs.find(t => t.id === originTabId);
    if (originTab) {
      originTab.messages = originTab.messages.filter(m => m.role !== 'thinking');
    }
    // Remove any streaming element
    const streamEl = document.querySelector('.msg-streaming');
    if (streamEl) streamEl.remove();
    // Try non-streaming fallback
    inFlight = false;
    releaseSendLock();
    btn.disabled = false;
    dot.className = 'status-dot';
    clearDiagramHighlights();
    if (isOffline(e)) {
      markPending(originTabId, clientMsgId);
      addMessage('system', QUEUED_LINE, null, originTabId);
      return;
    }
    addMessage('system', 'Streaming failed — retrying...', null, originTabId);
    return sendQuery(question, clientMsgId);
  }
  releaseSendLock();
  btn.disabled = false;
  inFlight = false;
}

// ── Integrated default flow: one consolidated answer grounded in all five lenses ──
const LENS_LABEL = { mobus: 'Mobus', klir: 'Klir', bunge: 'Bunge', spt: 'Troncale', ct: 'CT' };
const LENS_ROLE = { mobus: 'the anatomist', klir: 'the epistemologist', bunge: 'the ontologist', spt: 'the process theorist', ct: 'the compositionalist' };

async function sendIntegrated(question, msgId) {
  if (inFlight || sendLocked() || SESSION_EXPIRED) return;
  inFlight = true; takeSendLock(); userScrolledUp = false;

  const originTabId = activeTab;
  const btn = document.getElementById('send-btn');
  const dot = document.getElementById('status-dot');
  btn.disabled = true; dot.className = 'status-dot loading';

  const clientMsgId = msgId || crypto.randomUUID();
  addMessage('user', question, null, originTabId, clientMsgId);

  const tab = tabs.find(t => t.id === originTabId);
  forkIfOrphaned(tab);
  const userMsgCount = tab ? tab.messages.filter(m => m.role === 'user').length : 1;
  logFunnelEvent(userMsgCount <= 1 ? 'query_submitted' : 'query_submitted_second');
  if (tab && userMsgCount === 1) {
    tab.name = question.length > 30 ? question.slice(0, 28) + '…' : question;
    saveTabs(); renderConvRail();
  }
  pushConversationUrl();
  addMessage('thinking', '', null, originTabId);

  let progressEl = null, streamEl = null, elapsedTimer = null, elapsedStart = null;
  function ensureProgress() {
    if (progressEl) return;
    const thinkEl = document.querySelector('.msg-thinking'); if (thinkEl) thinkEl.remove();
    const ot = tabs.find(t => t.id === originTabId);
    if (ot) ot.messages = ot.messages.filter(m => m.role !== 'thinking');
    progressEl = document.createElement('div');
    progressEl.className = 'lens-progress';
    progressEl.innerHTML = '<span class="lp-label">Consulting the lenses</span>'
      + ['mobus', 'klir', 'bunge', 'spt', 'ct'].map(m => '<span class="lp-lens" data-lens="' + m + '">' + LENS_LABEL[m] + '</span>').join('')
      + '<span class="lp-stage"></span><span class="stage-elapsed">0s</span>';
    document.getElementById('chat-messages').appendChild(progressEl);
    elapsedStart = Date.now();
    elapsedTimer = setInterval(() => {
      const s = progressEl && progressEl.querySelector('.stage-elapsed');
      if (s) s.textContent = Math.floor((Date.now() - elapsedStart) / 1000) + 's';
    }, 1000);
    if (!userScrolledUp) progressEl.scrollIntoView({ behavior: 'smooth', block: 'end' });
  }
  function clearProgress() {
    if (elapsedTimer) { clearInterval(elapsedTimer); elapsedTimer = null; }
    if (progressEl) { progressEl.remove(); progressEl = null; }
  }

  try {
    const r = await authFetch('/ask-integrated', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        question, history: getRecentHistory(6),
        session_id: (tab || {}).sessionId || '',
        conversation_id: (tab || {}).serverId || null,
        message_id: clientMsgId,
      })
    });
    if (!r.ok || !r.body) throw new Error('integrated stream failed');

    const reader = r.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '', accText = '', currentEvent = null;
    let earlyStrip = null, earlyKey = null;

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop();
      for (const line of lines) {
        if (line.startsWith('event: ')) { currentEvent = line.slice(7).trim(); continue; }
        if (!line.startsWith('data: ') || !currentEvent) continue;
        const payload = JSON.parse(line.slice(6));

        if (currentEvent === 'readings') {
          // The readings land right after the TL;DR. From here the streaming card stops
          // re-rendering: the analysis still arriving ends up behind "Read full analysis"
          // anyway, and redrawing it above the strip would push the cards down the page.
          if (streamEl && !earlyStrip && (payload.lenses || []).length) {
            const note = document.createElement('div');
            note.className = 'lens-loading';
            note.textContent = 'Writing the full analysis…';
            streamEl.appendChild(note);
            earlyStrip = appendLensStrip(streamEl, { meta: { lenses: payload.lenses, shared: payload.shared || null } }, null, question);
            earlyKey = lensStripKey(payload.lenses, payload.shared);
            if (earlyStrip && !userScrolledUp) earlyStrip.scrollIntoView({ behavior: 'smooth', block: 'end' });
          }
        } else if (currentEvent === 'status') {
          ensureProgress();
          if (payload.stage === 'lens_ready' && payload.lens) {
            const chip = progressEl.querySelector('.lp-lens[data-lens="' + payload.lens.mode + '"]');
            if (chip) chip.classList.add('ready');
          } else if (payload.stage === 'synthesizing') {
            progressEl.querySelectorAll('.lp-lens').forEach(c => c.classList.add('ready'));
            const st = progressEl.querySelector('.lp-stage'); if (st) st.textContent = 'synthesizing…';
          }
        } else if (currentEvent === 'token') {
          clearProgress();
          const ot = tabs.find(t => t.id === originTabId);
          if (ot && ot.messages.some(m => m.role === 'thinking')) {
            ot.messages = ot.messages.filter(m => m.role !== 'thinking');
            const te = document.querySelector('.msg-thinking'); if (te) te.remove();
          }
          accText += payload.text;
          if (!streamEl) {
            streamEl = document.createElement('div');
            streamEl.className = 'msg msg-bot msg-streaming';
            document.getElementById('chat-messages').appendChild(streamEl);
          }
          if (!earlyStrip) {
            streamEl.innerHTML = renderClean(accText);
            if (!userScrolledUp) streamEl.scrollIntoView({ behavior: 'smooth', block: 'end' });
          }
        } else if (currentEvent === 'done') {
          clearProgress();
          if (payload.timing) console.log('%c⏱ Facets Integrated', 'font-weight:bold;color:#3a6e62', payload.timing);
          if (streamEl) { streamEl.remove(); streamEl = null; }
          const answer = (payload.answer || accText).replace(/<think>[\s\S]*?<\/think>\s*/g, '').trim();
          const botMsg = addMessage('bot', answer, {
            route: payload.route || 'integrated',
            confidence: payload.confidence || '',
            dimensions: [],
            sources: payload.sources || [],
            lenses: payload.lenses || [],
            shared: payload.shared || null,
            web_search: payload.web_search,
            answer_id: payload.answer_id,
            asked: 'integrated'
          }, originTabId);
          reconcileAfterSend(tabs.find(t => t.id === originTabId), payload, clientMsgId, botMsg);
          // Same readings as the strip already on screen: keep that node, so a drill-in
          // opened while the analysis was still arriving survives the final render.
          if (earlyStrip && originTabId === activeTab && earlyKey === lensStripKey(payload.lenses, payload.shared)) {
            const drawn = document.querySelectorAll('#chat-messages .lens-strip');
            if (drawn.length) drawn[drawn.length - 1].replaceWith(earlyStrip);
          }
          dot.className = 'status-dot online';
          logFunnelEvent('answer_rendered');
        }
        currentEvent = null;
      }
    }
  } catch (e) {
    console.error('Integrated error:', e);
    clearProgress();
    const ot = tabs.find(t => t.id === originTabId);
    if (ot) ot.messages = ot.messages.filter(m => m.role !== 'thinking');
    if (streamEl) streamEl.remove();
    if (isOffline(e)) {
      markPending(originTabId, clientMsgId);
      addMessage('system', QUEUED_LINE, null, originTabId);
    } else {
      addMessage('system', 'Could not reach the reasoning engine. Please try again.', null, originTabId);
    }
    dot.className = 'status-dot';
  }
  releaseSendLock();
  btn.disabled = false; inFlight = false;
}

// Drill-in: stream one lens's full grounded answer into an expanded card body (on demand).
// The integrated answer names each source by its lens ("Klir: Source and Data Systems"),
// so a lens's own sources can be picked out of the whole-answer list.
function lensSources(sources, mode) {
  const label = (LENS_LABEL[mode] || mode) + ':';
  const alt = mode === 'spt' ? 'Troncale / SPT:' : mode === 'ct' ? 'CT:' : null;
  return (sources || []).filter(sr => sr.source && (sr.source.startsWith(label) || (alt && sr.source.startsWith(alt))));
}

function appendLensSources(bodyEl, sources) {
  const names = [...new Set((sources || []).map(sr => sr.source).filter(Boolean))];
  if (!names.length) return;
  const foot = document.createElement('div');
  foot.className = 'lens-sources';
  foot.appendChild(document.createTextNode('Sources this lens drew on'));
  names.forEach(n => { const sp = document.createElement('span'); sp.textContent = n; foot.appendChild(sp); });
  bodyEl.appendChild(foot);
}

async function drillLens(bodyEl, question, mode, fallbackSources) {
  bodyEl.innerHTML = '<div class="lens-loading">Consulting ' + (LENS_LABEL[mode] || mode) + '…</div>';
  try {
    const r = await authFetch('/ask-stream', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question, history: [], mode })
    });
    if (!r.ok || !r.body) throw new Error('drill stream failed');
    const reader = r.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '', acc = '', currentEvent = null, started = false;
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop();
      for (const line of lines) {
        if (line.startsWith('event: ')) { currentEvent = line.slice(7).trim(); continue; }
        if (!line.startsWith('data: ') || !currentEvent) continue;
        const payload = JSON.parse(line.slice(6));
        if (currentEvent === 'token') {
          if (!started) { started = true; acc = ''; }
          acc += payload.text;
          bodyEl.innerHTML = renderClean(acc);
          renderMath(bodyEl);
        } else if (currentEvent === 'done') {
          acc = (payload.answer || acc).replace(/<think>[\s\S]*?<\/think>\s*/g, '').trim();
          bodyEl.innerHTML = renderClean(acc);
          appendLensSources(bodyEl, (payload.sources && payload.sources.length) ? payload.sources : fallbackSources);
          renderMath(bodyEl);
          // The drilled answer is persisted under its OWN share id — the parent integrated
          // answer's Share button carries a different id, so without this button a consultation
          // could only ever be shared as its parent.
          if (payload.answer_id) appendDrillShare(bodyEl, payload.answer_id, question);
        }
        currentEvent = null;
      }
    }
  } catch (e) {
    bodyEl.innerHTML = '<em class="lens-loading">This lens was unavailable. Try again.</em>';
  }
}

// Append the "consult a lens" drill-in strip beneath an integrated answer.
// `question` is passed when the strip is drawn before its message exists (mid-stream).
function appendLensStrip(container, m, tab, question) {
  const lenses = (m.meta && m.meta.lenses) || [];
  if (!lenses.length) return null;
  const idx = tab ? tab.messages.indexOf(m) : -1;
  let userQ = question || '';
  for (let j = idx - 1; j >= 0 && !question; j--) { if (tab.messages[j].role === 'user') { userQ = tab.messages[j].text; break; } }

  const strip = document.createElement('div');
  strip.className = 'lens-strip';
  const label = document.createElement('div');
  label.className = 'lens-strip-label';
  label.textContent = 'Consult a lens';
  strip.appendChild(label);
  if (m.meta.shared) {
    const shared = document.createElement('div');
    shared.className = 'lens-strip-shared';
    shared.textContent = m.meta.shared;
    strip.appendChild(shared);
  }
  const wrap = document.createElement('div');
  wrap.className = 'conv-lenses';
  lenses.forEach(l => {
    const card = document.createElement('div'); card.className = 'conv-lens';
    const head = document.createElement('button'); head.className = 'conv-lens-head';
    // Expand the raw dimension codes (C/N/E/G/B/T/H, S/Y, …) to their names — the letters mean nothing on their own.
    const nm = (MODE_CONFIGS[l.mode] && MODE_CONFIGS[l.mode].names) || {};
    const dimWords = (l.dimensions || []).map(d => nm[d] || d);
    const dimText = dimWords.slice(0, 3).join(', ') + (dimWords.length > 3 ? '…' : '');
    // A reading says what this lens sees in this question, so it replaces the dimension words
    // and the raw passage snippet; the role stays, since it is all a newcomer has to go on. Answers stored before readings existed keep the old card.
    if (l.reading) {
      head.classList.add('has-reading');
      head.innerHTML = '<span class="conv-lens-who"><span class="conv-lens-name">' + (LENS_LABEL[l.mode] || l.mode) + '</span>'
        + '<span class="conv-lens-role">' + (LENS_ROLE[l.mode] || '') + '</span></span>'
        + '<span class="conv-lens-reading"></span>'
        + '<span class="conv-lens-caret">Consult&nbsp;' + ICON_CHEVRON_DOWN + '</span>';
      head.querySelector('.conv-lens-reading').textContent = l.reading;
    } else {
      head.innerHTML = '<span class="conv-lens-name">' + (LENS_LABEL[l.mode] || l.mode) + '</span> '
        + '<span class="conv-lens-role">' + (LENS_ROLE[l.mode] || '') + '</span> '
        + (dimText ? '<span class="conv-lens-dims">' + dimText + '</span>' : '')
        + '<span class="conv-lens-caret">Consult&nbsp;' + ICON_CHEVRON_DOWN + '</span>';
    }
    const body = document.createElement('div'); body.className = 'conv-lens-body collapsed';
    if (l.snippet && !l.reading) { const sn = document.createElement('div'); sn.className = 'lens-snippet'; sn.textContent = l.snippet + '…'; body.appendChild(sn); }
    head.onclick = () => {
      const opening = body.classList.contains('collapsed');
      body.classList.toggle('collapsed'); head.classList.toggle('open');
      const caret = head.querySelector('.conv-lens-caret');
      if (caret) caret.innerHTML = opening ? 'Hide&nbsp;' + ICON_CHEVRON_UP : 'Consult&nbsp;' + ICON_CHEVRON_DOWN;
      if (opening && !head.dataset.loaded) { head.dataset.loaded = '1'; drillLens(body, userQ, l.mode, lensSources(m.meta.sources, l.mode)); }
    };
    card.appendChild(head); card.appendChild(body); wrap.appendChild(card);
  });
  // A fact lookup leaves nearly every lens saying it adds little. Five cards of that is
  // noise, so the strip folds to one line and the drill-ins wait behind a toggle.
  const thin = lenses.filter(l => /^\s*adds little here/i.test(l.reading || '')).length;
  if (thin && (thin === lenses.length || thin >= 4)) {
    label.remove();
    const line = document.createElement('div'); line.className = 'lens-strip-thin';
    line.appendChild(document.createTextNode('The lenses add little to a question like this.'));
    const toggle = document.createElement('button'); toggle.className = 'lens-strip-toggle';
    toggle.textContent = 'show lenses';
    toggle.onclick = () => { toggle.textContent = wrap.classList.toggle('collapsed') ? 'show lenses' : 'hide lenses'; };
    line.appendChild(toggle);
    strip.insertBefore(line, strip.firstChild);
    wrap.classList.add('collapsed');
  }
  strip.appendChild(wrap);
  container.appendChild(strip);
  return strip;
}

// "Model this → canvas" — the push half of the Facets→canvas bridge. Send the conversation's first
// question to GSR /extract, download the resulting spec, which the canvas opens via its "Import spec"
// action (reusing model_from_spec — one distillation source of truth). We download the FULL /extract
// response: the canvas unwraps .spec, and repairs/warnings ride along as provenance (pass-through ethos,
// see GSR docs/spec-architecture.md §8). Extraction model is left to the server default (Haiku cloud /
// FACETS_MODEL local) — extraction is a structural compile, distinct from the RAG model choice.
// NOTE: /extract is local-only until the integrated engine is deployed (W27 focus ③); on an engine
// without it this 404s, handled below. Server logs every /extract (kind="extract") — usage is the
// instrumentation the kernel-from-usage method calls for; no client logging needed.
document.getElementById('model-this-btn').addEventListener('click', async () => {
  const menu = document.getElementById('export-menu');
  const btn = document.getElementById('model-this-btn');
  const LABEL = 'Model this → canvas';
  const tab = getTab();
  const firstQ = tab && tab.messages.find(m => m.role === 'user');
  if (!firstQ) { menu.classList.remove('open'); return; }
  btn.disabled = true;
  btn.textContent = 'Modeling…';
  const reset = (msg) => {
    btn.textContent = msg;
    setTimeout(() => { btn.textContent = LABEL; btn.disabled = false; menu.classList.remove('open'); }, 2800);
  };
  try {
    const r = await authFetch('/extract', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ description: firstQ.text, model: '' })
    });
    if (r.status === 404) { reset('Engine has no /extract yet'); return; }
    if (!r.ok) { reset('Extract failed (' + r.status + ')'); return; }
    const data = await r.json();
    if (data.error || !data.spec) { reset('No spec returned'); return; }
    const sysName = (data.spec.system && data.spec.system.name) || firstQ.text;
    const slug = sysName.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 48) || 'system';
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = slug + '-spec.json';
    a.click();
    URL.revokeObjectURL(url);
    reset('Downloaded ✓ — open in canvas via Import spec');
  } catch (e) {
    console.error('Model this failed:', e);
    reset('Could not reach engine');
  }
});

  overlay.querySelector('.you-close').onclick = close;
  overlay.onclick = (e) => { if (e.target === overlay) close(); };

  // The server's copy of the name is the real one; the cached value paints first.
  authFetch('/v1/me').then(r => r.ok ? r.json() : null).then(me => {
    if (!me) return;
    const input = overlay.querySelector('#you-name');
    if (me.display_name && input && !input.value) input.value = me.display_name;
    if (me.display_name) setAccountName(me.display_name);
    const st = overlay.querySelector('#you-status');
    if (st) st.textContent = (me.display_name ? me.display_name : 'Anonymous') + ' · saved in this browser';
  }).catch(() => {});

  const saveBtn = overlay.querySelector('#you-name-save');
  saveBtn.onclick = async () => {
    const val = overlay.querySelector('#you-name').value.trim();
    saveBtn.disabled = true; saveBtn.textContent = 'Saving…';
    try {
      const r = await authFetch('/v1/me', {
        method: 'PATCH', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ display_name: val || null }),
      });
      saveBtn.textContent = r.ok ? 'Saved' : 'Could not save';
      if (r.ok) setAccountName(val);
    } catch (e) { saveBtn.textContent = 'Could not save'; }
    setTimeout(() => { saveBtn.textContent = 'Save'; saveBtn.disabled = false; }, 1600);
  };

  const exportBtn = overlay.querySelector('#you-export');
  exportBtn.onclick = async () => {
    exportBtn.disabled = true; exportBtn.textContent = 'Preparing…';
    try {
      const r = await authFetch('/v1/me/export');
      if (!r.ok) throw new Error('export failed');
      const blob = new Blob([JSON.stringify(await r.json(), null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'facets-export.json'; a.click();
      URL.revokeObjectURL(url);
      exportBtn.textContent = 'Downloaded';
    } catch (e) { exportBtn.textContent = 'Could not export'; }
    setTimeout(() => { exportBtn.textContent = 'Export everything'; exportBtn.disabled = false; }, 1800);
  };

  const confirmInput = overlay.querySelector('#you-confirm');
  const forgetBtn = overlay.querySelector('#you-forget');
  confirmInput.addEventListener('input', () => {
    forgetBtn.disabled = confirmInput.value.trim().toLowerCase() !== 'forget me';
  });
  forgetBtn.onclick = async () => {
    forgetBtn.disabled = true; forgetBtn.textContent = 'Deleting…';
    const revoke = overlay.querySelector('#you-revoke').checked ? '1' : '0';
    try {
      const r = await authFetch('/v1/me?revoke_shares=' + revoke, { method: 'DELETE' });
      if (!r.ok) throw new Error('erasure failed');
      // The provider keeps its own session cache; without signing out, the next load
      // would present the deleted subject's token forever and sit in "session expired".
      if (sbClient) { try { await sbClient.auth.signOut(); } catch (e) {} }
      ['facets_chats', 'facets_shares', 'facets_display_name', 'facets_auth_sub', 'facets_auth_token', 'facets_user_id']
        .forEach(k => { try { localStorage.removeItem(k); } catch (e) {} });
      window.location.replace('/chat/');
    } catch (e) {
      forgetBtn.textContent = 'Could not delete';
      setTimeout(() => { forgetBtn.textContent = 'Forget me'; forgetBtn.disabled = false; }, 1800);
    }
  };
}

function focusSheet(bi) {
  const tab = getTab();
  const total = tab ? tab.messages.filter(mm => mm.role === 'bot').length : 0;
  dockCursor = (bi >= total - 1) ? null : bi;
  renderDock();
  syncSheetFocus();
}
function syncSheetFocus() {
  const tab = getTab();
  const bots = tab ? tab.messages.filter(mm => mm.role === 'bot') : [];
  if (!bots.length) return;
  const n = dockCursor === null ? bots.length - 1 : dockCursor;
  document.querySelectorAll('.sheet').forEach(sh => {
    sh.classList.toggle('sheet-focused', Number(sh.dataset.bot) === n);
  });
}
function revealFocusedSheet() {
  syncSheetFocus();
  const sh = document.querySelector('.sheet-focused');
  if (sh) {
    sh.classList.remove('collapsed');
    sh.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }
}
function dockEsc(v) { const d = document.createElement('div'); d.textContent = v == null ? '' : String(v); return d.innerHTML; }
function renderDock() {
  const dock = document.getElementById('context-dock');
  if (!dock) return;
  const tab = getTab();
  const bots = tab ? tab.messages.filter(mm => mm.role === 'bot') : [];
  if (!bots.length) { dock.classList.remove('has-content'); document.body.classList.remove('dock-open'); dock.innerHTML = ''; return; }
  dock.classList.add('has-content');
  document.body.classList.toggle('dock-open', dockOpen && !READONLY);
  if (dockCursor !== null && (dockCursor < 0 || dockCursor >= bots.length)) dockCursor = null;
  const n = dockCursor === null ? bots.length - 1 : dockCursor;
  const m = bots[n];
  const meta = m.meta || {};
  const idx = tab.messages.indexOf(m);
  let q = '';
  for (let j = idx - 1; j >= 0; j--) { if (tab.messages[j].role === 'user') { q = tab.messages[j].text; break; } }
  const g = (m.text.match(/\[\[g:/g) || []).length;
  const u = (m.text.match(/\[\[u\]\]/g) || []).length;
  const asked = meta.asked || ((meta.lenses && meta.lenses.length) ? 'integrated' : null);
  const thinker = (asked && asked !== 'integrated') ? THINKERS[asked] : null;
  const cfg = thinker && MODE_CONFIGS[asked] ? MODE_CONFIGS[asked] : null;
  const dims = meta.dimensions || [];
  const rows = [];
  if (meta.route) rows.push(['route', dockEsc(meta.route)]);
  if (meta.confidence) rows.push(['confidence', dockEsc(meta.confidence)]);
  if (meta.intensity && meta.intensity !== 'none') rows.push(['intensity', dockEsc(meta.intensity)]);
  if (g || u) rows.push(['grounding', u
    ? '<span style="color: var(--verdict-warning)">' + g + ' \u2713 \u00b7 ' + u + ' open</span>'
    : '<span style="color: var(--verdict-ok)">grounded \u2713</span>']);
  if (meta.web_search) rows.push(['web', 'searched']);

  let html = '<div class="dock-head">'
    + '<button class="dock-step" id="dock-prev"' + (n === 0 ? ' disabled' : '') + ' aria-label="Earlier answer">\u2039</button>'
    + '<span class="dock-count">answer ' + (n + 1) + ' of ' + bots.length + '</span>'
    + '<button class="dock-step" id="dock-next"' + (n === bots.length - 1 ? ' disabled' : '') + ' aria-label="Later answer">\u203a</button>'
    + '<button class="dock-close" id="dock-close" aria-label="Close details">close \u2715</button>'
    + '</div>';
  if (q) html += '<div class="dock-q">' + dockEsc(q.length > 90 ? q.slice(0, 90) + '\u2026' : q) + '</div>';
  if (rows.length) html += '<div class="dock-section"><div class="dock-label">Readouts</div><div class="dock-rows">'
    + rows.map(r => '<span>' + r[0] + '</span><span class="dock-val">' + r[1] + '</span>').join('') + '</div></div>';
  if (thinker) {
    html += '<div class="dock-section"><div class="dock-label">Lens \u00b7 ' + dockEsc(thinker.name) + '</div>'
      + '<div class="dock-asks">' + dockEsc(thinker.asks.replace('This lens asks: ', '')) + '</div>';
    if (dims.length) html += '<div class="dock-chips">' + dims.map(d =>
      '<span class="dock-chip" style="color: var(--dim-' + dockEsc(d) + ', var(--ink-dim))">' + dockEsc((cfg && cfg.names[d]) || d) + '</span>').join('') + '</div>';
    html += '</div>';
  } else if (dims.length) {
    html += '<div class="dock-section"><div class="dock-label">Dimensions</div><div class="dock-chips">' + dims.map(d =>
      '<span class="dock-chip" style="color: var(--dim-' + dockEsc(d) + ', var(--ink-dim))">' + dockEsc(dimDisplayName(d)) + '</span>').join('') + '</div></div>';
  }
  const srcs = [...new Set((meta.sources || []).map(sr => sr.source).filter(Boolean))];
  if (srcs.length) html += '<div class="dock-section"><div class="dock-label">Sources</div><div class="dock-sources">'
    + srcs.map(sr => '<span>' + dockEsc(sr) + '</span>').join('') + '</div></div>';
  html += '<div class="dock-note">' + (dockCursor === null ? 'following the latest answer' : 'pinned \u2014 \u203a returns to latest') + '</div>';
  dock.innerHTML = html;
  const closeBtn = document.getElementById('dock-close');
  if (closeBtn) closeBtn.onclick = () => setDockOpen(false);
  const prev = document.getElementById('dock-prev'), next = document.getElementById('dock-next');
  if (prev) prev.onclick = () => { dockCursor = n - 1; renderDock(); revealFocusedSheet(); };
  if (next) next.onclick = () => { dockCursor = (n + 1 >= bots.length - 1) ? null : n + 1; renderDock(); revealFocusedSheet(); };
}

// ── Lens bar wiring ──
(function buildLensBar() {
  const bar = document.getElementById('lens-bar');
  // "All lenses" = the integrated default (leftmost, active on load).
  const allBtn = document.createElement('button');
  allBtn.className = 'lens-btn lens-btn-all active';
  allBtn.dataset.mode = '__all__';
  allBtn.setAttribute('aria-pressed', 'true');
  allBtn.innerHTML = '<span class="lens-name">All lenses</span><span class="lens-tag">one consolidated answer</span>';
  allBtn.addEventListener('click', () => selectComposerLens(null));
  bar.appendChild(allBtn);
  Object.keys(MODE_CONFIGS).forEach(mode => {
    const t = THINKERS[mode];
    const btn = document.createElement('button');
    btn.className = 'lens-btn';
    btn.dataset.mode = mode;
    btn.setAttribute('aria-pressed', 'false');
    btn.innerHTML = '<span class="lens-name">' + (t.short || t.name.split(' ').pop()) + '</span><span class="lens-tag">' + t.tag + '</span>';
    btn.addEventListener('click', () => {
      if (composerLens === mode) {
        // Tapping the already-selected lens re-opens its bio card
        const card = document.getElementById('thinker-card');
        card.hidden = !card.hidden;
        return;
      }
      selectComposerLens(mode);
      localStorage.setItem('facets-mode', mode);
    });
    bar.appendChild(btn);
  });
})();

// Header "Lenses" toggle — reveals the (demoted) lens bar for power users.
document.getElementById('lens-toggle').addEventListener('click', () => {
  const zone = document.getElementById('lens-zone');
  const showing = zone.hidden;
  zone.hidden = !showing;
  document.getElementById('lens-toggle').classList.toggle('active', showing);
  document.getElementById('lens-toggle').setAttribute('aria-pressed', String(showing));
});
document.getElementById('composer-lens-clear').addEventListener('click', () => selectComposerLens(null));
function hideThinkerCard() {
  document.getElementById('thinker-card').hidden = true;
  sessionStorage.setItem('facets-thinker-dismissed', '1');
}
document.getElementById('thinker-dismiss').addEventListener('click', hideThinkerCard);
document.addEventListener('click', (e) => {
  const card = document.getElementById('thinker-card');
  if (!card.hidden && !e.target.closest('.lens-zone')) hideThinkerCard();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') hideThinkerCard();
});
// Default front door is integrated (all five). Init dim-bar globals without revealing the
// demoted lens zone or bio card; the "Lenses" toggle surfaces single-lens mode on demand.
const savedMode = localStorage.getItem('facets-mode');
const startMode = (savedMode && MODE_CONFIGS[savedMode]) ? savedMode : 'mobus';
switchMode(startMode, false);
selectComposerLens(null);

init();

// Minimal PWA app-shell service worker — makes "pin to home screen" a real standalone
// app and repeat /a/<id> opens instant. Additive; failure is silently ignored.
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
