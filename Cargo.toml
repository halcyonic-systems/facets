[package]
name = "bert-lenses"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "0.31"
egui = { version = "0.31", features = ["serde"] }
bert-core = { path = "../bert/bert-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.14"
ehttp = "0.5"

# The executable dynamical face — the Run surface builds a circuit from the
# Operational projection and records a trace. Native-only: bert-compose is a
# desktop egui app crate (windowing, native http), so it is excluded from the
# wasm build, and the Run feature is `cfg`-gated to match.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bert-compose = { path = "../bert/bert-compose" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
web-sys = "0.3"
