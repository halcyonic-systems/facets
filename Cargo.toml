# bert-lenses — web-first systems-modeling instrument.
#
# THE LOAD-BEARING INVARIANT: Rust is the brain, running as WASM in the browser;
# React/Tailwind is the face. Everything under crates/ is TRUTH (the kernel that
# owns every systemhood verdict, all validation, the whole simulation). The web/
# layer is the FACE and holds zero formalism logic. Systems logic in JS is a bug.
#
# The crates are vendored, self-contained (no cross-repo path deps), and compile
# to wasm32-unknown-unknown to run in the page — the same code an optional Tauri
# wrapper would run natively.
[workspace]
resolver = "2"
members = ["crates/*"]
