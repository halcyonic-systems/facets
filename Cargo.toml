[package]
name = "bert-lenses"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "0.31"
egui = { version = "0.31", features = ["serde"] }
bert-core = { path = "../bert/bert-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.14"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
web-sys = "0.3"
