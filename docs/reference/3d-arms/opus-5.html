<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Facets — exploded view</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --serif: "Cormorant Garamond", Georgia, "Times New Roman", serif;

    --paper:#f1f2f3;
    --ink:#17181a;
    --muted:#5d6670;
    --accent:#3d6373;
    --accent-strong:#2a4b59;
    --hairline:#e5ecf0;

    --matter:#57814c;
    --energy:#bb6c1c;
    --info:#8054a0;
    --field:#2f6c9c;

    --label-bg: rgba(241,242,243,.84);
    --panel-bg: rgba(241,242,243,.93);

    --gl-shell:#3d6373;
    --gl-wire:#5d6670;
    --gl-body:#3d6373;
    --gl-iface:#2a4b59;
    --gl-env:#5d6670;
    --gl-port:#2a4b59;
    --gl-edge:#17181a;
  }
  :root[data-theme="dark"]{
    --paper:#16181a;
    --ink:#e8eaec;
    --muted:#5d6670;
    --accent:#6fa5b8;
    --accent-strong:#95c3d3;
    --hairline: rgba(93,102,112,.38);

    --matter:#649457;
    --energy:#c6721e;
    --info:#9e79b8;
    --field:#428cc6;

    --label-bg: rgba(22,24,26,.82);
    --panel-bg: rgba(22,24,26,.93);

    --gl-shell:#6fa5b8;
    --gl-wire:#5d6670;
    --gl-body:#6fa5b8;
    --gl-iface:#95c3d3;
    --gl-env:#5d6670;
    --gl-port:#95c3d3;
    --gl-edge:#e8eaec;
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--paper);color:var(--ink);
    font:13px/1.35 var(--sans);
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
    overscroll-behavior:none;
  }
  #app{display:flex;flex-direction:column;height:100vh;height:100dvh;width:100%;overflow:hidden}

  /* top bar */
  #topbar{
    flex:0 0 auto;display:flex;align-items:center;gap:8px;
    padding:5px 10px;min-height:42px;
    border-bottom:1px solid var(--hairline);
  }
  #title{min-width:0;display:flex;align-items:baseline;gap:8px;overflow:hidden}
  #mname{
    font-family:var(--serif);font-weight:600;font-size:20px;line-height:1.15;
    letter-spacing:.005em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  #mmeta{color:var(--muted);font-size:10.5px;white-space:nowrap;letter-spacing:.04em;text-transform:lowercase}
  #tools{margin-left:auto;display:flex;align-items:center;gap:5px;flex:0 0 auto}
  #models{display:flex;gap:4px}

  button{
    font:inherit;font-size:11.5px;color:var(--ink);background:transparent;
    border:1px solid var(--hairline);border-radius:3px;padding:4px 8px;cursor:pointer;
    letter-spacing:.02em;
  }
  button:hover{border-color:var(--accent)}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  button[aria-pressed="true"]{color:var(--accent-strong);border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}

  /* stage */
  #stage{position:relative;flex:1 1 auto;min-height:0;width:100%}
  canvas#gl{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
  canvas#gl.dragging{cursor:grabbing}

  #labels{position:absolute;inset:0;overflow:hidden;pointer-events:none}
  .lb{
    position:absolute;left:0;top:0;white-space:nowrap;
    font-size:11px;line-height:1.25;letter-spacing:.015em;
    padding:2px 5px;border:1px solid var(--hairline);border-radius:2px;
    background:var(--label-bg);color:var(--ink);
    visibility:hidden;
  }
  .lb.env{color:var(--muted)}
  .lb.iface{border-color:var(--accent);color:var(--accent-strong)}
  .lb.orphan{opacity:.45}
  .lb.port{font-size:10px;color:var(--accent-strong);border-style:dashed;padding:1px 4px}
  .lb.flow{
    border:0;background:transparent;font-size:10.5px;padding:0;
    text-shadow:0 0 3px var(--paper),0 0 3px var(--paper),0 0 5px var(--paper),0 0 5px var(--paper);
  }
  .lb.dim{opacity:.22}
  .lb.sel{border-color:var(--accent-strong);box-shadow:0 0 0 1px var(--accent-strong)}

  /* panel */
  #panel{
    position:absolute;left:8px;right:8px;bottom:8px;
    max-height:48%;overflow:auto;
    background:var(--panel-bg);border:1px solid var(--hairline);border-radius:3px;
    padding:9px 10px 10px;
  }
  @media (min-width:600px){
    #panel{left:auto;width:300px;max-height:66%}
  }
  #panelClose{position:absolute;top:5px;right:5px;border:0;padding:2px 6px;font-size:14px;color:var(--muted);line-height:1}
  #pName{font-size:14px;font-weight:600;padding-right:22px}
  #pMeta{color:var(--muted);font-size:10.5px;letter-spacing:.04em;margin-top:2px;text-transform:lowercase}
  #pPorts{margin-top:7px;font-size:11px;color:var(--accent-strong)}
  #pPorts div{padding:1px 0}
  #pFlows{list-style:none;margin:8px 0 0;padding:7px 0 0;border-top:1px solid var(--hairline)}
  #pFlows li{display:flex;gap:6px;align-items:baseline;padding:2.5px 0;font-size:11.5px}
  #pFlows .dot{flex:0 0 auto;width:7px;height:7px;border-radius:50%;transform:translateY(-1px)}
  #pFlows .nm{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #pFlows .am{flex:0 0 auto;color:var(--muted);font-size:10.5px}
  #pFlows .am.undeclared{font-style:italic;opacity:.8}
  #pFlows .mere{opacity:.6}
  #pEmpty{color:var(--muted);font-size:11px;margin-top:8px}

  #notice{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    padding:28px;text-align:center;color:var(--muted);font-size:13px;background:var(--paper);
  }

  /* control strip */
  #strip{
    flex:0 0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:7px 12px;
    padding:7px 10px;border-top:1px solid var(--hairline);
  }
  #explodeWrap{display:flex;align-items:center;gap:8px;flex:1 1 190px;min-width:165px}
  #explodeWrap label{color:var(--muted);font-size:11px;letter-spacing:.04em}
  #explodeOut{font-variant-numeric:tabular-nums;font-size:11px;color:var(--ink);min-width:34px;text-align:right}
  input[type=range]{flex:1 1 auto;min-width:80px;accent-color:var(--accent);height:18px;background:transparent}
  .chk{display:inline-flex;align-items:center;gap:5px;color:var(--muted);font-size:11px;letter-spacing:.04em;cursor:pointer}
  .chk input{accent-color:var(--accent);margin:0}
  .chk input:disabled + span{opacity:.45}
  #textureNote{flex:1 0 100%;margin:0;color:var(--muted);font-size:10.5px;letter-spacing:.02em}

  body.nodata #strip,body.nodata #panel{display:none}
  [hidden]{display:none !important}
</style>
</head>
<body>
<div id="app">
  <header id="topbar">
    <div id="title"><span id="mname">Facets</span><span id="mmeta"></span></div>
    <div id="tools">
      <div id="models"></div>
      <button id="themeBtn" type="button">theme</button>
    </div>
  </header>

  <main id="stage">
    <canvas id="gl"></canvas>
    <div id="labels"></div>
    <aside id="panel" hidden>
      <button id="panelClose" type="button" aria-label="clear selection">×</button>
      <div id="pName"></div>
      <div id="pMeta"></div>
      <div id="pPorts"></div>
      <ul id="pFlows"></ul>
      <div id="pEmpty" hidden>no flows</div>
    </aside>
    <div id="notice" hidden><span id="noticeText"></span></div>
  </main>

  <footer id="strip">
    <div id="explodeWrap">
      <label for="explode">explode</label>
      <input id="explode" type="range" min="0" max="100" step="1" value="0">
      <output id="explodeOut">0%</output>
    </div>
    <button id="homeBtn" type="button">home</button>
    <label class="chk"><input type="checkbox" id="flowLabelsChk"><span>flow labels</span></label>
    <label class="chk"><input type="checkbox" id="textureChk"><span>texture</span></label>
    <p id="textureNote">This motion is not data.</p>
  </footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
"use strict";

/* ------------------------------------------------------------------ utils */
var $ = function(s){ return document.querySelector(s); };
function num(v){ var n = (typeof v === "number") ? v : parseFloat(v); return isFinite(n) ? n : 0; }
function hash01(s){
  var h = 2166136261 >>> 0;
  s = String(s);
  for (var i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h,16777619) >>> 0; }
  return (h >>> 8) / 16777216;
}
function cv(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function glcol(n){ return new THREE.Color(cv(n) || "#888888"); }
function roleOf(t){ return (t && t.role === "Environment") ? "Environment" : "Component"; }
function kindVar(k){
  if (k === "Matter") return "--matter";
  if (k === "Energy") return "--energy";
  if (k === "Informational") return "--info";
  if (k === "Field") return "--field";
  return "--muted";
}

/* ------------------------------------------------------------------ state */
var mqDark   = window.matchMedia("(prefers-color-scheme: dark)");
var mqMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
var reduceMotion = mqMotion.matches;
var manualTheme = null;

var state = { modelIndex:0, explode:0, selected:null, texture:false, flowLabels:false };

var models = [];
var renderer=null, scene=null, camera=null, canvas=null, stageEl=null, labelsEl=null;
var raycaster = new THREE.Raycaster();
var rootGroup=null, shellGroup=null, bodyGroup=null, portGroup=null, flowGroup=null, markerGroup=null;
var L = null;            /* current layout */
var labelDefs = [];
var markers = [];
var pickables = [];
var orbit = { theta:-0.95, phi:1.14, radius:60, target:new THREE.Vector3() };
var rafId = null;

/* ------------------------------------------------------------------ theme */
function currentTheme(){ return manualTheme || (mqDark.matches ? "dark" : "light"); }
function applyTheme(){ document.documentElement.setAttribute("data-theme", currentTheme()); }

/* ------------------------------------------------------------------ notice */
function showNotice(msg){
  var n = $("#notice");
  $("#noticeText").textContent = msg;
  n.hidden = false;
}
function hideNotice(){ $("#notice").hidden = true; }

/* ------------------------------------------------------------------ fixture */
function loadFixture(){
  var el = document.getElementById("fixture");
  if (!el) return { models: [] };
  var raw = (el.textContent || "").trim();
  if (!raw) return { models: [] };
  try {
    var j = JSON.parse(raw);
    if (!j || !Array.isArray(j.models)) return { models: [] };
    return j;
  } catch(e){ return { models: [] }; }
}

/* ------------------------------------------------------------------ dispose */
function disposeObject(obj){
  obj.traverse(function(o){
    if (o.geometry) o.geometry.dispose();
    if (o.material){
      var list = Array.isArray(o.material) ? o.material : [o.material];
      for (var i=0;i<list.length;i++){
        var m = list[i];
        if (m.map) m.map.dispose();
        m.dispose();
      }
    }
  });
}
function disposeChildren(g){
  if (!g) return;
  for (var i=g.children.length-1;i>=0;i--){
    var c = g.children[i];
    disposeObject(c);
    g.remove(c);
  }
}

/* ------------------------------------------------------------------ layout */
function layout(model){
  var canv  = model.canvas || {};
  var facts = model.facts  || {};
  var things    = Array.isArray(canv.things) ? canv.things : [];
  var relations = Array.isArray(canv.relations) ? canv.relations : [];
  var ifaceSet  = new Set(facts.authored_interface_thing_ids || []);
  var orphanSet = new Set(facts.orphan_env_thing_ids || []);
  var portsRaw  = Array.isArray(facts.ports) ? facts.ports : [];

  var byId = new Map();
  things.forEach(function(t){ if (t && t.id != null) byId.set(t.id, t); });

  var isIface = function(t){ return ifaceSet.has(t.id) && roleOf(t) !== "Environment"; };
  var comps  = things.filter(function(t){ return roleOf(t) === "Component" && !isIface(t); });
  var ifaces = things.filter(isIface);
  var envs   = things.filter(function(t){ return roleOf(t) === "Environment"; });

  /* --- 2D bounds over interior + interface things --- */
  var planar = comps.concat(ifaces);
  var src = planar.length ? planar : things;
  var minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
  src.forEach(function(t){
    var x=num(t.x), y=num(t.y);
    if (x<minX)minX=x; if (x>maxX)maxX=x;
    if (y<minY)minY=y; if (y>maxY)maxY=y;
  });
  if (!isFinite(minX)){ minX=0;maxX=1;minY=0;maxY=1; }
  var spanX = maxX-minX, spanY = maxY-minY;
  var span  = Math.max(spanX, spanY);
  var degenerate = span < 1e-6;
  var SPREAD = 9.0, DEPTH = 5.0;

  function map2(t, idx, total){
    if (degenerate){
      var a = (total>1) ? (idx/total)*Math.PI*2 : 0;
      return { x: Math.cos(a)*SPREAD*0.7, y: Math.sin(a)*SPREAD*0.7 };
    }
    return {
      x:  ((num(t.x) - (minX+maxX)/2) / span) * 2 * SPREAD,
      y: -((num(t.y) - (minY+maxY)/2) / span) * 2 * SPREAD
    };
  }

  var nodes = new Map();
  var interiorPts = [];

  comps.forEach(function(t, i){
    var p = map2(t, i, comps.length);
    var z = (hash01(t.id + "#z")*2 - 1) * DEPTH;
    var v = new THREE.Vector3(p.x, p.y, z);
    interiorPts.push(v);
    nodes.set(t.id, { id:t.id, t:t, kind:"component", base:v, pos:v.clone(), onShell:false, orphan:false });
  });

  /* shell radii */
  var mx=0,my=0,mz=0;
  interiorPts.forEach(function(v){
    mx=Math.max(mx,Math.abs(v.x)); my=Math.max(my,Math.abs(v.y)); mz=Math.max(mz,Math.abs(v.z));
  });
  var rx = Math.max(mx*1.26 + 2.8, 7.0);
  var ry = Math.max(my*1.26 + 2.8, 6.0);
  var rz = Math.max(mz*1.45 + 3.4, 5.5);
  var Rmean = (rx+ry+rz)/3;
  var S = Math.max(Rmean*0.155, 1.25);

  function onShell(dir){
    var d = dir.clone();
    if (d.lengthSq() < 1e-9) d.set(0,0,1);
    d.normalize();
    var t = 1/Math.sqrt((d.x/rx)*(d.x/rx) + (d.y/ry)*(d.y/ry) + (d.z/rz)*(d.z/rz));
    return d.multiplyScalar(t);
  }

  /* interfaces live ON the shell */
  ifaces.forEach(function(t, i){
    var p = map2(t, i, ifaces.length);
    var z = (hash01(t.id + "#z")*2 - 1) * DEPTH * 0.8;
    var base = onShell(new THREE.Vector3(p.x, p.y, z));
    nodes.set(t.id, { id:t.id, t:t, kind:"interface", base:base, pos:base.clone(), onShell:true, orphan:false });
  });

  /* environment banks: sources one side, sinks the other, neutral in front */
  function sortBank(a,b){
    var d = num(a.y) - num(b.y);
    if (d !== 0) return d;
    return num(a.x) - num(b.x);
  }
  var sources = envs.filter(function(t){ return t.env_kind === "Source"; }).sort(sortBank);
  var sinks   = envs.filter(function(t){ return t.env_kind === "Sink";   }).sort(sortBank);
  var neutral = envs.filter(function(t){ return t.env_kind !== "Source" && t.env_kind !== "Sink"; }).sort(sortBank);

  var SPY = Math.max(6.4, ry*0.62), SPL = Math.max(8.0, rz*0.9);
  var GAPX = rx + 9.5, GAPZ = rz + 10.5;

  function placeBank(list, mode){
    var n = list.length; if (!n) return;
    var maxRows = 4;
    var cols = Math.max(1, Math.ceil(n/maxRows));
    var rows = Math.ceil(n/cols);
    list.forEach(function(t, i){
      var c = Math.floor(i/rows), r = i % rows;
      var y = (((rows-1)/2) - r) * SPY;
      var lat = (c - (cols-1)/2) * SPL;
      var v;
      if (mode === "left")       v = new THREE.Vector3(-GAPX - c*0.6, y, lat);
      else if (mode === "right") v = new THREE.Vector3( GAPX + c*0.6, y, lat);
      else                       v = new THREE.Vector3(lat, y, GAPZ + c*0.6);
      nodes.set(t.id, {
        id:t.id, t:t, kind:"env", base:v, pos:v.clone(), onShell:false,
        orphan: orphanSet.has(t.id)
      });
    });
  }
  placeBank(sources,"left");
  placeBank(sinks,"right");
  placeBank(neutral,"front");

  /* radii for trimming / label offsets */
  nodes.forEach(function(n){
    if (n.kind === "component") n.radius = S*0.72;
    else if (n.kind === "interface") n.radius = S*0.62;
    else n.radius = S*0.78;
  });

  /* ports on the shell, facing their environment thing */
  var ports = [], portByPair = new Map();
  portsRaw.forEach(function(p, i){
    if (!p) return;
    var nc = nodes.get(p.component), ne = nodes.get(p.env);
    if (!nc || !ne) return;
    var de = ne.base.clone(); if (de.lengthSq()<1e-9) de.set(0,0,1); de.normalize();
    var dc = nc.base.clone(); if (dc.lengthSq()<1e-9) dc.copy(de); dc.normalize();
    var dir = de.multiplyScalar(0.74).addScaledVector(dc, 0.26);
    var base = onShell(dir);
    var rec = {
      id: "port:"+i, component:p.component, env:p.env,
      direction: p.direction || "Both",
      protocol: p.protocol || "",
      relation_ids: Array.isArray(p.relation_ids) ? p.relation_ids : [],
      base: base, pos: base.clone(), group:null
    };
    ports.push(rec);
    portByPair.set(p.component + ">" + p.env, rec);
  });

  /* relations: group parallels, normalise declared amounts */
  var valid = relations.filter(function(r){ return r && nodes.has(r.a) && nodes.has(r.b); });
  var groupCount = new Map(), groupSeen = new Map();
  valid.forEach(function(r){
    var k = [String(r.a), String(r.b)].sort().join("|");
    groupCount.set(k, (groupCount.get(k)||0) + 1);
  });
  var lo = Infinity, hi = -Infinity;
  valid.forEach(function(r){
    if (r.ample === true) return;
    if (r.amount == null || r.amount === "") return;
    var v = parseFloat(r.amount);
    if (isFinite(v) && v > 0){ lo = Math.min(lo,v); hi = Math.max(hi,v); }
  });
  function normAmount(v){
    if (!isFinite(lo) || !isFinite(hi) || hi <= lo) return 0.5;
    var a = Math.log(Math.max(v,1e-9)), l = Math.log(lo), h = Math.log(hi);
    return Math.min(1, Math.max(0, (a-l)/(h-l)));
  }
  var flows = valid.map(function(r){
    var k = [String(r.a), String(r.b)].sort().join("|");
    var idx = groupSeen.get(k) || 0;
    groupSeen.set(k, idx+1);
    return { rel:r, idx:idx, count:groupCount.get(k) || 1 };
  });

  /* neighbour index */
  var neighbours = new Map();
  nodes.forEach(function(n){ neighbours.set(n.id, new Set([n.id])); });
  valid.forEach(function(r){
    if (neighbours.has(r.a)) neighbours.get(r.a).add(r.b);
    if (neighbours.has(r.b)) neighbours.get(r.b).add(r.a);
  });

  return {
    model:model, canv:canv, things:things, relations:valid, byId:byId,
    ifaceSet:ifaceSet, orphanSet:orphanSet,
    nodes:nodes, ports:ports, portByPair:portByPair, flows:flows,
    neighbours:neighbours,
    rx:rx, ry:ry, rz:rz, Rmean:Rmean, S:S, onShell:onShell,
    normAmount:normAmount,
    timeUnit: canv.time_unit || ""
  };
}

/* ------------------------------------------------------------------ geometry helpers */
function latLongGeometry(meridians, parallels, seg){
  var pts = [];
  function sph(lon, lat){
    return new THREE.Vector3(Math.sin(lat)*Math.cos(lon), Math.cos(lat), Math.sin(lat)*Math.sin(lon));
  }
  var m,i,p,a,b,lon,lat;
  for (m=0;m<meridians;m++){
    lon = m/meridians*Math.PI*2;
    for (i=0;i<seg;i++){
      a = i/seg*Math.PI; b = (i+1)/seg*Math.PI;
      pts.push(sph(lon,a), sph(lon,b));
    }
  }
  for (p=1;p<parallels;p++){
    lat = p/parallels*Math.PI;
    for (i=0;i<seg;i++){
      a = i/seg*Math.PI*2; b = (i+1)/seg*Math.PI*2;
      pts.push(sph(a,lat), sph(b,lat));
    }
  }
  return new THREE.BufferGeometry().setFromPoints(pts);
}
function orientY(obj, dir){
  var d = dir.clone();
  if (d.lengthSq() < 1e-9) d.set(0,1,0);
  d.normalize();
  obj.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), d);
}
function orientZ(obj, dir){
  var d = dir.clone();
  if (d.lengthSq() < 1e-9) d.set(0,0,1);
  d.normalize();
  obj.quaternion.setFromUnitVectors(new THREE.Vector3(0,0,1), d);
}
function mkMat(colorHex, opacity, flat){
  var m = new THREE.MeshStandardMaterial({
    color: colorHex, roughness: 0.62, metalness: 0.06,
    transparent: true, opacity: opacity, flatShading: !!flat
  });
  m.userData.base = opacity;
  return m;
}
function mkLineMat(colorHex, opacity){
  var m = new THREE.LineBasicMaterial({ color: colorHex, transparent:true, opacity: opacity });
  m.userData.base = opacity;
  return m;
}
function setDim(obj, dim){
  if (!obj) return;
  obj.traverse(function(o){
    if (!o.material) return;
    var list = Array.isArray(o.material) ? o.material : [o.material];
    for (var i=0;i<list.length;i++){
      var m = list[i];
      var b = (m.userData && m.userData.base != null) ? m.userData.base : 1;
      m.opacity = dim ? b*0.12 : b;
      m.transparent = true;
    }
  });
}

/* ------------------------------------------------------------------ labels */
function addLabel(text, cls, getPos, rank, colorHex){
  var el = document.createElement("div");
  el.className = "lb " + (cls||"");
  el.textContent = text;
  if (colorHex) el.style.color = colorHex;
  labelsEl.appendChild(el);
  var def = { el:el, get:getPos, rank:rank, visible:true, w:0, h:0 };
  labelDefs.push(def);
  return def;
}
function measureLabels(){
  for (var i=0;i<labelDefs.length;i++){
    var d = labelDefs[i];
    d.w = d.el.offsetWidth;
    d.h = d.el.offsetHeight;
  }
}
var LABEL_OFFSETS = [0,-15,15,-30,30,-46,46,-62,62];
function updateLabels(){
  if (!camera || !labelDefs.length) return;
  var W = labelsEl.clientWidth, H = labelsEl.clientHeight;
  var items = [], i, d;
  var v = new THREE.Vector3();
  for (i=0;i<labelDefs.length;i++){
    d = labelDefs[i];
    if (!d.visible || !d.w){ d.el.style.visibility = "hidden"; continue; }
    v.copy(d.get()).project(camera);
    if (v.z > 1 || v.z < -1){ d.el.style.visibility = "hidden"; continue; }
    var x = (v.x*0.5+0.5)*W, y = (-v.y*0.5+0.5)*H;
    if (x < -80 || x > W+80 || y < -60 || y > H+60){ d.el.style.visibility = "hidden"; continue; }
    items.push({ d:d, x:x, y:y, z:v.z });
  }
  items.sort(function(a,b){ return (a.d.rank - b.d.rank) || (a.z - b.z); });

  var placed = [];
  var panel = $("#panel");
  if (panel && !panel.hidden){
    var pr = panel.getBoundingClientRect(), sr = labelsEl.getBoundingClientRect();
    placed.push({ x:pr.left-sr.left-4, y:pr.top-sr.top-4, w:pr.width+8, h:pr.height+8 });
  }
  function hits(r){
    for (var k=0;k<placed.length;k++){
      var p = placed[k];
      if (r.x < p.x+p.w && r.x+r.w > p.x && r.y < p.y+p.h && r.y+r.h > p.y) return true;
    }
    return false;
  }
  for (i=0;i<items.length;i++){
    var it = items[i], ok = false;
    for (var j=0;j<LABEL_OFFSETS.length;j++){
      var rx = Math.round(it.x - it.d.w/2);
      var ry = Math.round(it.y - it.d.h - 7 + LABEL_OFFSETS[j]);
      if (rx < 1 || rx + it.d.w > W-1 || ry < 1 || ry + it.d.h > H-1) continue;
      var rect = { x:rx, y:ry, w:it.d.w+3, h:it.d.h+3 };
      if (hits(rect)) continue;
      placed.push(rect);
      it.d.el.style.transform = "translate(" + rx + "px," + ry + "px)";
      it.d.el.style.visibility = "visible";
      ok = true; break;
    }
    if (!ok) it.d.el.style.visibility = "hidden";
  }
}

/* ------------------------------------------------------------------ scene build */
function teardown(){
  state.selected = null;
  if (rootGroup){ disposeObject(rootGroup); if (scene) scene.remove(rootGroup); }
  rootGroup = shellGroup = bodyGroup = portGroup = flowGroup = markerGroup = null;
  scene = null; L = null;
  labelDefs = []; markers = []; pickables = [];
  if (labelsEl) labelsEl.innerHTML = "";
  hidePanel();
}

function buildScene(model){
  teardown();
  L = layout(model);

  scene = new THREE.Scene();
  scene.background = glcol("--paper");
  scene.fog = new THREE.Fog(cv("--paper") || "#f1f2f3", L.Rmean*3.2, L.Rmean*11);

  var hemi = new THREE.HemisphereLight(0xffffff, 0x8a8f94, 0.72);
  scene.add(hemi);
  var key = new THREE.DirectionalLight(0xffffff, 0.75); key.position.set(1, 1.5, 1.1); scene.add(key);
  var fill = new THREE.DirectionalLight(0xffffff, 0.32); fill.position.set(-1.2, 0.6, -0.9); scene.add(fill);
  var rim = new THREE.DirectionalLight(0xffffff, 0.22); rim.position.set(0.2, -1.0, -0.6); scene.add(rim);

  rootGroup = new THREE.Group();
  shellGroup = new THREE.Group();
  bodyGroup = new THREE.Group();
  portGroup = new THREE.Group();
  flowGroup = new THREE.Group();
  markerGroup = new THREE.Group();
  rootGroup.add(shellGroup, bodyGroup, portGroup, flowGroup, markerGroup);
  scene.add(rootGroup);

  var S = L.S;
  var edgeCol = cv("--gl-edge");

  /* shell */
  var shellMat = new THREE.MeshStandardMaterial({
    color: glcol("--gl-shell"), transparent:true, opacity:0.085,
    roughness:0.9, metalness:0.0, side:THREE.DoubleSide, depthWrite:false
  });
  shellMat.userData.base = 0.085;
  var shellMesh = new THREE.Mesh(new THREE.SphereGeometry(1, 48, 32), shellMat);
  shellMesh.scale.set(L.rx, L.ry, L.rz);
  shellMesh.renderOrder = 10;
  shellGroup.add(shellMesh);

  var wireMat = mkLineMat(cv("--gl-wire"), 0.22);
  var wire = new THREE.LineSegments(latLongGeometry(12, 8, 40), wireMat);
  wire.scale.set(L.rx, L.ry, L.rz);
  wire.renderOrder = 9;
  shellGroup.add(wire);

  /* bodies */
  L.nodes.forEach(function(n){
    var g = new THREE.Group();
    var mesh, geo, mat, lineCol = edgeCol, lineOp = 0.42;

    if (n.kind === "component"){
      geo = new THREE.BoxGeometry(S*1.18, S*0.9, S*1.18);
      mat = mkMat(cv("--gl-body"), 0.98, true);
      mesh = new THREE.Mesh(geo, mat);
    } else if (n.kind === "interface"){
      geo = new THREE.CylinderGeometry(S*0.82, S*0.82, S*0.3, 6);
      mat = mkMat(cv("--gl-iface"), 0.98, true);
      mesh = new THREE.Mesh(geo, mat);
      orientY(mesh, n.base.clone().normalize());
    } else {
      var op = n.orphan ? 0.34 : 0.95;
      lineOp = n.orphan ? 0.18 : 0.38;
      var ek = n.t.env_kind;
      if (ek === "Source"){
        geo = new THREE.ConeGeometry(S*0.78, S*1.35, 4);
        mat = mkMat(cv("--gl-env"), op, true);
        mesh = new THREE.Mesh(geo, mat);
        orientY(mesh, n.base.clone().negate());
      } else if (ek === "Sink"){
        geo = new THREE.ConeGeometry(S*0.78, S*1.35, 4);
        mat = mkMat(cv("--gl-env"), op, true);
        mesh = new THREE.Mesh(geo, mat);
        orientY(mesh, n.base.clone());
      } else {
        geo = new THREE.OctahedronGeometry(S*0.78, 0);
        mat = mkMat(cv("--gl-env"), op, true);
        mesh = new THREE.Mesh(geo, mat);
      }
    }
    mesh.userData.nodeId = n.id;
    g.add(mesh);

    var em = mkLineMat(lineCol, lineOp);
    var edges = new THREE.LineSegments(new THREE.EdgesGeometry(geo, 25), em);
    edges.quaternion.copy(mesh.quaternion);
    g.add(edges);

    g.position.copy(n.base);
    bodyGroup.add(g);
    n.group = g; n.mesh = mesh;
    pickables.push(mesh);

    var cls = (n.kind === "env") ? "env" : (n.kind === "interface" ? "iface" : "");
    if (n.orphan) cls += " orphan";
    var rank = (n.kind === "env") ? 2 : 1;
    n.label = addLabel(n.t.name || String(n.id), cls, (function(nn){
      return function(){ return nn.pos.clone().add(new THREE.Vector3(0, nn.radius*1.45, 0)); };
    })(n), rank);
  });

  /* ports */
  var portCol = cv("--gl-port");
  L.ports.forEach(function(p){
    var g = new THREE.Group();
    var nrm = p.base.clone().normalize();

    var ringMat = mkMat(portCol, 0.95, false);
    var ring = new THREE.Mesh(new THREE.TorusGeometry(S*0.52, S*0.085, 8, 22), ringMat);
    orientZ(ring, nrm);
    g.add(ring);

    var discMat = mkMat(portCol, 0.4, false);
    var disc = new THREE.Mesh(new THREE.CylinderGeometry(S*0.46, S*0.46, S*0.14, 20), discMat);
    orientY(disc, nrm);
    g.add(disc);

    if (p.direction === "Receives" || p.direction === "Exports"){
      var dir = (p.direction === "Exports") ? nrm.clone() : nrm.clone().negate();
      var cMat = mkMat(portCol, 0.95, true);
      var cone = new THREE.Mesh(new THREE.ConeGeometry(S*0.26, S*0.5, 10), cMat);
      orientY(cone, dir);
      cone.position.copy(dir.clone().multiplyScalar(S*0.42));
      g.add(cone);
    } else {
      var bMat = mkMat(portCol, 0.95, true);
      var both = new THREE.Mesh(new THREE.OctahedronGeometry(S*0.24, 0), bMat);
      g.add(both);
    }

    g.position.copy(p.base);
    portGroup.add(g);
    p.group = g;

    if (p.protocol){
      p.label = addLabel(p.protocol, "port", (function(pp){
        return function(){ return pp.pos.clone().multiplyScalar(1.0).add(pp.pos.clone().normalize().multiplyScalar(S*0.7)); };
      })(p), 1.4);
      p.label.visible = false;
    }
  });

  /* flow labels are created per rebuild of flows, so create holders now */
  L.flows.forEach(function(f){
    var r = f.rel;
    var kc = cv(kindVar(r.kind));
    var txt = r.name || "";
    if (r.ample === true) txt = txt ? (txt + " · ample") : "ample";
    else if (r.amount != null && r.amount !== ""){
      txt = (txt ? txt + " · " : "") + r.amount + (r.unit ? " " + r.unit : "") + (L.timeUnit ? " / " + L.timeUnit : "");
    }
    if (!txt) txt = r.kind || "flow";
    f.labelPos = new THREE.Vector3();
    f.label = addLabel(txt, "flow", (function(ff){ return function(){ return ff.labelPos; }; })(f), 3, kc);
    f.label.visible = false;
  });

  buildFlows();
  applyExplode();
  measureLabels();
  applySelection();
  updateHeader(model);
  fit();
  requestRender();
}

/* ------------------------------------------------------------------ flows */
function buildFlows(){
  if (!L || !flowGroup) return;
  disposeChildren(flowGroup);
  disposeChildren(markerGroup);
  markers = [];

  var R = L.Rmean;
  var baseR = R * 0.0072;
  var markerGeoCache = new THREE.SphereGeometry(R*0.013, 8, 6);

  L.flows.forEach(function(f){
    var r = f.rel;
    var na = L.nodes.get(r.a), nb = L.nodes.get(r.b);
    if (!na || !nb) return;

    var A = na.pos.clone(), B = nb.pos.clone();
    var isBond = (r.is_bond !== false);
    var ample = (r.ample === true);
    var amtNum = (r.amount != null && r.amount !== "") ? parseFloat(r.amount) : NaN;
    var declared = !ample && isFinite(amtNum);
    var undeclared = isBond && !ample && !declared;

    var radius;
    if (!isBond) radius = baseR*0.3;
    else if (declared) radius = baseR*(0.55 + 1.55*L.normAmount(amtNum));
    else if (ample) radius = baseR*1.0;
    else radius = baseR*0.5;
    var headLen = Math.max(radius*3.6, R*0.026);
    var headRad = Math.max(radius*1.9, R*0.013);

    /* crossing route through the port */
    var via = null;
    if (roleOf(na.t) !== roleOf(nb.t)){
      var compId = (roleOf(na.t) === "Component") ? r.a : r.b;
      var envId  = (compId === r.a) ? r.b : r.a;
      if (!L.ifaceSet.has(compId)){
        var p = L.portByPair.get(compId + ">" + envId);
        if (p) via = p.pos.clone();
      }
    }

    var axis = B.clone().sub(A);
    var len = Math.max(axis.length(), 1e-4);
    var ax = axis.clone().normalize();
    var up = new THREE.Vector3(0,1,0);
    if (Math.abs(ax.dot(up)) > 0.92) up.set(0,0,1);
    var n1 = new THREE.Vector3().crossVectors(ax, up).normalize();
    var n2 = new THREE.Vector3().crossVectors(ax, n1).normalize();
    var k = (f.count > 1) ? (f.idx - (f.count-1)/2) : 0;
    var sep = R*0.09;
    var off = n1.clone().multiplyScalar(k*sep).addScaledVector(n2, k*sep*0.4);

    var mid = A.clone().add(B).multiplyScalar(0.5);
    var bowDir = mid.clone();
    if (bowDir.lengthSq() < 1e-6) bowDir.copy(n2);
    bowDir.normalize();

    var pts;
    if (via){
      var m1 = A.clone().lerp(via, 0.55).add(off.clone().multiplyScalar(0.7));
      var m2 = via.clone().lerp(B, 0.45).add(off.clone().multiplyScalar(0.7));
      pts = [A, m1, via.clone().addScaledVector(off, 0.22), m2, B];
    } else {
      pts = [A, mid.clone().addScaledVector(bowDir, len*0.10).add(off), B];
    }

    /* trim to body surfaces, leave room for the head */
    var d0 = pts[1].clone().sub(pts[0]);
    if (d0.lengthSq() > 1e-8){ d0.normalize(); pts[0] = pts[0].clone().addScaledVector(d0, na.radius*1.12); }
    var last = pts.length-1;
    var dn = pts[last].clone().sub(pts[last-1]);
    if (dn.lengthSq() > 1e-8){ dn.normalize(); pts[last] = pts[last].clone().addScaledVector(dn, -(nb.radius*1.12 + headLen*0.9)); }

    var curve = new THREE.CatmullRomCurve3(pts, false, "catmullrom", 0.5);
    var kc = cv(kindVar(r.kind));
    var holder = new THREE.Group();
    holder.userData.relId = r.id;

    if (!isBond){
      var lm = mkLineMat(kc, 0.34);
      var lg = new THREE.BufferGeometry().setFromPoints(curve.getPoints(40));
      holder.add(new THREE.Line(lg, lm));
    } else if (undeclared){
      var dm = new THREE.LineDashedMaterial({
        color: new THREE.Color(kc), transparent:true, opacity:0.78,
        dashSize: R*0.035, gapSize: R*0.03
      });
      dm.userData.base = 0.78;
      var dg = new THREE.BufferGeometry().setFromPoints(curve.getPoints(60));
      var dl = new THREE.Line(dg, dm);
      dl.computeLineDistances();
      holder.add(dl);
    } else {
      var tm = mkMat(kc, 0.94, false);
      tm.roughness = 0.5;
      var tg = new THREE.TubeGeometry(curve, 44, radius, 7, false);
      holder.add(new THREE.Mesh(tg, tm));
    }

    /* arrowhead */
    var tEnd = 0.999;
    var hp = curve.getPointAt(tEnd);
    var ht = curve.getTangentAt(tEnd);
    var hm = mkMat(kc, isBond ? 0.94 : 0.38, true);
    var head = new THREE.Mesh(new THREE.ConeGeometry(headRad, headLen, 12), hm);
    orientY(head, ht);
    head.position.copy(hp).addScaledVector(ht.clone().normalize(), headLen*0.5);
    holder.add(head);

    flowGroup.add(holder);
    f.holder = holder;
    f.curve = curve;
    if (f.labelPos) f.labelPos.copy(curve.getPointAt(0.5));

    /* texture marker (motion only, not data) */
    var mm = mkMat(kc, 0.95, false);
    var marker = new THREE.Mesh(markerGeoCache.clone(), mm);
    marker.position.copy(curve.getPointAt(0.05));
    markerGroup.add(marker);
    markers.push({
      mesh: marker, curve: curve,
      len: Math.max(curve.getLength(), 0.001),
      phase: hash01(String(r.id) + "#m") * 40,
      relId: r.id, rel: r
    });
  });

  markerGeoCache.dispose();
  markerGroup.visible = state.texture && !reduceMotion;
}

/* ------------------------------------------------------------------ explode */
function applyExplode(){
  if (!L) return;
  var t = state.explode;
  var EX = L.Rmean * 0.58;
  var shellScale = 1 + t * (EX / L.Rmean);
  shellGroup.scale.setScalar(shellScale);

  L.nodes.forEach(function(n){
    if (n.onShell){
      n.pos.copy(n.base).multiplyScalar(shellScale);
    } else {
      var dir = n.base.clone();
      if (dir.lengthSq() < 1e-9) dir.set(0,1,0);
      dir.normalize();
      var f = (n.kind === "env") ? 1.3 : 1.0;
      n.pos.copy(n.base).addScaledVector(dir, t*EX*f);
    }
    if (n.group) n.group.position.copy(n.pos);
  });
  L.ports.forEach(function(p){
    p.pos.copy(p.base).multiplyScalar(shellScale);
    if (p.group) p.group.position.copy(p.pos);
  });
  buildFlows();
  applySelection();
}

/* ------------------------------------------------------------------ selection */
function applySelection(){
  if (!L) return;
  var sel = state.selected;
  var near = sel && L.neighbours.get(sel) ? L.neighbours.get(sel) : null;

  L.nodes.forEach(function(n){
    var active = !sel || (near && near.has(n.id));
    setDim(n.group, !active);
    if (n.label){
      n.label.el.classList.toggle("dim", !active);
      n.label.el.classList.toggle("sel", sel === n.id);
      n.label.rank = (sel && n.id === sel) ? 0 : (active ? (n.kind === "env" ? 1.8 : 0.9) : (n.kind === "env" ? 2.6 : 2.2));
    }
  });

  L.ports.forEach(function(p){
    var active = !sel || p.component === sel || p.env === sel;
    setDim(p.group, !active);
    if (p.label) p.label.visible = !!(sel && active);
  });

  L.flows.forEach(function(f){
    var r = f.rel;
    var active = !sel || r.a === sel || r.b === sel;
    setDim(f.holder, !active);
    if (f.label){
      f.label.visible = state.flowLabels || (r.ample === true) || (sel && active);
      f.label.el.classList.toggle("dim", !active);
      f.label.rank = active && sel ? 1.2 : 3;
    }
  });

  markers.forEach(function(m){
    m.mesh.visible = !sel || m.rel.a === sel || m.rel.b === sel;
  });

  updatePanel();
}

function neighbourName(id){
  var n = L.nodes.get(id);
  return n ? (n.t.name || String(id)) : String(id);
}
function amountText(r){
  if (r.ample === true) return "ample";
  if (r.amount == null || r.amount === "") return "undeclared";
  return r.amount + (r.unit ? " " + r.unit : "") + (L.timeUnit ? " / " + L.timeUnit : "");
}
function hidePanel(){
  var p = $("#panel");
  if (p) p.hidden = true;
}
function updatePanel(){
  var p = $("#panel");
  if (!L || !state.selected){ p.hidden = true; return; }
  var n = L.nodes.get(state.selected);
  if (!n){ p.hidden = true; return; }
  p.hidden = false;
  $("#pName").textContent = n.t.name || String(n.id);

  var meta = [];
  meta.push(roleOf(n.t) === "Environment" ? "environment" : "component");
  if (n.kind === "interface") meta.push("interface");
  if (roleOf(n.t) === "Environment" && n.t.env_kind) meta.push(String(n.t.env_kind).toLowerCase());
  if (n.orphan) meta.push("no flow to the system");
  $("#pMeta").textContent = meta.join(" · ");

  var ports = L.ports.filter(function(pt){ return pt.component === n.id || pt.env === n.id; });
  var pp = $("#pPorts");
  pp.innerHTML = "";
  ports.forEach(function(pt){
    var d = document.createElement("div");
    var other = (pt.component === n.id) ? neighbourName(pt.env) : neighbourName(pt.component);
    d.textContent = "port · " + (pt.protocol || "—") + " · " + String(pt.direction).toLowerCase() + " · " + other;
    pp.appendChild(d);
  });

  var ul = $("#pFlows");
  ul.innerHTML = "";
  var rels = L.relations.filter(function(r){ return r.a === n.id || r.b === n.id; });
  rels.forEach(function(r){
    var li = document.createElement("li");
    if (r.is_bond === false) li.className = "mere";
    var dot = document.createElement("span");
    dot.className = "dot";
    dot.style.background = cv(kindVar(r.kind));
    var nm = document.createElement("span");
    nm.className = "nm";
    var dirSym = (r.a === n.id) ? " → " : " ← ";
    var other = (r.a === n.id) ? r.b : r.a;
    nm.textContent = (r.name || (r.kind || "flow")) + dirSym + neighbourName(other);
    nm.title = (r.kind || "") + (r.substance ? " · " + r.substance : "");
    var am = document.createElement("span");
    var txt = amountText(r);
    am.className = "am" + (txt === "undeclared" ? " undeclared" : "");
    am.textContent = txt;
    li.appendChild(dot); li.appendChild(nm); li.appendChild(am);
    ul.appendChild(li);
  });
  $("#pEmpty").hidden = rels.length > 0;
}

/* ------------------------------------------------------------------ camera */
function updateCamera(){
  if (!camera) return;
  var st = Math.sin(orbit.phi);
  camera.position.set(
    orbit.target.x + orbit.radius * st * Math.sin(orbit.theta),
    orbit.target.y + orbit.radius * Math.cos(orbit.phi),
    orbit.target.z + orbit.radius * st * Math.cos(orbit.theta)
  );
  camera.lookAt(orbit.target);
}
function fit(){
  if (!rootGroup || !camera) return;
  var box = new THREE.Box3().setFromObject(rootGroup);
  if (box.isEmpty()) return;
  var sph = box.getBoundingSphere(new THREE.Sphere());
  orbit.target.copy(sph.center);
  var vFov = camera.fov * Math.PI/180;
  var hFov = 2*Math.atan(Math.tan(vFov/2) * Math.max(camera.aspect, 0.25));
  var d = Math.max(sph.radius/Math.sin(vFov/2), sph.radius/Math.sin(hFov/2));
  orbit.radius = Math.max(d*1.1, 1);
  updateCamera();
}
function home(){
  orbit.theta = -0.95; orbit.phi = 1.14;
  fit();
  requestRender();
}

/* ------------------------------------------------------------------ render */
function requestRender(){
  if (rafId !== null) return;
  rafId = requestAnimationFrame(frame);
}
function frame(ts){
  rafId = null;
  render(ts);
  if (state.texture && !reduceMotion) requestRender();
}
function updateMarkers(now){
  if (!L) return;
  var speed = L.Rmean * 0.5;
  var t = now * 0.001;
  for (var i=0;i<markers.length;i++){
    var m = markers[i];
    var u = ((t*speed + m.phase) % m.len) / m.len;
    u = Math.min(0.998, Math.max(0.002, u));
    m.mesh.position.copy(m.curve.getPointAt(u));
  }
}
function render(ts){
  if (!renderer || !scene || !camera) return;
  if (state.texture && !reduceMotion) updateMarkers(ts || performance.now());
  updateCamera();
  renderer.render(scene, camera);
  updateLabels();
}

/* ------------------------------------------------------------------ input */
var pointers = new Map();
var dragMoved = 0, pinchStart = 0, pinchRadius = 0;

function onPointerDown(e){
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x:e.clientX, y:e.clientY });
  dragMoved = 0;
  canvas.classList.add("dragging");
  if (pointers.size === 2){
    var p = Array.from(pointers.values());
    pinchStart = Math.hypot(p[0].x-p[1].x, p[0].y-p[1].y);
    pinchRadius = orbit.radius;
  }
}
function onPointerMove(e){
  if (!pointers.has(e.pointerId)) return;
  var prev = pointers.get(e.pointerId);
  var dx = e.clientX - prev.x, dy = e.clientY - prev.y;
  pointers.set(e.pointerId, { x:e.clientX, y:e.clientY });
  dragMoved += Math.abs(dx) + Math.abs(dy);

  if (pointers.size === 2){
    var p = Array.from(pointers.values());
    var d = Math.hypot(p[0].x-p[1].x, p[0].y-p[1].y);
    if (pinchStart > 0 && d > 0) setRadius(pinchRadius * (pinchStart/d));
    requestRender();
    return;
  }
  orbit.theta -= dx * 0.0062;
  orbit.phi   -= dy * 0.0062;
  orbit.phi = Math.max(0.08, Math.min(Math.PI-0.08, orbit.phi));
  requestRender();
}
function onPointerUp(e){
  var wasSingle = pointers.size === 1;
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinchStart = 0;
  if (pointers.size === 0) canvas.classList.remove("dragging");
  if (wasSingle && dragMoved < 6) pick(e);
}
function setRadius(r){
  if (!L) { orbit.radius = r; return; }
  orbit.radius = Math.max(L.Rmean*0.55, Math.min(L.Rmean*16, r));
}
function onWheel(e){
  e.preventDefault();
  setRadius(orbit.radius * Math.exp(e.deltaY * 0.0013));
  requestRender();
}
function pick(e){
  if (!scene || !camera) return;
  var rect = canvas.getBoundingClientRect();
  var m = new THREE.Vector2(
    ((e.clientX - rect.left)/rect.width)*2 - 1,
    -((e.clientY - rect.top)/rect.height)*2 + 1
  );
  raycaster.setFromCamera(m, camera);
  var hits = raycaster.intersectObjects(pickables, false);
  var next = hits.length ? hits[0].object.userData.nodeId : null;
  if (next === state.selected && next != null) next = null;
  state.selected = (next == null) ? null : next;
  applySelection();
  requestRender();
}

/* ------------------------------------------------------------------ ui */
function updateHeader(model){
  var c = model.canvas || {};
  $("#mname").textContent = c.name || model.label || model.key || "model";
  var bits = [];
  if (c.lens) bits.push(c.lens);
  if (c.time_unit) bits.push("per " + c.time_unit);
  $("#mmeta").textContent = bits.join(" · ");
}
function buildModelButtons(){
  var wrap = $("#models");
  wrap.innerHTML = "";
  models.forEach(function(m, i){
    var b = document.createElement("button");
    b.type = "button";
    b.textContent = m.label || m.key || ("model " + (i+1));
    b.setAttribute("aria-pressed", String(i === state.modelIndex));
    b.addEventListener("click", function(){ setModel(i); });
    wrap.appendChild(b);
  });
}
function syncModelButtons(){
  var bs = $("#models").children;
  for (var i=0;i<bs.length;i++) bs[i].setAttribute("aria-pressed", String(i === state.modelIndex));
}
function setModel(i){
  if (!models[i]) return;
  state.modelIndex = i;
  syncModelButtons();
  buildScene(models[i]);
}

function initRenderer(){
  canvas = $("#gl");
  try {
    renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: false, powerPreference: "default" });
  } catch(err){ return false; }
  if (!renderer || !renderer.getContext || !renderer.getContext()) return false;
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  camera = new THREE.PerspectiveCamera(42, 1, 0.1, 6000);
  resize();

  canvas.addEventListener("webglcontextlost", function(e){
    e.preventDefault();
    if (rafId !== null){ cancelAnimationFrame(rafId); rafId = null; }
    showNotice("The graphics context was lost. Reload the page to restore the view.");
  }, false);
  canvas.addEventListener("webglcontextrestored", function(){
    hideNotice();
    if (models[state.modelIndex]) buildScene(models[state.modelIndex]);
  }, false);

  canvas.addEventListener("pointerdown", onPointerDown);
  canvas.addEventListener("pointermove", onPointerMove);
  canvas.addEventListener("pointerup", onPointerUp);
  canvas.addEventListener("pointercancel", onPointerUp);
  canvas.addEventListener("wheel", onWheel, { passive:false });
  return true;
}

function resize(){
  if (!renderer || !camera) return;
  var w = stageEl.clientWidth || 1, h = stageEl.clientHeight || 1;
  renderer.setSize(w, h, false);
  camera.aspect = w/h;
  camera.updateProjectionMatrix();
  requestRender();
}

function wireUI(){
  stageEl = $("#stage");
  labelsEl = $("#labels");

  $("#themeBtn").addEventListener("click", function(){
    manualTheme = (currentTheme() === "dark") ? "light" : "dark";
    applyTheme();
    if (models[state.modelIndex] && scene){
      var keep = { theta:orbit.theta, phi:orbit.phi, radius:orbit.radius, target:orbit.target.clone(), sel:state.selected };
      buildScene(models[state.modelIndex]);
      orbit.theta = keep.theta; orbit.phi = keep.phi; orbit.radius = keep.radius; orbit.target.copy(keep.target);
      if (keep.sel && L.nodes.has(keep.sel)){ state.selected = keep.sel; applySelection(); }
      requestRender();
    }
  });

  var slider = $("#explode"), out = $("#explodeOut");
  slider.addEventListener("input", function(){
    state.explode = num(slider.value)/100;
    out.textContent = slider.value + "%";
    applyExplode();
    requestRender();
  });

  $("#homeBtn").addEventListener("click", home);

  $("#flowLabelsChk").addEventListener("change", function(e){
    state.flowLabels = e.target.checked;
    applySelection();
    requestRender();
  });

  var tex = $("#textureChk");
  if (reduceMotion){ tex.checked = false; tex.disabled = true; }
  tex.addEventListener("change", function(e){
    if (reduceMotion){ e.target.checked = false; return; }
    state.texture = e.target.checked;
    if (markerGroup) markerGroup.visible = state.texture;
    requestRender();
  });

  $("#panelClose").addEventListener("click", function(){
    state.selected = null; applySelection(); requestRender();
  });

  document.addEventListener("keydown", function(e){
    if (e.key === "Escape"){
      if (state.selected != null){ state.selected = null; applySelection(); requestRender(); }
      return;
    }
    var tag = (e.target && e.target.tagName) || "";
    if (tag === "INPUT" || tag === "SELECT" || tag === "TEXTAREA") return;
    var step = 0.085;
    if (e.key === "ArrowLeft"){ orbit.theta += step; }
    else if (e.key === "ArrowRight"){ orbit.theta -= step; }
    else if (e.key === "ArrowUp"){ orbit.phi = Math.max(0.08, orbit.phi - step*0.8); }
    else if (e.key === "ArrowDown"){ orbit.phi = Math.min(Math.PI-0.08, orbit.phi + step*0.8); }
    else return;
    e.preventDefault();
    requestRender();
  });

  window.addEventListener("resize", resize);
  if (window.ResizeObserver){
    new ResizeObserver(resize).observe(stageEl);
  }
  if (mqDark.addEventListener){
    mqDark.addEventListener("change", function(){
      if (manualTheme) return;
      applyTheme();
      if (models[state.modelIndex]) buildScene(models[state.modelIndex]);
    });
  }
  if (document.fonts && document.fonts.ready){
    document.fonts.ready.then(function(){ measureLabels(); requestRender(); });
  }
}

/* ------------------------------------------------------------------ boot */
function init(){
  applyTheme();
  wireUI();

  var data = loadFixture();
  models = Array.isArray(data.models) ? data.models.filter(Boolean) : [];

  if (!models.length){
    document.body.classList.add("nodata");
    showNotice("No model in the fixture. Add one to the #fixture script block to draw it here.");
    return;
  }
  if (typeof THREE === "undefined"){
    showNotice("The 3D library did not load. Check the network connection and reload.");
    return;
  }
  if (!initRenderer()){
    showNotice("WebGL is unavailable in this browser, so the 3D view cannot be drawn.");
    return;
  }
  hideNotice();
  buildModelButtons();
  setModel(0);
}

if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
else init();

})();
</script>
</body>
