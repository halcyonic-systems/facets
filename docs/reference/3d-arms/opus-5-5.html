<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Facets · exploded view</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f1f2f3;--ink:#17181a;--muted:#5d6670;--accent:#3d6373;--accent-strong:#2a4b59;--hairline:#e5ecf0;
  --line:var(--hairline);--line2:var(--hairline);--lbg:var(--paper);--lbg2:var(--paper);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --paper:#16181a;--ink:#e8eaec;--muted:#8e979f;--accent:#6fa5b8;--accent-strong:#95c3d3;--hairline:#2a2f33;
  color-scheme:dark;
}
@supports (color: color-mix(in srgb, red 50%, blue)){
  :root{
    --line:color-mix(in srgb,var(--ink) 13%,var(--paper));
    --line2:color-mix(in srgb,var(--ink) 24%,var(--paper));
    --lbg:color-mix(in srgb,var(--paper) 88%,transparent);
    --lbg2:color-mix(in srgb,var(--paper) 72%,transparent);
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:var(--paper);color:var(--ink);
  font:13px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;width:100%;max-width:100vw;overflow:hidden}
#top{flex:none;height:46px;display:flex;align-items:center;gap:8px;padding:0 10px;border-bottom:1px solid var(--line);min-width:0}
#title{flex:1 1 auto;min-width:0;display:flex;align-items:baseline;gap:10px;overflow:hidden}
#mname{font-family:"Cormorant Garamond",Georgia,"Times New Roman",serif;font-weight:600;font-size:22px;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
#lens{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
@media (max-width:520px){#lens{display:none}}
select,button{font:inherit;font-size:12px;color:var(--ink);background:var(--paper);border:1px solid var(--line2);border-radius:4px;height:28px;padding:0 8px}
select{max-width:42vw;min-width:0}
button{cursor:pointer;white-space:nowrap}
button:hover:not(:disabled),select:hover:not(:disabled){border-color:var(--accent)}
button:disabled,select:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
#stage{position:relative;flex:1 1 auto;min-height:0;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;outline:none}
#stage canvas{position:absolute;inset:0;display:block;width:100%;height:100%}
#leaders{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
#leaders line{stroke:var(--muted);stroke-width:.75;opacity:.6}
#leaders line.dim{opacity:.15}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:1}
.lab,.flab,.plab{position:absolute;left:0;top:0;white-space:nowrap;visibility:hidden;will-change:transform}
.lab{pointer-events:auto;cursor:pointer;font-size:11.5px;line-height:15px;padding:1px 5px;border-radius:3px;color:var(--ink);background:var(--lbg);border:1px solid var(--line)}
.lab.env{color:var(--muted)}
.lab.iface{color:var(--accent-strong)}
.lab.orphan{opacity:.5}
.lab.dim{opacity:.25}
.lab.sel{border-color:var(--accent-strong);color:var(--accent-strong)}
.flab{font-size:10.5px;line-height:13px;padding:0 3px;color:var(--muted);background:var(--lbg2);border-radius:2px;pointer-events:none}
.flab i{display:inline-block;width:8px;height:2px;margin-right:4px;vertical-align:middle}
.flab.quiet{font-style:italic;opacity:.8}
.plab{font-size:10px;line-height:13px;padding:0 5px;color:var(--accent-strong);border:1px solid var(--accent);border-radius:7px;background:var(--lbg);pointer-events:none}
#legend{position:absolute;left:10px;top:8px;display:flex;flex-direction:column;gap:3px;font-size:10.5px;color:var(--muted);pointer-events:none;max-width:calc(100% - 20px);z-index:2}
.lg-row{display:flex;flex-wrap:wrap;gap:2px 10px}
.lg{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.ln{display:inline-block;width:14px;height:3px;border-radius:1px;background:var(--c)}
.ln.dash{background:repeating-linear-gradient(90deg,var(--muted) 0 4px,transparent 4px 7px)}
.ln.thin{height:1px;background:var(--muted);opacity:.8}
.sh{display:inline-block;width:9px;height:9px}
.sh.comp{border-radius:50%;background:var(--ink)}
.sh.iface{width:11px;height:5px;border-radius:2px;background:var(--accent)}
.sh.src{width:7px;height:7px;background:var(--muted);transform:rotate(45deg)}
.sh.sink{width:8px;height:8px;background:var(--muted)}
.sh.neu{border-radius:50%;border:1.5px solid var(--muted)}
.sh.port{border-radius:50%;border:1.5px solid var(--accent-strong)}
#panel{position:absolute;top:10px;right:10px;width:290px;max-height:calc(100% - 20px);overflow:auto;background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:10px 12px;font-size:12px;touch-action:pan-y;z-index:3;user-select:text;-webkit-user-select:text;cursor:auto}
@media (max-width:600px){#panel{top:auto;bottom:8px;left:8px;right:8px;width:auto;max-height:44%}}
.ph{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.pn{font-size:14px;font-weight:600;color:var(--ink);word-break:break-word}
.pr{font-size:11px;color:var(--muted);margin-top:1px}
.px{height:24px;width:24px;padding:0;line-height:1;font-size:16px;border-color:transparent;color:var(--muted);flex:none}
.pl{list-style:none;margin:8px 0 0;padding:6px 0 0;border-top:1px solid var(--line)}
.pl li{display:flex;gap:8px;align-items:flex-start;padding:3px 0}
.sw{flex:none;width:14px;height:3px;margin-top:7px;border-radius:1px;background:var(--c)}
.sw.dash{background:repeating-linear-gradient(90deg,var(--c) 0 4px,transparent 4px 7px)}
.sw.port{height:9px;width:9px;margin-top:3px;border:1.5px solid var(--accent-strong);border-radius:50%;background:transparent}
.fn{font-size:12px;color:var(--ink);word-break:break-word}
.fm{font-size:11px;color:var(--muted);word-break:break-word}
.pe{font-size:11px;color:var(--muted);margin-top:8px}
#msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;color:var(--muted);font-size:14px;background:var(--paper);z-index:5}
#strip{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;padding:6px 10px calc(6px + env(safe-area-inset-bottom));border-top:1px solid var(--line);min-width:0}
.exp{display:flex;align-items:center;gap:8px;flex:1 1 170px;min-width:0;font-size:12px;color:var(--muted)}
.exp input{flex:1 1 auto;min-width:60px;accent-color:var(--accent);margin:0}
.exp output{width:36px;text-align:right;font-variant-numeric:tabular-nums;color:var(--ink)}
.tex{display:flex;flex-direction:column;gap:1px;font-size:12px;min-width:0}
.tex label{display:flex;align-items:center;gap:6px;color:var(--ink);cursor:pointer}
.tex input{accent-color:var(--accent);margin:0}
.tex input:disabled{cursor:default}
.tex .note{font-size:10.5px;color:var(--muted)}
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <div id="title"><span id="mname">Facets</span><span id="lens"></span></div>
    <select id="modelSel" aria-label="model"></select>
    <button id="themeBtn" type="button" title="toggle theme">light</button>
  </header>
  <main id="stage" tabindex="0" aria-label="exploded view">
    <svg id="leaders" aria-hidden="true"></svg>
    <div id="labels"></div>
    <div id="legend"></div>
    <aside id="panel" hidden></aside>
    <div id="msg" hidden></div>
  </main>
  <footer id="strip">
    <button id="fitBtn" type="button" title="fit (Home)">fit</button>
    <label class="exp"><span>explode</span><input id="explode" type="range" min="0" max="100" step="1" value="0" aria-label="explode"><output id="expv">0%</output></label>
    <div class="tex">
      <label><input type="checkbox" id="texture"><span>texture</span></label>
      <div class="note">Motion along flows is texture, not data.</div>
    </div>
  </footer>
</div>

/* ---------- geometry helpers ---------- */
function ellN(p,A,B,C){ return new V3(p.x/(A*A),p.y/(B*B),p.z/(C*C)).normalize(); }
function rho0(d){ return 1/Math.sqrt((d.x/S.a)**2+(d.y/S.b)**2+(d.z/S.c)**2); }

function tubeGeometry(pts,r,dash,gap){
  const pieces=[];
  if(!dash){ pieces.push(pts); }
  else{
    let on=true, ph=0, cur=[pts[0].clone()];
    for(let i=1;i<pts.length;i++){
      const p0=pts[i-1], p1=pts[i], L=p0.distanceTo(p1); let t=0;
      while(L-t>1e-9){
        const lim=(on?dash:gap)-ph;
        if(L-t<=lim){ ph+=L-t; t=L; if(on) cur.push(p1.clone()); }
        else{ t+=lim; const q=p0.clone().lerp(p1,t/L); if(on){ cur.push(q); if(cur.length>1) pieces.push(cur); cur=[]; } else { cur=[q]; } on=!on; ph=0; }

    }

      else{ N.addScaledVector(T,-N.dot(T)); if(N.lengthSq()<1e-12) N.crossVectors(T,Math.abs(T.x)<0.9?AX:AY); N.normalize(); }
      Bn.crossVectors(T,N);
      const p=pc[i];
      for(let j=0;j<RS;j++){ const an=j/RS*Math.PI*2, cs=Math.cos(an)*r, sn=Math.sin(an)*r;
        pos.push(p.x+N.x*cs+Bn.x*sn,p.y+N.y*cs+Bn.y*sn,p.z+N.z*cs+Bn.z*sn); }
      if(i>0){ const o0=vb+(i-1)*RS, o1=vb+i*RS; for(let j=0;j<RS;j++){ const j2=(j+1)%RS; idx.push(o0+j,o1+j,o0+j2,o0+j2,o1+j,o1+j2); } }
    }
    vb+=n*RS;
  }

}

function circleGeo(axis){
  const a=[]; for(let i=0;i<160;i++){ const t=i/160*Math.PI*2, c=Math.cos(t), s=Math.sin(t);
    if(axis==='y') a.push(c,0,s); else if(axis==='z') a.push(c,s,0); else a.push(0,c,s); }

}
function dotTex(){
  const c=document.createElement('canvas'); c.width=c.height=32; const x=c.getContext('2d');
  const g=x.createRadialGradient(16,16,0,16,16,15); g.addColorStop(0,'rgba(255,255,255,1)'); g.addColorStop(0.55,'rgba(255,255,255,1)'); g.addColorStop(1,'rgba(255,255,255,0)');

}
const VS='varying vec3 vN;varying vec3 vV;void main(){vec4 mv=modelViewMatrix*vec4(position,1.0);vN=normalize(normalMatrix*normal);vV=normalize(-mv.xyz);gl_Position=projectionMatrix*mv;}';

/* ---------- scene lifecycle ---------- */
function disposeScene(){
  if(!S) return;
  const geos=new Set(), mats=new Set(), texs=new Set();
  S.root.traverse(o=>{ if(o.geometry) geos.add(o.geometry); if(o.material){ (Array.isArray(o.material)?o.material:[o.material]).forEach(m=>{ mats.add(m); if(m.map) texs.add(m.map); }); } });

  geos.forEach(g=>g.dispose()); mats.forEach(m=>m.dispose()); texs.forEach(t=>t.dispose());
  scene.remove(S.root);
  labelsEl.innerHTML=''; leaders.innerHTML=''; legendEl.innerHTML='';
  S=null;
}

function buildModel(idx,keep){
  const prevSel=keep?selected:null;
  disposeScene();
  current=idx; modelSel.value=String(idx);
  const M=models[idx]||{}; const cv=M.canvas||{}; const F=M.facts||{};
  mname.textContent=cv.name||M.label||M.key||'Model';
  const lb=[]; if(cv.lens) lb.push(cv.lens); if(cv.time_unit) lb.push('per '+cv.time_unit); lensEl.textContent=lb.join(' · ');
  const things=(cv.things||[]).filter(t=>t&&t.id!=null);
  const rels=Array.isArray(cv.relations)?cv.relations.filter(r=>r&&r.a!=null&&r.b!=null):[];
  const idset=v=>new Set((Array.isArray(v)?v:[]).map(String));
  const ifaceIds=Array.isArray(F.authored_interface_thing_ids)?idset(F.authored_interface_thing_ids):new Set(things.filter(t=>t.interface===true).map(t=>String(t.id)));
  const orphanIds=idset(F.orphan_env_thing_ids), boundaryIds=idset(F.boundary_thing_ids);

  const root=new THREE.Group(); scene.add(root);
  S={root,bodies:new Map(),flows:[],ports:[],pick:[],tu:cv.time_unit||'',a:4,b:4,c:4,dotCap:0,order:[]};
  S.hitMat=new THREE.MeshBasicMaterial();

  const dark=theme==='dark';
  root.add(new THREE.HemisphereLight(0xffffff,dark?0x303030:0x9a9a9a,dark?0.72:0.85));
  const dl=new THREE.DirectionalLight(0xffffff,dark?0.62:0.55); dl.position.set(-6,10,8); root.add(dl);
  const dl2=new THREE.DirectionalLight(0xffffff,0.18); dl2.position.set(8,-4,-6); root.add(dl2);

  function mkBody(t,kind){
    const id=String(t.id);
    const b={id,t,kind,name:(t.name!=null&&String(t.name).trim()!=='')?String(t.name):id,
      envKind:kind==='env'?(['Source','Sink','Neutral'].includes(t.env_kind)?t.env_kind:'Neutral'):null,
      base:new V3(),dir:new V3(0,0,1),pos:new V3(),radius:kind==='iface'?0.62:(kind==='env'?0.6:0.55),
      orphan:kind==='env'&&orphanIds.has(id),boundary:boundaryIds.has(id)};
    S.bodies.set(id,b); return b;
  }

  /* components at authored positions */
  const comps=things.filter(t=>t.role!=='Environment'), envs=things.filter(t=>t.role==='Environment');
  const fin=t=>t.x!=null&&t.y!=null&&Number.isFinite(+t.x)&&Number.isFinite(+t.y);
  let minx=Infinity,maxx=-Infinity,miny=Infinity,maxy=-Infinity;
  comps.filter(fin).forEach(t=>{ minx=Math.min(minx,+t.x); maxx=Math.max(maxx,+t.x); miny=Math.min(miny,+t.y); maxy=Math.max(maxy,+t.y); });

  const k=span>1e-6?12/span:1, cx=havePos?(minx+maxx)/2:0, cy=havePos?(miny+maxy)/2:0;
  let missing=0; const missCount=comps.filter(t=>!fin(t)).length;
  const cb=comps.map((t,i)=>{
    const b=mkBody(t,ifaceIds.has(String(t.id))?'iface':'comp');
    if(fin(t)&&havePos){ b.ax=(+t.x-cx)*k; b.ay=-(+t.y-cy)*k; }
    else{ const n=Math.max(1,missCount), an=(missing++)/n*Math.PI*2, rr=havePos?1.6:(comps.length>1?5:0); b.ax=Math.cos(an)*rr; b.ay=Math.sin(an)*rr; }
    return b;
  });

  cb.forEach(b=>{ if(b.kind==='comp'){ b.base.set(b.ax,b.ay,(hash(b.id)-0.5)*2*zs); if(b.base.lengthSq()>1e-8) b.dir.copy(b.base).normalize(); } });

  /* shell fit around interior components */
  const interior=cb.filter(b=>b.kind==='comp');
  let W=2,H=2,Z=1.5; interior.forEach(b=>{ W=Math.max(W,Math.abs(b.base.x)); H=Math.max(H,Math.abs(b.base.y)); Z=Math.max(Z,Math.abs(b.base.z)); });
  let a=W+1.8,bb=H+1.8,c=Z+2.0,q=0;
  interior.forEach(b=>{ const L=b.base.length(), s=L>1e-6?(L+0.9)/L:1; const x=b.base.x*s/a,y=b.base.y*s/bb,z=b.base.z*s/c; q=Math.max(q,Math.sqrt(x*x+y*y+z*z)); });
  if(q>0.8){ const f=q/0.8; a*=f; bb*=f; c*=f; }

  S.a=a; S.b=bb; S.c=c;

  /* environment banks: sources left, sinks right, neutral above */
  const eb=envs.map(t=>mkBody(t,'env'));
  const bank=(list,side)=>{
    const n=list.length; if(!n) return;
    list.sort((p,q)=>(num(p.t.y)-num(q.t.y))||p.name.localeCompare(q.name));
    const ra=a+GAPE, rb=bb+GAPE, rm=(ra+rb)/2; let total=(2.7/rm)*(n-1), stagger=false;
    if(total>2.2){ total=2.2; stagger=true; }
    list.forEach((b,i)=>{ const f=n===1?0:(0.5-i/(n-1)), ph=f*total; b.base.set(side*ra*Math.cos(ph),rb*Math.sin(ph),stagger?((i%2)?-1.8:1.8):0); });
  };
  bank(eb.filter(b=>b.envKind==='Source'),-1);

  });

  /* flows */
  rels.forEach((r,i)=>{
    const ia=String(r.a), ib=String(r.b), A=S.bodies.get(ia), B=S.bodies.get(ib);

  const pv=S.flows.filter(f=>f.declared&&isFinite(f.v)&&f.v>0).map(f=>f.v);
  const vmax=pv.length?Math.max.apply(null,pv):0;
  S.flows.forEach(f=>{
    f.dashed=!f.declared&&!f.ample;
    if(!f.bond){ f.r=0.024; f.baseOp=0.5; }
    else if(f.ample){ f.r=0.07; f.baseOp=0.92; }
    else if(!f.declared){ f.r=0.05; f.baseOp=0.85; }
    else if(isFinite(f.v)&&vmax>0){ f.r=0.045+0.14*Math.sqrt(Math.max(0,f.v)/vmax); f.baseOp=0.95; }
    else { f.r=0.08; f.baseOp=0.95; }
    f.ar=f.bond?Math.max(f.r*2.2,0.13):0.08;
    const ae=f.A.kind==='env', be=f.B.kind==='env';
    if(ae!==be){ const comp=ae?f.B:f.A, env=ae?f.A:f.B; const cand=S.ports.filter(p=>p.comp===comp&&p.env===env); f.port=cand.find(p=>p.relIds.has(f.id))||cand[0]||null; if(f.port) f.port.n++; }
  });
  const groups=new Map();
  S.flows.forEach(f=>{ const key=[f.a,f.b].sort().join('\u0001'); if(!groups.has(key)) groups.set(key,[]); groups.get(key).push(f); });
  groups.forEach(l=>{ l.sort((x,y)=>x.id<y.id?-1:x.id>y.id?1:0); l.forEach((f,i)=>{ f.gi=i; f.gn=l.length; }); });

  /* meshes: shell */
  const shell=new THREE.Group();
  const sg=new THREE.SphereGeometry(1,72,48);
  const back=new THREE.Mesh(sg,shellMat(THREE.BackSide,dark?0.025:0.02,dark?0.14:0.12)); back.renderOrder=-1;
  const front=new THREE.Mesh(sg,shellMat(THREE.FrontSide,dark?0.03:0.035,dark?0.32:0.3)); front.renderOrder=10;
  const lm=new THREE.LineBasicMaterial({color:P.accent,transparent:true,opacity:dark?0.34:0.3,depthWrite:false});
  ['y','z','x'].forEach(ax=>{ const l=new THREE.LineLoop(circleGeo(ax),lm); l.renderOrder=9; shell.add(l); });
  shell.add(back,front); root.add(shell); S.shell=shell;

  /* bodies */
  const G={comp:new THREE.SphereGeometry(0.55,40,24),iface:new THREE.CylinderGeometry(0.62,0.62,0.16,48),
    Source:new THREE.OctahedronGeometry(0.68),Sink:new THREE.BoxGeometry(0.88,0.88,0.88),Neutral:new THREE.IcosahedronGeometry(0.56,0),
    hit:new THREE.SphereGeometry(1,14,10)};
  S.bodies.forEach(b=>{
    let geo,mat;
    if(b.kind==='comp'){ geo=G.comp; mat=new THREE.MeshStandardMaterial({color:P.ink,roughness:0.5,metalness:0.05,transparent:true}); }
    else if(b.kind==='iface'){ geo=G.iface; mat=new THREE.MeshStandardMaterial({color:P.accent,roughness:0.45,metalness:0.05,transparent:true}); }
    else { geo=G[b.envKind]; mat=new THREE.MeshStandardMaterial({color:P.muted,roughness:0.7,metalness:0,flatShading:true,transparent:true}); }
    const m=new THREE.Mesh(geo,mat); m.renderOrder=2; m.userData.id=b.id;
    if(b.envKind==='Sink') m.rotation.set(0.35,0.6,0);
    root.add(m); b.mesh=m;
    const h=new THREE.Mesh(G.hit,S.hitMat); h.visible=false; h.scale.setScalar(b.radius*1.5); h.userData.id=b.id; root.add(h); b.hit=h; S.pick.push(h);
  });

  /* ports */
  S.ports.forEach(p=>{
    const r=Math.max(0.3,(p.n-1)*SEP/2+0.24); p.r=r;
    const grp=new THREE.Group();
    p.ringMat=new THREE.MeshBasicMaterial({color:P.strong,transparent:true,opacity:0.9,side:THREE.DoubleSide,depthWrite:false});
    p.discMat=new THREE.MeshBasicMaterial({color:P.accent,transparent:true,opacity:0.16,side:THREE.DoubleSide,depthWrite:false});
    const ring=new THREE.Mesh(new THREE.RingGeometry(r,r+0.075,56),p.ringMat), disc=new THREE.Mesh(new THREE.CircleGeometry(r,56),p.discMat);
    ring.renderOrder=6; disc.renderOrder=5; grp.add(disc,ring); root.add(grp); p.grp=grp;
  });

  /* flow meshes */
  const cone=new THREE.ConeGeometry(1,1,16,1); cone.translate(0,0.5,0);
  S.flows.forEach(f=>{
    f.mat=new THREE.MeshBasicMaterial({color:f.color,transparent:true,opacity:f.baseOp,side:THREE.DoubleSide});
    f.mesh=new THREE.Mesh(new THREE.BufferGeometry(),f.mat); f.mesh.renderOrder=3;
    f.arrow=new THREE.Mesh(cone,f.mat); f.arrow.renderOrder=3;
    f.col3=new THREE.Color(f.color);
    root.add(f.mesh,f.arrow);
  });

  /* selection ring */
  S.selRing=new THREE.Mesh(new THREE.RingGeometry(1,1.07,72),new THREE.MeshBasicMaterial({color:P.strong,transparent:true,opacity:0.95,depthTest:false,side:THREE.DoubleSide}));
  S.selRing.renderOrder=20; S.selRing.visible=false; root.add(S.selRing);

  /* texture dots */
  S.dots=new THREE.Points(new THREE.BufferGeometry(),new THREE.PointsMaterial({size:0.2,map:dotTex(),vertexColors:true,transparent:true,depthWrite:false,alphaTest:0.1,sizeAttenuation:true}));
  S.dots.renderOrder=4; S.dots.visible=texOn; root.add(S.dots);

  /* labels */
  S.bodies.forEach(b=>{
    const el=document.createElement('div');
    el.className='lab '+(b.kind==='env'?'env':b.kind)+(b.orphan?' orphan':'');
    el.textContent=b.name; el.dataset.id=b.id; el.title=b.name;
    labelsEl.appendChild(el); b.lab=el;
  });
  S.flows.forEach(f=>{
    const at=f.ample?'ample':(f.declared?amountText(f):'');
    const txt=f.name&&at?f.name+' · '+at:(f.name||at);
    if(!txt) return;
    const el=document.createElement('div'); el.className='flab'+(f.bond?'':' quiet');
    el.innerHTML='<i style="background:'+f.color+'"></i>'+esc(txt);
    labelsEl.appendChild(el); f.lab=el;
  });
  S.ports.forEach(p=>{
    const el=document.createElement('div'); el.className='plab';
    el.textContent=(p.protocol||'port')+(p.direction?' · '+p.direction.toLowerCase():'');
    labelsEl.appendChild(el); p.lab=el;
  });
  S.bodies.forEach(b=>{ b.lw=b.lab.offsetWidth; b.lh=b.lab.offsetHeight; });
  S.flows.forEach(f=>{ if(f.lab){ f.lw=f.lab.offsetWidth; f.lh=f.lab.offsetHeight; } });
  S.ports.forEach(p=>{ p.lw=p.lab.offsetWidth; p.lh=p.lab.offsetHeight; });

  buildLegend();
  layout();
  selected=(prevSel&&S.bodies.has(prevSel))?prevSel:null;
  applyIsolation(); renderPanel();
  if(!keep){ autoFit=true; fit(true); } else applyCam();
  requestRender();
}

function buildLegend(){
  const present=KINDS.filter(k=>S.flows.some(f=>f.kind===k));
  let h='<div class="lg-row">'+present.map(k=>'<span class="lg"><i class="ln" style="--c:'+kindColor(k)+'"></i>'+k+'</span>').join('');
  if(S.flows.some(f=>f.dashed)) h+='<span class="lg"><i class="ln dash"></i>undeclared</span>';
  if(S.flows.some(f=>!f.bond)) h+='<span class="lg"><i class="ln thin"></i>relation</span>';
  h+='</div><div class="lg-row"><span class="lg"><i class="sh comp"></i>component</span>';
  const has=fn=>{ for(const b of S.bodies.values()) if(fn(b)) return true; return false; };
  if(has(b=>b.kind==='iface')) h+='<span class="lg"><i class="sh iface"></i>interface</span>';
  if(has(b=>b.envKind==='Source')) h+='<span class="lg"><i class="sh src"></i>source</span>';
  if(has(b=>b.envKind==='Sink')) h+='<span class="lg"><i class="sh sink"></i>sink</span>';
  if(has(b=>b.envKind==='Neutral')) h+='<span class="lg"><i class="sh neu"></i>neutral</span>';
  if(S.ports.length) h+='<span class="lg"><i class="sh port"></i>port</span>';

}

/* ---------- layout (explode) ---------- */
function layout(){
  const e=explode, sx=1+KC*e, A=S.a*sx, B=S.b*sx, C=S.c*sx;
  S.shell.scale.set(A,B,C);
  S.bodies.forEach(b=>{
    if(b.kind==='comp') b.pos.copy(b.base).addScaledVector(b.dir,KC*e*rho0(b.dir));
    else if(b.kind==='iface'){ b.pos.copy(b.dir).multiplyScalar(rho0(b.dir)*sx); b.mesh.quaternion.setFromUnitVectors(UP,ellN(b.pos,A,B,C)); }
    else b.pos.copy(b.base).multiplyScalar(sx).addScaledVector(b.dir,DE*e);
    b.mesh.position.copy(b.pos); b.hit.position.copy(b.pos);
  });
  S.ports.forEach(p=>{ p.pos.copy(p.dir).multiplyScalar(rho0(p.dir)*sx); p.normal.copy(ellN(p.pos,A,B,C)); p.grp.position.copy(p.pos); p.grp.quaternion.setFromUnitVectors(ZA,p.normal); });
  S.flows.forEach(buildFlowGeo);
  ensureDots();
  if(selected&&S.bodies.has(selected)) S.selRing.position.copy(S.bodies.get(selected).pos);
}

function flowPoints(f){
  const pa=f.A.pos, pb=f.B.pos, off=(f.gi-(f.gn-1)/2)*SEP;
  let curve,labelPt;
  if(f.port){
    const Pp=f.port.pos, N=f.port.normal, cb=f.port.comp, eb=f.port.env;
    const perp=new V3().crossVectors(N,ZA); if(perp.length()<0.3) perp.crossVectors(N,UP); perp.normalize();
    const Po=Pp.clone().addScaledVector(perp,off);
    const inner=Po.clone().addScaledVector(N,-1.2), outer=Po.clone().addScaledVector(N,1.4);
    const cp=cb.pos, ep=eb.pos, list=[cp.clone()];
    if(cb.kind!=='iface'){ if(cp.distanceTo(inner)>1.6) list.push(cp.clone().lerp(inner,0.5).addScaledVector(perp,off*0.6)); list.push(inner); }
    list.push(Po,outer);
    const m2=outer.clone().lerp(ep,0.5).addScaledVector(perp,off*0.8);
    if(outer.distanceTo(ep)>1.6) list.push(m2);
    list.push(ep.clone());
    if(f.A!==cb) list.reverse();
    curve=new THREE.CatmullRomCurve3(list,false,'centripetal');
    labelPt=m2;
  } else {
    const flip=f.a>f.b, c0=flip?pb:pa, c1=flip?pa:pb;
    const d=new V3().subVectors(c1,c0), len=d.length();
    const perp=new V3().crossVectors(d,ZA); if(perp.length()<0.3*len) perp.crossVectors(d,UP); if(perp.lengthSq()<1e-10) perp.set(1,0,0); perp.normalize();
    const mid=pa.clone().lerp(pb,0.5), out=mid.clone(); if(out.lengthSq()>1e-6) out.normalize(); else out.copy(ZA);
    const ctrl=mid.clone().addScaledVector(perp,off*2).addScaledVector(out,len*0.08);
    curve=new THREE.QuadraticBezierCurve3(pa.clone(),ctrl,pb.clone());
    labelPt=curve.getPoint(0.5);
  }
  return {pts:curve.getSpacedPoints(96),labelPt};
}

function buildFlowGeo(f){
  const fp=flowPoints(f), pts=fp.pts, pa=f.A.pos, pb=f.B.pos;
  const rs=f.A.radius+0.1, re=f.B.radius+0.12;
  let s=0; while(s<pts.length-2&&pts[s].distanceTo(pa)<rs) s++;
  let e=pts.length-1; while(e>s+1&&pts[e].distanceTo(pb)<re) e--;
  const alen=f.ar*2.7; let bi=e, acc=0; while(bi>s+1&&acc<alen){ acc+=pts[bi].distanceTo(pts[bi-1]); bi--; }
  const tube=pts.slice(s,bi+1);
  const g=tube.length>=2?tubeGeometry(tube,f.r,f.dashed?0.32:0,0.2):new THREE.BufferGeometry();
  f.mesh.geometry.dispose(); f.mesh.geometry=g;
  const base=pts[bi], tip=pts[e], dir=new V3().subVectors(tip,base), h=dir.length();
  if(h>1e-4){ dir.divideScalar(h); f.arrow.visible=true; f.arrow.position.copy(base); f.arrow.quaternion.setFromUnitVectors(UP,dir); f.arrow.scale.set(f.ar,h,f.ar); }
  else f.arrow.visible=false;
  f.poly=pts.slice(s,e+1); f.cum=[0];
  for(let i=1;i<f.poly.length;i++) f.cum.push(f.cum[i-1]+f.poly[i].distanceTo(f.poly[i-1]));
  f.len=f.cum[f.cum.length-1]||0; f.labelPt=fp.labelPt;
}

function ensureDots(){
  let n=0; S.flows.forEach(f=>{ n+=Math.ceil((f.len||0)/DOT_SP)+2; });
  if(n>S.dotCap){
    S.dotCap=Math.ceil(n*1.3)+16;
    const g=new THREE.BufferGeometry();
    g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(S.dotCap*3),3));
    g.setAttribute('color',new THREE.BufferAttribute(new Float32Array(S.dotCap*3),3));
    g.setDrawRange(0,0);
    S.dots.geometry.dispose(); S.dots.geometry=g;
  }
}
function updateDots(ms){
  const g=S.dots.geometry; if(!g.attributes.position) return;
  const pa=g.attributes.position.array, ca=g.attributes.color.array, ph=(ms/1000*1.3)%DOT_SP; let n=0;
  for(const f of S.flows){
    if(f.dim||!f.poly||f.poly.length<2) continue;
    const Pl=f.poly, Ls=f.cum, c=f.col3; let k=1;
    for(let s=ph;s<f.len&&n<S.dotCap;s+=DOT_SP){
      while(k<Ls.length-1&&Ls[k]<s) k++;
      const t=clamp((s-Ls[k-1])/Math.max(1e-6,Ls[k]-Ls[k-1]),0,1), p0=Pl[k-1], p1=Pl[k];
      pa[n*3]=p0.x+(p1.x-p0.x)*t; pa[n*3+1]=p0.y+(p1.y-p0.y)*t; pa[n*3+2]=p0.z+(p1.z-p0.z)*t;
      ca[n*3]=c.r; ca[n*3+1]=c.g; ca[n*3+2]=c.b; n++;
    }
  }
  g.setDrawRange(0,n); g.attributes.position.needsUpdate=true; g.attributes.color.needsUpdate=true;
}

/* ---------- camera ---------- */
function applyCam(){
  phi=clamp(phi,0.08,Math.PI-0.08); radius=clamp(radius,2,1500);
  const sp=Math.sin(phi);
  camera.position.set(target.x+radius*sp*Math.sin(theta),target.y+radius*Math.cos(phi),target.z+radius*sp*Math.cos(theta));
  camera.lookAt(target); camera.updateMatrixWorld();
}
function fit(reset){
  if(!S) return;
  if(reset){ theta=DEF_T; phi=DEF_P; }
  const sx=1+KC*explode, A=S.a*sx, B=S.b*sx, C=S.c*sx, pts=[];
  S.bodies.forEach(b=>pts.push(b.pos));
  pts.push(new V3(A,0,0),new V3(-A,0,0),new V3(0,B,0),new V3(0,-B,0),new V3(0,0,C),new V3(0,0,-C));
  new THREE.Box3().setFromPoints(pts).getCenter(target);
  const back=new V3(Math.sin(phi)*Math.sin(theta),Math.cos(phi),Math.sin(phi)*Math.cos(theta));
  const right=new V3().crossVectors(UP,back).normalize(), up=new V3().crossVectors(back,right);
  const tv=Math.tan(camera.fov*Math.PI/360), th=tv*camera.aspect, mx=stage.clientWidth<600?0.8:0.84, my=0.84;
  let d=5; const r=new V3();
  for(const p of pts){ r.copy(p).sub(target); const z=r.dot(back), pad=0.8;
    d=Math.max(d,z+pad+(Math.abs(r.dot(right))+pad)/(th*mx),z+pad+(Math.abs(r.dot(up))+pad)/(tv*my)); }
  radius=d; applyCam();
}

/* ---------- render on demand ---------- */
function requestRender(){ if(!ready||raf) return; raf=requestAnimationFrame(frame); }
function frame(ms){
  raf=0;
  if(!ready||lost||!S) return;
  if(texOn) updateDots(ms);
  if(S.selRing.visible) S.selRing.quaternion.copy(camera.quaternion);
  renderer.render(scene,camera);
  placeLabels();
  if(texOn) raf=requestAnimationFrame(frame);
}

/* ---------- labels ---------- */
const _v=new V3(), _r=new V3();
const RING_ANG=[]; for(let i=0;i<16;i++) RING_ANG.push(i/16*Math.PI*2);
function project(p){ _v.copy(p).project(camera); return {x:(_v.x+1)/2*VW,y:(1-_v.y)/2*VH,ok:_v.z<1&&_v.z>-1}; }
function overl(a,b){ return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y; }
function screenR(p,r){ const c=project(p); _r.setFromMatrixColumn(camera.matrixWorld,0); const q=project(p.clone().addScaledVector(_r,r)); return Math.max(3,Math.hypot(q.x-c.x,q.y-c.y)); }
function bodyCands(sx,sy,rr,w,h){
  const g=4, q=rr*0.72+2, o=[
    {x:sx+rr+g,y:sy-h/2},{x:sx-rr-g-w,y:sy-h/2},{x:sx-w/2,y:sy-rr-g-h},{x:sx-w/2,y:sy+rr+g},
    {x:sx+q,y:sy-q-h},{x:sx+q,y:sy+q},{x:sx-q-w,y:sy-q-h},{x:sx-q-w,y:sy+q}];
  for(let k=1;k<=14;k++){ const d=rr+8+k*13; for(const an of RING_ANG){ const cx=Math.cos(an), cy=Math.sin(an); o.push({x:sx+cx*(d+w/2)-w/2,y:sy+cy*(d+h/2)-h/2,far:true}); } }
  return o;
}
function smallCands(sx,sy,w,h){ return [{x:sx-w/2,y:sy-h/2},{x:sx-w/2,y:sy-h-5},{x:sx-w/2,y:sy+5},{x:sx+6,y:sy-h/2},{x:sx-w-6,y:sy-h/2},{x:sx+6,y:sy-h-4},{x:sx-w-6,y:sy+4}]; }
function tryPlace(cs,w,h,placed,discs,skipId,strict){
  let fb=null;
  for(const c of cs){
    const r={x:c.x-2,y:c.y-2,w:w+4,h:h+4}; let bad=false;
    for(const p of placed){ if(overl(r,p)){ bad=true; break; } }
    if(bad) continue;
    const inV=c.x>=2&&c.y>=2&&c.x+w<=VW-2&&c.y+h<=VH-2; let hit=false;
    if(inV){ for(const d of discs){ if(d.id!==skipId&&overl(r,d)){ hit=true; break; } } }
    if(inV&&!hit) return {c,r};
    if(!fb&&!strict) fb={c,r};
  }
  return fb;
}
function placeLabels(){
  VW=stage.clientWidth; VH=stage.clientHeight;
  const placed=[], discs=[], sr=stage.getBoundingClientRect();
  [legendEl,panel].forEach(el=>{ if(el.hidden) return; const r=el.getBoundingClientRect(); if(r.width>0&&r.height>0) placed.push({x:r.left-sr.left,y:r.top-sr.top,w:r.width,h:r.height}); });
  S.bodies.forEach(b=>{ const c=project(b.pos); b.sx=c.x; b.sy=c.y; b.vis=c.ok; b.rr=screenR(b.pos,b.radius); if(c.ok) discs.push({x:c.x-b.rr,y:c.y-b.rr,w:2*b.rr,h:2*b.rr,id:b.id}); });
  S.ports.forEach((p,i)=>{ const c=project(p.pos); p.sx=c.x; p.sy=c.y; p.vis=c.ok; if(c.ok){ const rr=screenR(p.pos,p.r); discs.push({x:c.x-rr,y:c.y-rr,w:2*rr,h:2*rr,id:'port'+i}); } });
  let lines='';
  for(const b of S.order){
    const el=b.lab;
    if(!b.vis){ el.style.visibility='hidden'; continue; }
    const res=tryPlace(bodyCands(b.sx,b.sy,b.rr,b.lw,b.lh),b.lw,b.lh,placed,discs,b.id,false);
    if(!res){ el.style.visibility='hidden'; continue; }
    placed.push(res.r);
    const c=res.c; el.style.visibility='visible'; el.style.transform='translate('+Math.round(c.x)+'px,'+Math.round(c.y)+'px)';
    if(c.far){
      const x2=clamp(b.sx,c.x,c.x+b.lw), y2=clamp(b.sy,c.y,c.y+b.lh), dx=x2-b.sx, dy=y2-b.sy, L=Math.hypot(dx,dy)||1;
      lines+='<line'+(b.dim?' class="dim"':'')+' x1="'+(b.sx+dx/L*b.rr).toFixed(1)+'" y1="'+(b.sy+dy/L*b.rr).toFixed(1)+'" x2="'+x2.toFixed(1)+'" y2="'+y2.toFixed(1)+'"/>';
    }
  }
  S.ports.forEach(p=>{ p.lab.style.visibility='hidden'; });
  S.ports.filter(p=>p.hot&&p.vis).forEach(p=>{
    const res=tryPlace(smallCands(p.sx,p.sy,p.lw,p.lh),p.lw,p.lh,placed,discs,null,true);
    if(!res) return; placed.push(res.r); p.lab.style.visibility='visible'; p.lab.style.transform='translate('+Math.round(res.c.x)+'px,'+Math.round(res.c.y)+'px)';
  });
  const fl=S.flows.filter(f=>f.lab);
  fl.forEach(f=>{ f.lab.style.visibility='hidden'; });
  fl.filter(f=>!f.dim).sort((x,y)=>((y.hot?1:0)-(x.hot?1:0))||(y.r-x.r)).forEach(f=>{
    const c=project(f.labelPt); if(!c.ok) return;
    const res=tryPlace(smallCands(c.x,c.y,f.lw,f.lh),f.lw,f.lh,placed,discs,null,true);
    if(!res) return; placed.push(res.r); f.lab.style.visibility='visible'; f.lab.style.transform='translate('+Math.round(res.c.x)+'px,'+Math.round(res.c.y)+'px)';
  });
  leaders.innerHTML=lines;
}

/* ---------- selection / isolate ---------- */
function applyIsolation(){
  if(!S) return;
  const sel=selected, nb=new Set();
  if(sel){ nb.add(sel); S.flows.forEach(f=>{ if(f.a===sel) nb.add(f.b); if(f.b===sel) nb.add(f.a); }); }
  S.bodies.forEach(b=>{
    const full=!sel||nb.has(b.id); let op=full?1:0.13;
    if(b.orphan&&b.id!==sel) op=full?0.38:0.1;
    b.mesh.material.opacity=op; b.dim=!full;
    b.lab.classList.toggle('dim',!full); b.lab.classList.toggle('sel',b.id===sel);
  });
  S.flows.forEach(f=>{ f.dim=!!sel&&f.a!==sel&&f.b!==sel; f.hot=!!sel&&!f.dim; f.mat.opacity=f.dim?0.06:f.baseOp; });
  S.ports.forEach(p=>{ p.dim=!!sel&&p.comp.id!==sel&&p.env.id!==sel; p.hot=!!sel&&!p.dim; p.ringMat.opacity=p.dim?0.12:0.9; p.discMat.opacity=p.dim?0.03:0.16; });
  const rank=b=>b.id===sel?0:(sel&&nb.has(b.id))?1:b.kind==='comp'?2:b.kind==='iface'?3:!b.orphan?4:5;
  S.order=[...S.bodies.values()].sort((x,y)=>(rank(x)-rank(y))||x.name.localeCompare(y.name));
  if(sel&&S.bodies.has(sel)){ const b=S.bodies.get(sel); S.selRing.visible=true; S.selRing.position.copy(b.pos); S.selRing.scale.setScalar(b.radius*1.45); }
  else S.selRing.visible=false;
}
function selectThing(id){
  if(!S) return;
  selected=(id!=null&&S.bodies.has(id))?id:null;
  applyIsolation(); renderPanel(); requestRender();
}
function renderPanel(){
  if(!S||!selected||!S.bodies.has(selected)){ panel.hidden=true; panel.innerHTML=''; return; }
  const b=S.bodies.get(selected);
  let role=b.kind==='env'?('Environment · '+b.envKind):(b.kind==='iface'?'Component · interface':'Component');
  if(b.kind==='comp'&&b.boundary) role+=' · boundary';
  if(b.orphan) role+=' · orphan';
  const fs=S.flows.filter(f=>f.a===selected||f.b===selected);
  let h='<div class="ph"><div><div class="pn">'+esc(b.name)+'</div><div class="pr">'+esc(role)+'</div></div><button type="button" class="px" aria-label="clear selection" title="clear (Esc)">×</button></div>';
  if(fs.length){
    h+='<ul class="pl">'+fs.map(f=>{ const out=f.a===selected, o=out?f.B:f.A;
      return '<li><i class="sw'+(f.dashed?' dash':'')+'" style="--c:'+f.color+'"></i><div><div class="fn">'+esc(f.name||'unnamed')+'</div><div class="fm">'+(out?'→ ':'← ')+esc(o.name)+' · '+esc(f.kind)+' · '+esc(amountText(f))+(f.bond?'':' · relation')+'</div></div></li>'; }).join('')+'</ul>';
  } else h+='<div class="pe">no flows</div>';
  const ps=S.ports.filter(p=>p.comp.id===selected||p.env.id===selected);
  if(ps.length) h+='<ul class="pl">'+ps.map(p=>'<li><i class="sw port"></i><div><div class="fn">port · '+esc(p.protocol||'—')+'</div><div class="fm">'+esc(p.comp.name)+' ↔ '+esc(p.env.name)+(p.direction?' · '+esc(p.direction):'')+'</div></div></li>').join('')+'</ul>';
  panel.innerHTML=h; panel.hidden=false;
  panel.querySelector('.px').addEventListener('click',()=>selectThing(null));
}

/* ---------- input ---------- */
function pickAt(x,y){
  if(!S) return null;
  const r=renderer.domElement.getBoundingClientRect();
  ndc.set((x-r.left)/r.width*2-1,-(y-r.top)/r.height*2+1);
  ray.setFromCamera(ndc,camera);
  const hits=ray.intersectObjects(S.pick,false);
  return hits.length?hits[0].object.userData.id:null;
}
function pdist(){ const a=[...pointers.values()]; return a.length<2?0:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y); }
stage.addEventListener('pointerdown',e=>{
  if(!S||e.target.closest('#panel')) return;
  if(e.button!==undefined&&e.button!==0&&e.pointerType==='mouse') return;
  try{ stage.setPointerCapture(e.pointerId); }catch(err){}
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size===1){ down={x:e.clientX,y:e.clientY,moved:false,target:e.target}; stage.style.cursor='grabbing'; }
  else { if(down) down.moved=true; pinch=pdist(); }
});
stage.addEventListener('pointermove',e=>{
  const p=pointers.get(e.pointerId);
  if(!p){ if(S&&e.pointerType==='mouse'&&!e.target.closest('#panel')) stage.style.cursor=(e.target.closest('.lab')||pickAt(e.clientX,e.clientY))?'pointer':'grab'; return; }
  const dx=e.clientX-p.x, dy=e.clientY-p.y; p.x=e.clientX; p.y=e.clientY;
  if(down&&!down.moved&&Math.hypot(e.clientX-down.x,e.clientY-down.y)>5) down.moved=true;
  if(pointers.size===1){ if(down&&!down.moved) return; theta-=dx*0.0075; phi-=dy*0.0075; applyCam(); requestRender(); }
  else if(pointers.size===2){ const d=pdist(); if(pinch>0&&d>0){ radius*=pinch/d; autoFit=false; applyCam(); requestRender(); } pinch=d; }
});
function endPtr(e){
  if(!pointers.has(e.pointerId)) return;
  pointers.delete(e.pointerId);
  if(pointers.size<2) pinch=0;
  if(e.type==='pointerup'&&down&&!down.moved&&pointers.size===0){
    const lab=down.target&&down.target.closest?down.target.closest('.lab'):null;
    selectThing(lab?lab.dataset.id:pickAt(e.clientX,e.clientY));
  }
  if(pointers.size===0){ down=null; stage.style.cursor='grab'; }
}
stage.addEventListener('pointerup',endPtr);
stage.addEventListener('pointercancel',endPtr);
stage.addEventListener('wheel',e=>{
  if(!S||e.target.closest('#panel')) return;
  e.preventDefault();
  const k=e.deltaMode===1?0.05:(e.deltaMode===2?0.5:0.0015);
  radius*=Math.exp(clamp(e.deltaY,-300,300)*k); autoFit=false; applyCam(); requestRender();
},{passive:false});
window.addEventListener('keydown',e=>{
  if(!S) return;
  if(e.key==='Escape'){ selectThing(null); return; }
  const ae=document.activeElement;
  if(ae&&((ae.tagName==='INPUT'&&ae.type==='range')||ae.tagName==='SELECT'||ae.tagName==='TEXTAREA')) return;
  const st=0.087; let hit=true;
  if(e.key==='ArrowLeft') theta-=st; else if(e.key==='ArrowRight') theta+=st;
  else if(e.key==='ArrowUp') phi-=st; else if(e.key==='ArrowDown') phi+=st;
  else if(e.key==='Home'){ autoFit=true; fit(true); }
  else hit=false;
  if(hit){ e.preventDefault(); applyCam(); requestRender(); }
});
fitBtn.addEventListener('click',()=>{ if(!S) return; autoFit=true; fit(true); requestRender(); });
explodeIn.addEventListener('input',()=>{
  explode=explodeIn.value/100; expOut.textContent=explodeIn.value+'%';
  if(!S) return; layout(); if(autoFit) fit(false); requestRender();
});
modelSel.addEventListener('change',()=>{ selected=null; buildModel(+modelSel.value||0,false); });

function resize(){
  if(!ready) return;
  const w=Math.max(1,stage.clientWidth), h=Math.max(1,stage.clientHeight);
  renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix();
  if(S&&autoFit) fit(false); else applyCam();
  requestRender();
}
if(window.ResizeObserver) new ResizeObserver(resize).observe(stage); else window.addEventListener('resize',resize);

resize();
try{ buildModel(0,false); }catch(err){ showMsg('This model could not be drawn.'); if(window.console) console.error(err); }
resize();
})();
</script>
</body>
</html>
