<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Facets</title>
<link rel="icon" href="/chat/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Portal for facets.systems — two doors. Halcyonic Frost: cool light ground,
     teal + indigo accents, Cormorant Garamond display over Inter. Straight edges. */
  :root {
    --ground: #f8fafc;
    --ink: #0f172a;
    --ink-soft: #475569;
    --border: #e2e8f0;
    --card: #ffffff;
    --teal: #0d9488;
    --indigo: #6366f1;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--ground);
    color: var(--ink);
    font-family: "Inter", system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.25rem;
  }
  main { max-width: 44rem; width: 100%; }
  h1 {
    font-family: "Cormorant Garamond", Georgia, serif;
    font-size: 3.2rem;
    font-weight: 600;
    line-height: 1.1;
  }
  .tagline {
    margin-top: 0.5rem;
    color: var(--ink-soft);
    font-size: 1.05rem;
    line-height: 1.55;
    max-width: 34rem;
  }
  .doors {
    margin-top: 2.25rem;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1.1rem;
  }
  @media (max-width: 34rem) { .doors { grid-template-columns: 1fr; } }
  .door {
    display: block;
    border: 1px solid var(--border);
    background: var(--card);
    padding: 1.35rem 1.4rem 1.45rem;
    text-decoration: none;
    color: inherit;
  }
  a.door { transition: border-color 120ms ease, transform 120ms ease, box-shadow 120ms ease; }
  a.door:hover {
    border-color: var(--door-accent);
    transform: translateY(-2px);
    box-shadow: 0 6px 18px rgba(15, 23, 42, 0.06);
  }
  .door h2 {
    font-family: "Cormorant Garamond", Georgia, serif;
    font-size: 1.6rem;
    font-weight: 600;
  }
  .door p {
    margin-top: 0.5rem;
    color: var(--ink-soft);
    font-size: 0.92rem;
    line-height: 1.55;
  }
  .door .go {
    display: inline-block;
    margin-top: 0.85rem;
    font-size: 0.85rem;
    font-weight: 600;
    letter-spacing: 0.01em;
    color: var(--door-accent);
  }
  .door.dark { background: transparent; border-style: dashed; }
  .gem { display: block; margin-bottom: 1.1rem; }
  .door.dark .go { color: var(--ink-soft); font-weight: 500; }
</style>
</head>
<body>
<main>
  <svg class="gem" width="44" height="44" viewBox="0 0 80 80" aria-hidden="true">
    <polygon points="40,4 71,19 78,52 57,76 23,76 2,52 9,19" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <polygon points="40,4 71,19 40,40" fill="#6366f1" opacity="0.14"/>
    <polygon points="23,76 2,52 40,40" fill="#0d9488" opacity="0.16"/>
    <line x1="40" y1="4"  x2="40" y2="40" stroke="#94a3b8" stroke-width="0.8" opacity="0.6"/>
    <line x1="71" y1="19" x2="40" y2="40" stroke="#94a3b8" stroke-width="0.8" opacity="0.6"/>
    <line x1="78" y1="52" x2="40" y2="40" stroke="#94a3b8" stroke-width="0.8" opacity="0.6"/>
    <line x1="57" y1="76" x2="40" y2="40" stroke="#94a3b8" stroke-width="0.8" opacity="0.6"/>
    <line x1="23" y1="76" x2="40" y2="40" stroke="#94a3b8" stroke-width="0.8" opacity="0.6"/>
    <line x1="2"  y1="52" x2="40" y2="40" stroke="#94a3b8" stroke-width="0.8" opacity="0.6"/>
    <line x1="9"  y1="19" x2="40" y2="40" stroke="#94a3b8" stroke-width="0.8" opacity="0.6"/>
  </svg>
  <h1>Facets</h1>
  <p class="tagline">Make sense of any system: ask questions, or build one and watch it run.</p>

  <div class="doors">
    <a class="door" href="/chat/" style="--door-accent: var(--indigo)">
      <h2>Chat</h2>
      <p>Why don&rsquo;t cities collapse? How does a cell know what to build?
      Ask about anything that works like a system, and every answer shows
      its sources.</p>
      <span class="go">Start asking &rarr;</span>
    </a>
    <div id="model-door"></div>
  </div>
</main>
<script>
  // Flipped to true by publish-site.sh --with-model; until then the Model door
  // announces itself without opening.
  var MODEL_LIVE = false;
  var el = document.getElementById('model-door');
  if (MODEL_LIVE) {
    el.outerHTML = '<a class="door" href="/model/" style="--door-accent: var(--teal)">'
      + '<h2>Model</h2>'
      + '<p>Sketch a system on a canvas: a supply chain, an ecosystem, an economy. '
      + 'Check that it holds together, then press run and watch it flow.</p>'
      + '<span class="go">Start building &rarr;</span></a>';
  } else {
    el.outerHTML = '<div class="door dark" style="--door-accent: var(--teal)">'
      + '<h2>Model</h2>'
      + '<p>Sketch a system on a canvas: a supply chain, an ecosystem, an economy. '
      + 'Check that it holds together, then press run and watch it flow.</p>'
      + '<span class="go">Coming soon</span></div>';
  }
</script>
</body>
</html>
